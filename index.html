const DM_FEATS=[['Scattered vascular bundles in stem','M'],['Tap root system','D'],['Parallel venation','M'],['Reticulate venation','D'],['Vascular bundles arranged in a ring','D'],['Polyarch xylem – more than six bundles','M'],['Two to four xylem patches in root','D'],['Large, well-developed pith in root','M'],['Collenchymatous hypodermis','D'],['Sclerenchymatous hypodermis','M'],['Bulliform cells','M'],['Palisade and spongy mesophyll','D'],['Stomata on both leaf surfaces (isobilateral)','M'],['Conjoint, open bundles with cambium','D'],['Conjoint, closed bundles','M'],['Fibrous root system','M'],['Embryo with two cotyledons','D'],['Scutellum','M'],['Coleoptile and coleorhiza','M'],['Water-containing cavities in vascular bundles','M'],['Phloem parenchyma absent','M'],['Medullary rays between bundles','D'],['Cambium ring develops in root (secondary growth)','D'],['Leaf base expands into a sheath','M'],['Dumb-bell shaped guard cells','M'],['Gram seed','D'],['Maize grain','M'],['Wheat plant','M'],['Mustard plant','D'],['Dorsiventral leaf','D'],['Endodermis called starch sheath (stem)','D'],['Peripheral bundles smaller than central ones','M']];

    $('[data-h=s]',scr).textContent=`⭐ ${score}`;$('[data-h=k]',scr).textContent=`🔥 ${streak}`;if(ok&&streak>=3)$('[data-h=k]',scr).animate([{transform:'scale(1.4)'},{transform:'none'}],{duration:400});

/* ===== Biology Chapter 1 · The Living World ===== */

/* ---------- notes ---------- */
n5('c1-intro',{notes:`
<h4>Unit 1 · Diversity in the living world</h4><ul>
<li><b>Biology</b> is the science of <b>life forms and living processes</b>. The living world has an amazing <b>diversity</b> of living organisms.</li>
<li>Early man could easily tell <b>inanimate matter</b> from <b>living organisms</b>; he <b>deified</b> some inanimate matter (wind, sea, fire) and some animals and plants – all of which evoked <b>awe or fear</b>.</li>
<li>Description of living organisms, including human beings, began much later. Societies with an <b>anthropocentric view</b> of biology made limited progress.</li>
<li>Systematic description of life forms brought, out of necessity, detailed systems of <b>identification, nomenclature and classification</b>.</li>
<li>The biggest spin-off: recognising that living organisms <b>share similarities</b> both horizontally and vertically – all present-day organisms are <b>related</b> to each other and to all organisms that ever lived. This humbled man and led to movements for <b>conservation of biodiversity</b>.</li></ul>
<h4>Chapter 1 · What is life?</h4><ul>
<li>Living organisms are found in extraordinary <b>habitats</b> – cold mountains, deciduous forests, oceans, fresh water lakes, deserts, hot springs.</li>
<li>The question <b>“what indeed is life?”</b> has two parts: a <b>technical</b> one – what living is, as opposed to non-living – and a <b>philosophical</b> one – what the purpose of life is.</li>
<li>As scientists, we <b>do not attempt the second</b> question; we reflect on <b>what is living</b>.</li></ul>
<h4>Meet Ernst Mayr (1904 – 2004)</h4><ul>
<li>Born 5 July 1904 in Kempten, Germany; Harvard evolutionary biologist called <b>‘The Darwin of the 20th century’</b>.</li>
<li>Research spanned ornithology, taxonomy, zoogeography, evolution, systematics and the history and philosophy of biology.</li>
<li>Made the <b>origin of species diversity</b> the central question of evolutionary biology; pioneered the currently accepted definition of a <b>biological species</b>.</li>
<li>Won the ‘triple crown’ of biology: <b>Balzan Prize (1983)</b>, <b>International Prize for Biology (1994)</b>, <b>Crafoord Prize (1999)</b>.</li></ul>`,
terms:[['Biology','Science of life forms and living processes'],['Anthropocentric view','Human-centred view of biology – limited progress'],['Technical question','What is living, as opposed to non-living?'],['Philosophical question','What is the purpose of life? (not attempted by scientists)'],['Ernst Mayr','‘Darwin of the 20th century’; defined biological species']],qk:'living|Mayr|habitat'});
n5('c1-div',{notes:`
<h4><span class="num">1.1</span>Diversity in the living world</h4><ul>
<li>Look around – potted plants, insects, birds, pets… plus many organisms <b>too small to see</b> with the naked eye.</li>
<li>If you <b>increase the area</b> of observation, the <b>range and variety</b> of organisms increases; a dense forest has a much greater number and kinds of organisms.</li>
<li>Each different kind of plant, animal or organism represents a <span class="term">species</span>.</li>
<li>The number of species known and described is <b>1.7 – 1.8 million</b>. This refers to <span class="term">biodiversity</span> – the number and types of organisms present on earth.</li>
<li>As we explore new areas, and even old ones, <b>new organisms are continuously being identified</b>.</li></ul>
<h4>Why we need standard names</h4><ul>
<li>We know organisms in our own area by their <b>local names</b>, which vary from place to place, even within a country – this would create <b>confusion</b>.</li>
<li>So naming is <b>standardised</b> so that a particular organism is known by the <b>same name all over the world</b> – this process is <span class="term">nomenclature</span>.</li>
<li>Naming is possible only when the organism is <b>described correctly</b> and we know which organism the name is attached to – this is <span class="term">identification</span>.</li></ul>`,
terms:[['Species','Each different kind of plant, animal or organism'],['Biodiversity','Number and types of organisms present on earth'],['1.7–1.8 million','Number of species known and described'],['Nomenclature','Standardised naming – same name all over the world'],['Identification','Describing an organism correctly so the name can be attached']],qk:'biodiversity|million|nomenclature|identification|local'});
n5('c1-nom',{notes:`
<h4><span class="num">1.1</span>Scientific names</h4><ul>
<li>Scientists have set procedures to give a <b>scientific name</b> to each known organism, accepted by biologists all over the world.</li>
<li><b>Plants</b>: names follow the <span class="term">International Code for Botanical Nomenclature (ICBN)</span>.</li>
<li><b>Animals</b>: the <span class="term">International Code of Zoological Nomenclature (ICZN)</span>.</li>
<li>Scientific names ensure each organism has <b>only one name</b>, that people anywhere arrive at the <b>same name</b> from its description, and that the name has <b>not been used for any other</b> known organism.</li></ul>
<h4>Binomial nomenclature</h4><ul>
<li>Each name has two components – the <b>generic name</b> and the <b>specific epithet</b>. This two-part system is <span class="term">binomial nomenclature</span>, given by <b>Carolus Linnaeus</b>.</li>
<li>Example: mango is <i>Mangifera indica</i> – <i>Mangifera</i> is the <b>genus</b>, <i>indica</i> is the <b>specific epithet</b>.</li></ul>
<h4>Universal rules of nomenclature</h4><ul>
<li><b>1.</b> Biological names are generally in <b>Latin</b> and written in <b>italics</b>; they are Latinised or derived from Latin irrespective of their origin.</li>
<li><b>2.</b> The <b>first word</b> represents the <b>genus</b>; the <b>second</b> denotes the <b>specific epithet</b>.</li>
<li><b>3.</b> When <b>handwritten</b>, both words are <b>separately underlined</b>; when printed, they are in <b>italics</b> – to show their Latin origin.</li>
<li><b>4.</b> The genus starts with a <b>capital letter</b>; the specific epithet with a <b>small letter</b> – <i>Mangifera indica</i>.</li>
<li>The <b>author’s name</b> appears after the specific epithet, in an <b>abbreviated</b> form – <i>Mangifera indica</i> <b>Linn.</b> – meaning the species was first described by <b>Linnaeus</b>.</li></ul>`,
terms:[['ICBN','International Code for Botanical Nomenclature – plants'],['ICZN','International Code of Zoological Nomenclature – animals'],['Binomial nomenclature','Two-part name: generic name + specific epithet'],['Carolus Linnaeus','Gave the binomial naming system'],['Generic name','First word – genus, capital letter'],['Specific epithet','Second word – small letter'],['Linn.','Author abbreviation – first described by Linnaeus']],qk:'ICBN|ICZN|binomial|Linnaeus|italic|epithet|Mangifera|capital|underline|Latin'});
n5('c1-tax',{notes:`
<h4><span class="num">1.1</span>Classification and taxa</h4><ul>
<li>It is nearly impossible to study all organisms, so we need <span class="term">classification</span> – grouping anything into <b>convenient categories</b> based on <b>easily observable characters</b>.</li>
<li>Examples of such groups: plants, animals, dogs, cats, insects, mammals (animals with external ears and body hair), wheat, rice. Saying ‘dog’ brings dogs to mind, not cats; ‘Alsatians’ is more specific still.</li>
<li>The scientific term for these categories is <span class="term">taxa</span>. Taxa can be at <b>very different levels</b>: ‘plants’ and ‘wheat’ are both taxa; ‘animals’, ‘mammals’ and ‘dogs’ are taxa at different levels – a dog is a mammal and mammals are animals.</li></ul>
<h4>Taxonomy</h4><ul>
<li>Classifying all living organisms into different taxa based on characteristics is <span class="term">taxonomy</span>.</li>
<li>Basis of modern taxonomic studies: <b>external and internal structure</b>, <b>structure of the cell</b>, <b>development process</b> and <b>ecological information</b>.</li>
<li><b>Characterisation, identification, classification and nomenclature</b> are the processes basic to taxonomy.</li>
<li>Taxonomy is not new: the <b>earliest classifications were based on the ‘uses’</b> of organisms – for food, clothing and shelter.</li></ul>
<h4>Systematics</h4><ul>
<li>Study of the different kinds of organisms, their diversities <b>and the relationships among them</b> = <span class="term">systematics</span>.</li>
<li>From the Latin <b>‘systema’</b> – systematic arrangement of organisms. Linnaeus titled his publication <b><i>Systema Naturae</i></b>.</li>
<li>Its scope was later enlarged to include <b>identification, nomenclature and classification</b>. Systematics takes into account <b>evolutionary relationships</b> between organisms.</li></ul>`,
terms:[['Classification','Grouping into convenient categories by easily observable characters'],['Taxa','Scientific term for categories (singular: taxon)'],['Taxonomy','Classifying organisms into taxa based on characteristics'],['Basic taxonomic processes','Characterisation, identification, classification, nomenclature'],['Earliest classification','Based on uses of organisms'],['Systematics','Kinds of organisms, diversity and relationships'],['Systema Naturae','Linnaeus’ publication; ‘systema’ = systematic arrangement']],qk:'taxa|taxonomy|systematics|classification|Systema|uses'});
n5('c1-hier',{notes:`
<h4><span class="num">1.2</span>Taxonomic categories</h4><ul>
<li>Classification is <b>not a single step</b>; it involves a <b>hierarchy of steps</b>, each step a <b>rank or category</b>.</li>
<li>Each is called a <span class="term">taxonomic category</span>; all categories together form the <span class="term">taxonomic hierarchy</span>.</li>
<li>Each category is a <b>unit of classification</b>, represents a <b>rank</b> and is commonly termed a <span class="term">taxon</span> (pl. <b>taxa</b>).</li>
<li>Example: <b>insects</b> share three pairs of jointed legs – a recognisable concrete group, so they were given a rank. Groups represent category; category denotes rank.</li>
<li>Taxonomic groups are <b>distinct biological entities</b>, not merely morphological aggregates.</li>
<li>Common categories: <b>kingdom, phylum or division (for plants), class, order, family, genus, species</b>. <b>Species</b> is the <b>lowest</b> category for all organisms.</li>
<li>To place an organism in categories you need <b>knowledge of its characters</b> – to find similarities and dissimilarities.</li></ul>
<h4>The hierarchy (Fig. 1.1)</h4><ul>
<li>Categories from species to kingdom are shown in <b>ascending order</b> starting with species. Taxonomists have also developed <b>sub-categories</b>.</li>
<li>Going <b>higher</b> from species to kingdom, the <b>number of common characteristics decreases</b>.</li>
<li><b>Lower</b> the taxa, <b>more</b> characteristics the members share. <b>Higher</b> the category, <b>greater the difficulty</b> of determining the relationship to other taxa at the same level – classification becomes more complex.</li></ul>`,
terms:[['Taxonomic category','A rank / step in classification'],['Taxonomic hierarchy','All categories together'],['Taxon','Unit of classification representing a rank (pl. taxa)'],['Lowest category','Species'],['Division','Used for plants in place of phylum'],['Higher category','Fewer common characters, harder to relate']],qk:'hierarch|taxon|lowest|ascending|category|common characteristics'});
n5('c1-ranks',{notes:`
<h4><span class="num">1.2.1</span>Species</h4><ul>
<li>A group of individual organisms with <b>fundamental similarities</b>; distinguishable from closely related species by <b>distinct morphological differences</b>.</li>
<li>In <i>Mangifera indica</i>, <i>Solanum tuberosum</i> (potato) and <i>Panthera leo</i> (lion): <i>indica, tuberosum, leo</i> are <b>specific epithets</b>; <i>Mangifera, Solanum, Panthera</i> are <b>genera</b>.</li>
<li>A genus may have more than one specific epithet: <i>Panthera tigris</i>; <i>Solanum nigrum</i> and <i>S. melongena</i>. Human beings: species <i>sapiens</i>, genus <i>Homo</i> – <b><i>Homo sapiens</i></b>.</li></ul>
<h4><span class="num">1.2.2</span>Genus</h4><ul>
<li>A group of <b>related species</b> with more characters in common than species of other genera – <b>aggregates of closely related species</b>.</li>
<li>Potato and brinjal: different species, same genus <i>Solanum</i>. Lion (<i>P. leo</i>), leopard (<i>P. pardus</i>), tiger (<i>P. tigris</i>): genus <i>Panthera</i>, which differs from genus <i>Felis</i> (cats).</li></ul>
<h4><span class="num">1.2.3</span>Family</h4><ul>
<li>A group of <b>related genera</b> with still fewer similarities than genus and species. Plant families are characterised on both <b>vegetative and reproductive</b> features.</li>
<li><i>Solanum, Petunia, Datura</i> → family <b>Solanaceae</b>. <i>Panthera</i> + <i>Felis</i> → family <b>Felidae</b>. Cat and dog → <b>Felidae</b> and <b>Canidae</b>.</li></ul>
<h4><span class="num">1.2.4</span>Order</h4><ul>
<li>Higher categories are identified on <b>aggregates of characters</b>. Order is an <b>assemblage of families</b> with a few similar characters.</li>
<li><b>Convolvulaceae, Solanaceae</b> → order <b>Polymoniales</b> (mainly floral characters). <b>Felidae, Canidae</b> → order <b>Carnivora</b>.</li></ul>
<h4><span class="num">1.2.5</span>Class</h4><ul>
<li>Includes <b>related orders</b>: order <b>Primata</b> (monkey, gorilla, gibbon) and order <b>Carnivora</b> (tiger, cat, dog) → class <b>Mammalia</b>, which has other orders too.</li></ul>
<h4><span class="num">1.2.6</span>Phylum</h4><ul>
<li>Classes of fishes, amphibians, reptiles, birds and mammals → phylum <b>Chordata</b>, based on the <b>notochord</b> and <b>dorsal hollow neural system</b>.</li>
<li>In <b>plants</b>, classes with a few similar characters form a higher category called <b>Division</b>.</li></ul>
<h4><span class="num">1.2.7</span>Kingdom</h4><ul>
<li>All animals of various phyla → the highest category, <b>Kingdom Animalia</b>. <b>Kingdom Plantae</b> comprises all plants from various divisions.</li></ul>`,
terms:[['Genus','Aggregate of closely related species'],['Family','Group of related genera'],['Order','Assemblage of families'],['Class','Group of related orders'],['Phylum','Group of classes (animals)'],['Kingdom','Highest category – Animalia, Plantae'],['Chordata','Notochord + dorsal hollow neural system'],['Polymoniales','Order with Convolvulaceae, Solanaceae'],['Carnivora','Order with Felidae, Canidae'],['Felidae / Canidae','Cats (with Panthera) / dogs']],qk:'genus|family|order|class|phylum|kingdom|Panthera|Solanum|Felidae|Carnivora|Chordata|Polymoniales|Primata|Homo'});

<tr><td>Man</td><td><i>Homo sapiens</i></td><td>Hominidae</td><td>Primata</td><td>Mammalia</td><td>Chordata</td></tr>

<tr><td>Mango</td><td><i>Mangifera indica</i></td><td>Anacardiaceae</td><td>Sapindales</td><td>Dicotyledonae</td><td>Angiospermae</td></tr>
<tr><td>Wheat</td><td><i>Triticum aestivum</i></td><td>Poaceae</td><td>Poales</td><td>Monocotyledonae</td><td>Angiospermae</td></tr></table>
<p class="small muted">The genus is the first word of each biological name: <i>Homo, Musca, Mangifera, Triticum</i>.</p>`,
terms:[['Homo sapiens','Man – Hominidae, Primata, Mammalia, Chordata'],['Musca domestica','Housefly – Muscidae, Diptera, Insecta, Arthropoda'],['Mangifera indica','Mango – Anacardiaceae, Sapindales, Dicotyledonae, Angiospermae'],['Triticum aestivum','Wheat – Poaceae, Poales, Monocotyledonae, Angiospermae']],qk:'Homo|Musca|Triticum|Poaceae|Diptera|Anacardiaceae|Sapindales|Muscidae|Hominidae|Arthropoda|Insecta'});
n5('c1-summary',{notes:`<ul>
<li>The living world is rich in variety. Millions of plants and animals have been identified and described, but a <b>large number still remains unknown</b>.</li>
<li>The range of organisms in size, colour, habitat, physiological and morphological features makes us seek the defining characteristics of living organisms.</li>
<li>To study the kinds and diversity of organisms, biologists evolved rules and principles for <b>identification, nomenclature and classification</b> – the branch dealing with these is <b>taxonomy</b>.</li>
<li>Taxonomic studies are useful in <b>agriculture, forestry, industry</b> and for knowing our <b>bio-resources</b> and their diversity.</li>
<li>Identification, naming and classification are universally evolved under <b>international codes</b>. Each organism gets a correct scientific/biological name of <b>two words</b> – the <b>binomial system</b>.</li>
<li>Each organism occupies a place in the system of classification. The categories/ranks are <b>taxonomic categories or taxa</b>; together they form the <b>taxonomic hierarchy</b>.</li></ul>`,qk:'.'});

  const el=card(`<h3>Meet Ernst Mayr</h3><p class="small muted">‘The Darwin of the 20th century’. Drag the slider through his life.</p><svg viewBox="0 0 600 120" class="d3w" style="width:100%"><line x1="30" y1="60" x2="570" y2="60" stroke="var(--line)" stroke-width="6" stroke-linecap="round"/><line class="mprog" x1="30" y1="60" x2="30" y2="60" stroke="var(--acc)" stroke-width="6" stroke-linecap="round"/>${ev.map(([y],i)=>{const x=30+(y-1904)/100*540;return `<circle class="mdot" data-i="${i}" cx="${x}" cy="60" r="9" fill="var(--card)" stroke="var(--acc)" stroke-width="3"/><text x="${x}" y="${i%2?100:34}" text-anchor="middle" class="dtext" style="font-size:13px">${y}</text>`;}).join('')}</svg><input type="range" min="0" max="${ev.length-1}" value="0"><div class="note mn"></div><p class="small">He pioneered the currently accepted definition of a <b>biological species</b> and made the <b>origin of species diversity</b> the central question of evolutionary biology. Research areas: ornithology, taxonomy, zoogeography, evolution, systematics, history and philosophy of biology.</p>`);

function speciesCounter(){
  const el=card(`<div class="row" style="align-items:flex-end;gap:16px"><div><div class="small muted">Species known and described</div><div class="scnt" style="font-family:var(--head);font-weight:800;font-size:clamp(2.2rem,9vw,3.4rem);line-height:1;color:var(--acc)">0</div></div><p class="small" style="flex:1;min-width:180px;margin:0">This number is <span class="term">biodiversity</span> – the number and types of organisms on earth. It keeps growing: new organisms are continuously being identified.</p></div>`);
  const n=$('.scnt',el);let done=false;new IntersectionObserver((es,o)=>{if(es[0].isIntersecting&&!done){done=true;o.disconnect();const t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/1600),e=1-Math.pow(1-k,3);n.textContent=k<1?(1.7*e).toFixed(2)+' million':'1.7 – 1.8 million';if(k<1)requestAnimationFrame(f);};requestAnimationFrame(f);}}).observe(el);return el;
}

 Genus:['An aggregate of closely related species.','Genus Solanum: potato and brinjal. Genus Panthera: lion, leopard, tiger.'],
 Species:['The lowest category – individuals with fundamental similarities.','Mangifera indica, Solanum tuberosum, Panthera leo, Homo sapiens.']};
const HIER_PARTS=RANKS.map((r,i)=>({id:'r'+i,name:r,desc:RANK_INFO[r][0],fn:i===0?'Fewest characters in common; hardest to relate taxa at this level.':i===6?'Members share the most characters.':'Moving up loses common characters; moving down gains them.',eg:RANK_INFO[r][1]}));
const RCOL=['#1E7B4F','#2E8F5E','#3FA36E','#57B47F','#73C392','#95D3AA','#BCE4C8'];
const D_HIER=reg({id:'hier',title:'Taxonomic hierarchy (Fig. 1.1)',vb:'0 0 640 470',fs:19,parts:HIER_PARTS,svg:()=>{let s='<rect width="640" height="470" class="fw"/>';
  RANKS.forEach((r,i)=>{const y=24+i*60,w0=470-i*58,w1=470-(i+1)*58,cx=280;s+=`<g data-part="r${i}" class="hl${i}"><path d="M${cx-w0/2} ${y} L${cx+w0/2} ${y} L${cx+w1/2} ${y+54} L${cx-w1/2} ${y+54} Z" fill="${RCOL[i]}" stroke="#fff" stroke-width="2"/><text x="${cx}" y="${y+34}" text-anchor="middle" style="font:700 ${i>4?22:25}px var(--head),sans-serif;fill:${i<4?'#fff':'#12301f'}">${r}</text></g>`;});
  s+=`<g><line x1="560" y1="440" x2="560" y2="40" stroke="var(--d-lead)" stroke-width="3" marker-end="url(#ar)"/><text x="582" y="250" transform="rotate(-90 582 250)" text-anchor="middle" class="dtext" style="font-size:18px">ascending – fewer common characters</text></g><defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--d-lead)"/></marker></defs>`;return s;},labels:[]});
async function buildHier(svg){const gs=$$('[data-part]',svg).filter(g=>/^r\d$/.test(g.dataset.part)).reverse();gs.forEach(g=>{g.style.transition='none';g.style.opacity=0;g.style.transform='translateY(30px)';});await sleep(200);for(const g of gs){g.style.transition='opacity .45s,transform .45s cubic-bezier(.3,1.3,.5,1)';g.style.opacity=1;g.style.transform='none';await sleep(170);}}
function climbWidget(){
  const el=card(`<h3>Climb the hierarchy</h3><p class="small muted">Slide from species up to kingdom.</p><input type="range" min="0" max="6" value="0"><div class="row mt" style="gap:16px;align-items:flex-end"><div style="flex:1"><div class="small muted">Characters shared by members</div><div class="bar" style="height:14px"><i class="cb1" style="width:100%"></i></div></div><div style="flex:1"><div class="small muted">Difficulty of relating taxa at this level</div><div class="bar" style="height:14px"><i class="cb2" style="width:10%;background:var(--bad)"></i></div></div></div><div class="note cn"></div>`);
  const r=$('input',el),set=()=>{const i=+r.value,rank=RANKS[6-i];$('.cb1',el).style.width=(100-i*14)+'%';$('.cb2',el).style.width=(10+i*15)+'%';$('.cn',el).innerHTML=`<b class="term">${rank}</b> – ${RANK_INFO[rank][0]} ${i===0?'<br><b>Lower the taxa, more the characteristics the members share.</b>':i===6?'<br><b>Higher the category, greater the difficulty of determining relationships – classification becomes more complex.</b>':''}`;};r.oninput=set;set();return el;
}

function ladderWidget(){
  const el=card(`<h3>Zoom through the ranks</h3><p class="small muted">Start at a kingdom and dive in. Groups you can open have a ring.</p><div class="lseg"></div>
   <div class="zl-crumb small" style="margin:10px 0;display:flex;flex-wrap:wrap;gap:6px"></div>
   <div class="zl-stage" style="perspective:900px;border-radius:16px;background:var(--card2);border:1px solid var(--line);padding:14px;min-height:260px;overflow:hidden"><div class="zl-in"></div></div>
   <div class="row mt"><button class="btn ghost sm zl-up">Zoom out</button><span class="small muted zl-n"></span></div>`);
  let path=[];let tree='animal';
  const cur=()=>path.reduce((n,i)=>n.kids[i],LADDER[tree]);
  const draw=(dir)=>{const n=cur(),inn=$('.zl-in',el);
    $('.zl-crumb',el).innerHTML=[LADDER[tree],...path.map((_,k)=>path.slice(0,k+1).reduce((m,i)=>m.kids[i],LADDER[tree]))].map((m,k,a)=>`<span class="pill" style="${k===a.length-1?'background:var(--acc);color:#fff':''}">${m.rank}: ${m.name}</span>`).join('');
    inn.innerHTML=`<div style="font-family:var(--head);font-weight:800;font-size:1.5rem">${n.rank} <span style="color:var(--acc)">${n.rank==='Species'?'<i>'+n.name+'</i>':n.name}</span></div><p class="small" style="margin:4px 0 12px">${n.note||''}</p>
     ${n.kids?`<div class="grid2" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px">${n.kids.map((k,i)=>`<button class="opt zk" data-i="${i}" style="flex-direction:column;align-items:flex-start;gap:2px;${k.kids?'box-shadow:0 0 0 3px var(--acc3);border-color:var(--acc)':''}"><span class="small muted">${k.rank}</span><b>${k.rank==='Species'?'<i>'+k.name+'</i>':k.name}</b></button>`).join('')}</div>`:'<div class="note">This is the lowest category – a species.</div>'}`;
    if(dir)inn.animate(dir==='in'?[{transform:'translateZ(-260px)',opacity:0},{transform:'none',opacity:1}]:[{transform:'translateZ(220px)',opacity:0},{transform:'none',opacity:1}],{duration:520,easing:'cubic-bezier(.2,.8,.2,1)'});
    $$('.zk',inn).forEach(b=>b.onclick=()=>{const k=n.kids[+b.dataset.i];if(k.kids){inn.animate([{transform:'none',opacity:1},{transform:'translateZ(240px)',opacity:0}],{duration:280,easing:'ease-in'}).onfinish=()=>{path.push(+b.dataset.i);draw('in');};}else{$('.zl-n',el).innerHTML=`<b>${k.rank} ${k.name}</b>${k.note?' – '+k.note:''}`;b.classList.add('right');}});
    $('.zl-n',el).textContent='';$('.zl-up',el).disabled=!path.length;};
  $('.zl-up',el).onclick=()=>{if(!path.length)return;$('.zl-in',el).animate([{transform:'none',opacity:1},{transform:'translateZ(-200px)',opacity:0}],{duration:260}).onfinish=()=>{path.pop();draw('out');};};
  $('.lseg',el).appendChild(seg([['animal','Animal: lion'],['plant','Plant: potato']],'animal',v=>{tree=v;path=[];draw();}));draw();return el;
}

EXAM.push(
{id:'e1-1',ch:1,q:'Why are living organisms classified?',a:`<ul><li>There are <b>millions</b> of organisms (1.7–1.8 million species known) – it is nearly <b>impossible to study all</b> of them individually.</li><li><b>Classification</b> groups them into <b>convenient categories</b> based on easily observable characters, which makes study possible.</li><li>It helps in <b>identification</b> and gives each organism a <b>place</b> in a system, showing <b>similarities, differences and relationships</b> among organisms.</li><li>Useful in agriculture, forestry, industry and in knowing our <b>bio-resources</b>.</li></ul>`,dg:'c1-tax'},
{id:'e1-2',ch:1,q:'Why are the classification systems changing every now and then?',a:`<ul><li><b>New organisms are continuously being identified</b> as we explore new and even old areas, and a large number still remains unknown.</li><li>Modern taxonomy uses more information – <b>external and internal structure, cell structure, development process and ecological information</b> – so organisms may be regrouped.</li><li><b>Systematics</b> takes into account <b>evolutionary relationships</b>; as these become clearer, groups are revised.</li><li>Taxonomists also develop <b>sub-categories</b> for more sound and scientific placement of taxa.</li></ul>`,dg:'c1-tax'},
{id:'e1-3',ch:1,q:'What different criteria would you choose to classify people that you meet often?',a:`<p>Use <b>easily observable characters</b>, just as in classification:</p><ul><li><b>Relationship</b> – family, friends, classmates, teachers, neighbours.</li><li><b>Age group</b> – children, adults, elders.</li><li><b>Occupation</b> – students, doctors, shopkeepers…</li><li><b>Where you meet them</b> – school, home, tuition, sports ground.</li></ul><p class="small muted">Any sensible criteria work – the idea is grouping into convenient categories, which can be arranged in levels like a hierarchy.</p>`},
{id:'e1-4',ch:1,q:'What do we learn from identification of individuals and populations?',a:`<ul><li>We learn their <b>characters</b> – the <b>similarities and dissimilarities</b> among individuals of the same kind and of other kinds.</li><li>Correct description lets us attach the <b>correct name</b> (identification comes before nomenclature).</li><li>We can place the organism in the right <b>taxonomic category</b> and understand its <b>relationships</b>.</li><li>It adds to our knowledge of <b>biodiversity</b> and bio-resources.</li></ul>`,dg:'c1-div'},
{id:'e1-5',ch:1,q:'Given below is the scientific name of Mango. Identify the correctly written name: Mangifera Indica / Mangifera indica',a:`<p><b><i>Mangifera indica</i></b> is correct.</p><ul><li>The <b>genus</b> (<i>Mangifera</i>) starts with a <b>capital</b> letter; the <b>specific epithet</b> (<i>indica</i>) starts with a <b>small</b> letter.</li><li>Printed in <b>italics</b>; when handwritten, both words are <b>separately underlined</b>.</li></ul>`,dg:'c1-nom'},
{id:'e1-6',ch:1,q:'Define a taxon. Give some examples of taxa at different hierarchical levels.',a:`<p>A <b>taxon</b> (pl. taxa) is a <b>unit of classification</b> – a category that represents a <b>rank</b> in the taxonomic hierarchy.</p><ul><li><b>Kingdom</b>: Animalia, Plantae</li><li><b>Phylum / Division</b>: Chordata, Arthropoda / Angiospermae</li><li><b>Class</b>: Mammalia, Insecta, Dicotyledonae</li><li><b>Order</b>: Primata, Carnivora, Polymoniales</li><li><b>Family</b>: Felidae, Canidae, Solanaceae</li><li><b>Genus</b>: <i>Panthera, Solanum</i></li><li><b>Species</b>: <i>leo, tuberosum</i></li></ul>`,dg:'c1-hier'},
{id:'e1-7',ch:1,q:'Can you identify the correct sequence of taxonomical categories? (a) Species → Order → Phylum → Kingdom (b) Genus → Species → Order → Kingdom (c) Species → Genus → Order → Phylum',a:`<p><b>(a) Species → Order → Phylum → Kingdom</b> and <b>(c) Species → Genus → Order → Phylum</b> are both in the correct <b>ascending</b> order.</p><p><b>(b) is wrong</b> – species is the lowest category, so it cannot come after genus.</p><p class="small muted">Full ascending order: Species → Genus → Family → Order → Class → Phylum → Kingdom.</p>`,dg:'c1-hier'},
{id:'e1-8',ch:1,q:'Try to collect all the currently accepted meanings for the word ‘species’. Discuss the meaning of species in case of higher plants and animals on one hand, and bacteria on the other hand.',a:`<ul><li>In this chapter, a <b>species</b> is a group of individual organisms with <b>fundamental similarities</b>, distinguished from closely related species by <b>distinct morphological differences</b>; it is the <b>lowest</b> taxonomic category.</li><li>Each different kind of organism we see represents a species.</li><li><b>Ernst Mayr</b> pioneered the currently accepted definition of a <b>biological species</b>.</li><li>For <b>higher plants and animals</b>, morphological differences are easy to see; for <b>bacteria</b>, which are too small to observe with the naked eye, other characters (such as <b>cell structure</b>, development and ecological information) become important.</li></ul><p class="small muted">This is a discussion question – talk through the different meanings with your teacher.</p>`,dg:'c1-ranks'},
{id:'e1-9',ch:1,q:'Define and understand the following terms: (i) Phylum (ii) Class (iii) Family (iv) Order (v) Genus',a:`<ul><li><b>Phylum</b> – the category made of related <b>classes</b>, e.g. Chordata (fishes, amphibians, reptiles, birds, mammals – notochord and dorsal hollow neural system). For plants: <b>Division</b>.</li><li><b>Class</b> – includes related <b>orders</b>, e.g. Mammalia (Primata, Carnivora).</li><li><b>Family</b> – a group of related <b>genera</b> with fewer similarities than genus and species, e.g. Solanaceae (<i>Solanum, Petunia, Datura</i>), Felidae.</li><li><b>Order</b> – an assemblage of <b>families</b> with a few similar characters, e.g. Polymoniales, Carnivora.</li><li><b>Genus</b> – an aggregate of closely related <b>species</b>, e.g. <i>Solanum</i> (potato, brinjal), <i>Panthera</i> (lion, leopard, tiger).</li></ul>`,dg:'c1-ranks'},
{id:'e1-10',ch:1,q:'Illustrate the taxonomical hierarchy with suitable examples of a plant and an animal.',a:`<table class="cmp"><tr><th>Category</th><th>Mango (plant)</th><th>Man (animal)</th></tr><tr><td>Kingdom</td><td>Plantae</td><td>Animalia</td></tr><tr><td>Phylum / Division</td><td>Angiospermae</td><td>Chordata</td></tr><tr><td>Class</td><td>Dicotyledonae</td><td>Mammalia</td></tr><tr><td>Order</td><td>Sapindales</td><td>Primata</td></tr><tr><td>Family</td><td>Anacardiaceae</td><td>Hominidae</td></tr><tr><td>Genus</td><td><i>Mangifera</i></td><td><i>Homo</i></td></tr><tr><td>Species</td><td><i>indica</i></td><td><i>sapiens</i></td></tr></table><p class="small muted">Going up the table, the members share fewer common characters.</p>`,dg:'c1-table'});

function gLadder(scr){
  const asc=['Species','Genus','Family','Order','Class','Phylum','Kingdom'];let k=0,score=0,mist=0,t0=Date.now();
  const step1=()=>{scr.innerHTML=`${hud([['s','Score 0'],['m','Mistakes 0']])}<div class="card"><h3>Build the ladder</h3><p class="small muted">Tap the categories in <b>ascending</b> order – lowest first.</p><div class="lad" style="display:flex;flex-direction:column-reverse;gap:6px;min-height:40px;margin:10px 0"></div><div class="chips lch">${shuffle(asc).map(a=>`<button class="chip">${a}</button>`).join('')}</div></div>`;
    $$('.lch .chip',scr).forEach(b=>b.onclick=()=>{if(b.textContent===asc[k]){k++;score+=10;addScore(2);b.disabled=true;b.style.visibility='hidden';const r=h(`<div class="opt" style="justify-content:center;margin:0 ${(7-k)*4}%"><b>${b.textContent}</b></div>`);$('.lad',scr).appendChild(r);r.animate([{transform:'translateY(-20px) scale(.9)',opacity:0},{transform:'none',opacity:1}],{duration:350,easing:'cubic-bezier(.3,1.4,.5,1)'});$('[data-h=s]',scr).textContent='Score '+score;if(k===7){confetti(30);setTimeout(step2,800);}}
      else{mist++;b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');$('[data-h=m]',scr).textContent='Mistakes '+mist;mcqWrong('lad'+k,`In ascending order, which category comes right after ${k?asc[k-1]:'nothing (the lowest)'}?`,asc,k,'Species → Genus → Family → Order → Class → Phylum → Kingdom.','Game · Rank Ladder');}});};
  let r=0;const Q=shuffle(T11.flatMap(row=>row.slice(3).map((v,i)=>[row[0],v,['Family','Order','Class','Phylum / Division'][i]]))).slice(0,6);
  const step2=()=>{if(r>=Q.length){endCard(scr,'ladder',score,`<p>${mist} mistakes · ${Math.round((Date.now()-t0)/1000)}s</p>`,()=>{k=0;score=0;mist=0;r=0;t0=Date.now();step1();});return;}
    const [org,val,rank]=Q[r];const opts=['Family','Order','Class','Phylum / Division'];
    scr.innerHTML=`${hud([['s','Score '+score],['m','Mistakes '+mist],['r','Round '+(r+1)+'/6']])}<div class="card"><h3>Which rank is it?</h3><div class="qtext">For <b>${org}</b>, <b>${val}</b> is its…</div><div class="opts">${opts.map(o=>`<button class="opt">${o}</button>`).join('')}</div><div class="fbx"></div></div>`;
    $$('.opt',scr).forEach(b=>b.onclick=async()=>{const ok=b.textContent===rank;$$('.opt',scr).forEach(x=>{x.disabled=true;if(x.textContent===rank)x.classList.add('right');else if(x===b)x.classList.add('wrong');});
      if(ok){score+=10;addScore(3);}else{mist++;mcqWrong('t11'+org+val,`In Table 1.1, ${val} is the ___ of ${org}.`,opts,opts.indexOf(rank),`${org}: see Table 1.1.`,'Game · Rank Ladder');}
      $('.fbx',scr).innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'Correct!':'Not quite'}</b>${val} is the ${rank.toLowerCase()} of ${org}.</div>`;r++;await nextBtn($('.card',scr));step2();});};
  step1();
}
function gName(scr){
  const N=[['Mangifera','indica'],['Homo','sapiens'],['Panthera','leo'],['Solanum','tuberosum'],['Musca','domestica'],['Triticum','aestivum'],['Panthera','tigris'],['Solanum','melongena'],['Panthera','pardus'],['Solanum','nigrum']];
  const cap=s=>s[0].toUpperCase()+s.slice(1),low=s=>s[0].toLowerCase()+s.slice(1);
  let r=0,score=0,streak=0;const rounds=shuffle(N).slice(0,8);
  const next=()=>{if(r>=rounds.length){endCard(scr,'namegame',score,'',()=>gName(scr));return;}
    const [g,e]=rounds[r];const right=`<i>${g} ${e}</i>`;const wrong=[`<i>${g} ${cap(e)}</i>`,`<i>${low(g)} ${e}</i>`,`${g} ${e}`,`<i>${cap(e)} ${g.toLowerCase()}</i>`];const opts=shuffle([right,...shuffle(wrong).slice(0,3)]);
    scr.innerHTML=`${hud([['s','Score '+score],['k','Streak '+streak],['r',(r+1)+' of '+rounds.length]])}<div class="card"><h3>Which is written correctly (printed)?</h3><div class="opts" style="font-family:Georgia,serif;font-size:1.25rem">${opts.map(o=>`<button class="opt">${o}</button>`).join('')}</div><div class="fbx"></div></div>`;
    $$('.opt',scr).forEach(b=>b.onclick=async()=>{const ok=b.innerHTML===right;$$('.opt',scr).forEach(x=>{x.disabled=true;if(x.innerHTML===right)x.classList.add('right');else if(x===b)x.classList.add('wrong');});
      if(ok){streak++;score+=10+streak*2;addScore(3);}else{streak=0;mcqWrong('nm'+g+e,`Which is the correctly written scientific name?`,[`${g} ${e} (italic)`,`${g} ${cap(e)} (italic)`,`${low(g)} ${e} (italic)`,`${g} ${e} (not italic)`],0,'Genus with a capital, epithet with a small letter, printed in italics.','Game · Name It Right');}
      $('.fbx',scr).innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'Correct!':'Not quite'}</b>Genus capital, epithet small, printed in italics: ${right}.</div>`;r++;await nextBtn($('.card',scr));next();});};
  next();
}

function setSubject(id,ev,after){
  if(id===App.subj){after&&after();return;}
  const go=()=>{App.subj=id;after?after():App.render(false,true);};
  if(!id||matchMedia('(prefers-reduced-motion: reduce)').matches){go();return;}
  const x=ev&&ev.clientX!=null?ev.clientX:innerWidth/2,y=ev&&ev.clientY!=null?ev.clientY:innerHeight/2;
  const R=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  const w=document.createElement('div');w.className='wipe s-'+id;
  w.innerHTML=`<i style="left:${x-R}px;top:${y-R}px;width:${2*R}px;height:${2*R}px"></i><div class="wc">${motif(id,'live')}<b>${SUBJ_LOOK[id].hello}</b></div>`;
  document.body.appendChild(w);const c=$('i',w),wc=$('.wc',w);

}

/* ---------- update check: compares this page's version with the live one ---------- */
const Updater={last:0,shown:false,
  cmp(a,b){const x=a.split('.').map(Number),y=b.split('.').map(Number);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d;}return 0;},
  async check(){if(this.shown||!/^https?:/.test(location.protocol))return;const now=Date.now();if(now-this.last<60000)return;this.last=now;
    try{const r=await fetch(location.pathname+'?check='+now,{cache:'no-store'});if(!r.ok)return;const t=await r.text();
      const m=t.match(/const APP_VERSION='([\d.]+)'/);if(m&&this.cmp(m[1],APP_VERSION)>0)this.show(m[1]);}catch(e){}},
  show(v){this.shown=true;const b=document.createElement('div');b.id='updbar';
    b.innerHTML=`<span>New version <b>${v}</b> is available</span><button class="btn sm" id="updGo">Update</button><button class="iconbtn" id="updX" aria-label="Later">✕</button>`;
    document.body.appendChild(b);b.animate([{transform:'translateY(30px)',opacity:0},{transform:'none',opacity:1}],{duration:450,easing:'cubic-bezier(.3,1.4,.5,1)'});
    $('#updGo',b).onclick=()=>{location.replace(location.pathname+'?v='+v+location.hash);};
    $('#updX',b).onclick=()=>b.remove();},
  init(){setTimeout(()=>this.check(),2500);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')this.check();});window.addEventListener('pageshow',e=>{if(e.persisted)this.check();});}};
