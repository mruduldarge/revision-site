<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Class 11 Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>:root{
  /* paper & ink */
  --bg:#F2F5F3; --grid:rgba(20,32,39,.045); --card:#FFFFFF; --card2:#F1F4F2; --ink:#142027; --ink2:#46555E; --ink3:#7A8A92;
  --line:#DCE3DF; --shadow:0 1px 2px rgba(20,32,39,.06),0 6px 18px -8px rgba(20,32,39,.12);
  /* subject inks */
  --bio:#1E7B4F; --bio-soft:#E2F0E7; --chem:#7B3FC6; --chem-soft:#EEE6FA; --phy:#2156C4; --phy-soft:#E3EBFA; --mark:#F6D04D;
  /* legacy palette used by diagrams & widgets */
  --g:#1E7B4F; --g2:#3FAE73; --g3:#E2F0E7; --pink:#D2457C; --pink2:#FBE2EC; --yel:#F3B52B; --yel2:#FFF3CF; --pur:#7B3FC6;
  --b:#2156C4; --b2:#5A8BEA; --b3:#E3EBFA; --teal:#0F8F8C; --teal2:#DDF3F2;
  --ok:#1F9254; --okbg:#E1F4E8; --bad:#D23F55; --badbg:#FCE6E9;
  --acc:var(--bio); --acc2:#3FAE73; --acc3:var(--bio-soft);
  /* diagram palette */
  --d-paper:#FCFDFC; --d-ink:#24402f; --d-label:#1a2a22; --d-lead:#6c7f72;
  --leaf:#5fb86b; --leaf2:#3f9a50; --leafl:#bfe6b9; --stem:#7cbf5a; --root:#c8a26e; --root2:#a07a46; --soil:#e9dcc6; --soil2:#d9c6a5;
  --petal:#f27fa8; --petal2:#e0548a; --sepal:#6cbf5f; --anther:#f6c33b; --fil:#e9d38a; --ovary:#9bd27e; --ovule:#fff6d6; --thal:#a3d48a;
  --xy:#e2556b; --ph:#2fb3a0; --camb:#9a6cf0; --cort:#e8f4d8; --cort2:#d4ebbf; --epi:#bfe3a5; --endo:#f2c14e; --peri:#f0a868; --pith:#f6f1df; --scl:#c9b28b; --coll:#b8dd97; --chl:#3fa34d; --cut:#ffd36b;
  --r:16px; --r2:12px;
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif; --head:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;
  --tabh:66px; --rail:232px;
}
[data-theme="dark"]{
  --bg:#0D191B; --grid:rgba(230,239,236,.035); --card:#15242A; --card2:#1B2D33; --ink:#E6EFEC; --ink2:#AABBB7; --ink3:#7F928E;
  --line:#284039; --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 20px -10px rgba(0,0,0,.5);
  --bio:#4CC98A; --bio-soft:#173328; --chem:#B48CF2; --chem-soft:#2A2140; --phy:#7EA8FF; --phy-soft:#1A2744; --mark:#E8C547;
  --g3:#173328; --pink2:#3a1f2a; --yel2:#3a3018; --b3:#1A2744; --teal2:#123433; --okbg:#173a26; --badbg:#3d1d22;
  --acc2:#2E9D64;
  --d-paper:#132126; --d-ink:#cfe3d4; --d-label:#e6f0e9; --d-lead:#8fa598;
  --soil:#4a3d2c; --soil2:#5a4a35; --cort:#2c3d26; --cort2:#36502c; --pith:#3a3628; --ovule:#efe4b8;
}
.s-bio,.ch5,.ch6{--acc:var(--bio);--acc3:var(--bio-soft)}
.s-chem{--acc:var(--chem);--acc3:var(--chem-soft)}
.s-phy{--acc:var(--phy);--acc3:var(--phy-soft)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55;overflow-x:hidden}
body{min-height:100vh;transition:background .3s,color .3s;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--mark);outline-offset:2px;border-radius:10px}
h1,h2,h3,h4{font-family:var(--head);font-weight:700;line-height:1.15;margin:0 0 .4em;letter-spacing:-.015em}
h1{font-size:1.75rem} h2{font-size:1.3rem} h3{font-size:1.1rem}
p{margin:.3em 0 .7em}
b,strong{font-weight:700}
.muted{color:var(--ink2)} .small{font-size:.86rem}
svg.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* shell */
#top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--bg);border-bottom:1px solid var(--line)}
#top .logo{font-family:var(--head);font-weight:700;font-size:1.08rem;display:flex;align-items:center;gap:10px;flex:1;min-width:0;letter-spacing:-.01em}
#top .logo .mk{width:30px;height:30px;border-radius:8px;border:2px solid var(--acc);color:var(--acc);display:grid;place-items:center;font-size:.8rem;font-weight:800;flex:none;background:var(--card)}
#top .logo span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#backBtn{display:none;width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
#backBtn.show{display:grid;place-items:center}
.iconbtn{width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
#main{max-width:900px;margin:0 auto;padding:18px 16px calc(var(--tabh) + 34px + env(safe-area-inset-bottom))}
.screen{animation:screenIn .3s cubic-bezier(.2,.8,.2,1)}
.screen.back{animation:screenBack .3s cubic-bezier(.2,.8,.2,1)}
@keyframes screenIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes screenBack{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#tabs button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:.72rem;font-weight:700;color:var(--ink3);position:relative;transition:color .2s}
#tabs button .ic{transition:transform .25s}
#tabs button .lb{position:relative;padding:0 4px}
#tabs button.on{color:var(--ink)}
#tabs button.on .ic{color:var(--acc);transform:translateY(-1px)}
#tabs button.on .lb{box-shadow:inset 0 -3px 0 var(--mark)}
#tabs button .lb{white-space:nowrap}
.badge{position:absolute;top:0;right:calc(50% - 24px);min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--bad);color:#fff;font-size:.68rem;font-weight:700;display:grid;place-items:center;transform-origin:center}
.badge.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
@media (min-width:900px){
  #tabs{top:0;bottom:0;right:auto;width:var(--rail);flex-direction:column;justify-content:flex-start;gap:4px;border-top:none;border-right:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top)) 14px 18px}
  #tabs::before{content:"Class 11 Revision";font-family:var(--head);font-weight:800;font-size:1.15rem;padding:6px 12px 18px;letter-spacing:-.02em}
  #tabs button{flex:none;max-width:none;flex-direction:row;gap:12px;padding:11px 12px;font-size:.98rem;justify-content:flex-start}
  #tabs button.on{background:var(--card2)}
  .badge{position:static;margin-left:auto}
  #top,#main{margin-left:var(--rail)}
  #top{padding-left:28px}
  #main{padding:26px 32px 60px}
  #wm{bottom:12px!important}
}
/* cards & controls */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px;border:1px solid var(--line)}
.card.flat{box-shadow:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:12px;font-weight:700;background:var(--acc);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);transition:transform .12s,filter .2s}
[data-theme="dark"] .btn{color:#0D191B}
.btn:active{transform:translateY(1px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.18)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:none;border:1.5px solid var(--line)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.88rem;border-radius:10px}
.btn.bad{background:var(--bad);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{min-height:40px;padding:8px 14px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:.9rem;transition:all .2s}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
[data-theme="dark"] .chip.on{color:#0D191B}
.seg{display:flex;max-width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-height:40px;padding:6px 10px;border-radius:9px;font-weight:700;font-size:.9rem;color:var(--ink2);transition:all .2s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12),inset 0 -3px 0 var(--acc)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--acc3);color:var(--acc);font-weight:700;font-size:.8rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.95rem}
.kv b{color:var(--acc)}
.note{background:var(--acc3);border-radius:var(--r2);padding:10px 14px;font-size:.95rem;margin:8px 0}
.eg{color:var(--pink);font-weight:700}
[data-theme="dark"] .eg{color:#ff8fb3}
.term{font-weight:700;color:var(--acc)}
.ring{width:110px;height:110px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--head);font-size:1.5rem;font-weight:800;line-height:1}
.ring .v small{display:block;font-size:.66rem;font-family:var(--font);color:var(--ink3);font-weight:700;margin-top:3px}
.stat{display:flex;flex-direction:column;justify-content:center;background:var(--card2);border-radius:12px;padding:10px 12px;min-width:84px;flex:1;text-align:left;border:1px solid var(--line)}
.stat b{font-family:var(--head);font-size:1.45rem;line-height:1.1}
.stat span{font-size:.78rem;color:var(--ink3);font-weight:700}
/* page heads */
.ph{margin:4px 0 18px}
.ph h1{margin:0}
.ph p{margin:4px 0 0;color:var(--ink2)}
.sech{font-family:var(--head);font-weight:700;font-size:1.05rem;margin:22px 0 10px;display:flex;align-items:baseline;gap:10px}
.sech small{font-family:var(--font);font-weight:400;color:var(--ink3);font-size:.85rem}
/* element tiles – the site's signature */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{position:relative;aspect-ratio:1/1.08;border-radius:16px;border:2px solid var(--acc);background:var(--card);color:var(--ink);padding:10px 12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s,box-shadow .2s;overflow:hidden}
.tile:active{transform:scale(.97)}
.tile .z{font-family:var(--head);font-weight:700;font-size:.9rem;color:var(--acc);display:flex;justify-content:space-between}
.tile .sym{font-family:var(--head);font-weight:800;font-size:clamp(2rem,8.5vw,3.4rem);line-height:.9;letter-spacing:-.04em}
.tile .sym.l4{font-size:clamp(1.55rem,6.6vw,3rem)}
.tile .nm{font-weight:700;font-size:.92rem;line-height:1.2}
.tile .meta{font-size:.74rem;color:var(--ink3);font-weight:700}
.tile .fill{position:absolute;left:0;bottom:0;height:5px;background:var(--acc);transition:width .8s}
.tile.sel{background:var(--acc3);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 22%,transparent)}
.tile.soon{border-style:dashed;border-color:color-mix(in srgb,var(--acc) 55%,var(--line))}
.tile.soon .sym{color:color-mix(in srgb,var(--acc) 55%,var(--ink3))}
.tiles.mini{grid-template-columns:repeat(3,1fr);gap:8px}
.tiles.mini .tile{aspect-ratio:auto;flex-direction:row;align-items:baseline;gap:8px;padding:10px 12px;border-radius:12px;justify-content:flex-start;min-height:0}
.tiles.mini .tile .sym{font-size:1.35rem}
.tiles.mini .tile .z,.tiles.mini .tile .meta{display:none}
.tiles.mini .tile .nm{font-size:.82rem;color:var(--ink2)}
@media (max-width:480px){.tiles.mini .tile .nm{display:none}.tiles.mini .tile{justify-content:center}}
@media (min-width:700px){.tiles:not(.mini) .tile{aspect-ratio:auto;min-height:190px}}
/* continue */
.cont{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.cont .ct{width:58px;height:62px;border-radius:12px;border:2px solid var(--acc);display:flex;flex-direction:column;justify-content:center;align-items:center;flex:none;background:var(--acc3)}
.cont .ct b{font-family:var(--head);font-size:1.15rem;line-height:1}
.cont .ct span{font-size:.62rem;font-weight:700;color:var(--acc)}
.cont .tt{font-family:var(--head);font-weight:700;font-size:1.12rem;line-height:1.2}
.cont .go{margin-left:auto;width:44px;height:44px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none}
[data-theme="dark"] .cont .go{color:#0D191B}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:96px}
.qa .ic{color:var(--acc)}
.qa b{font-size:.95rem;line-height:1.2}
.qa span{font-size:.78rem;color:var(--ink3)}
@media (max-width:420px){.quick{grid-template-columns:1fr 1fr}.quick .qa:last-child{grid-column:span 2}}
/* chapter rows */
.chl{display:flex;flex-direction:column;gap:10px}
.chr{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.chr .ct{width:62px;height:66px;border-radius:12px;border:2px solid var(--acc);display:flex;flex-direction:column;justify-content:space-between;padding:5px 7px;flex:none}
.chr .ct i{font-style:normal;font-size:.7rem;font-weight:700;color:var(--acc)}
.chr .ct b{font-family:var(--head);font-size:1.45rem;line-height:1;letter-spacing:-.03em}
.chr .tt{font-family:var(--head);font-weight:700;font-size:1.08rem;line-height:1.2}
.chr .ss{font-size:.84rem;color:var(--ink3);margin:2px 0 6px}
.bar{height:7px;border-radius:4px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--acc);transition:width .6s}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--ink2)}
.empty h3{color:var(--ink)}
/* lesson list */
.lgrid{display:flex;flex-direction:column;gap:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.lcard{display:flex;gap:14px;align-items:center;text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);width:100%;transition:background .15s}
.lcard:last-child{border-bottom:none}
.lcard:active{background:var(--card2)}
.lcard .em{min-width:46px;height:40px;padding:0 6px;border-radius:10px;border:1.5px solid var(--acc);color:var(--acc);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:.9rem;flex:none}
.lcard .tt{font-weight:700;line-height:1.25}
.lcard .ss{font-size:.82rem;color:var(--ink3)}
.lcard .tick{margin-left:auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:.8rem;color:transparent}
.lcard .tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
/* lesson */
.lesson-h{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.lesson-h .em{min-width:58px;height:62px;padding:0 6px;border-radius:12px;border:2px solid var(--acc);color:var(--ink);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:1.1rem;flex:none;background:var(--acc3)}
.lesson-h .crumb{font-size:.85rem;color:var(--ink3);font-weight:700}
.sec{margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.sec h3{margin:0}
.lnav{display:flex;gap:10px;margin-top:16px}
.lnav .btn{flex:1}
/* progress */
.psub{margin-bottom:16px}
.psub .hd{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:0}
.psub .chev{display:grid;transition:transform .3s}
.psub.open .chev{transform:rotate(90deg)}
.psub .pbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.psub.open .pbody{grid-template-rows:1fr}
.psub .pbody>div{overflow:hidden;min-height:0}
.psub.open .pbody>div{padding-top:12px}
.psub .hd .ct{width:46px;height:50px;border-radius:10px;border:2px solid var(--acc);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:1.2rem;flex:none}
.psub .hd h3{margin:0}
.psub .hd .pc{margin-left:auto;font-family:var(--head);font-weight:800;font-size:1.3rem;color:var(--acc)}
.pch{display:block;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line)}
.pch .r1{display:flex;gap:10px;align-items:baseline;margin-bottom:6px}
.pch .r1 b{flex:1;font-weight:700}
.pch .r1 span{font-size:.84rem;color:var(--ink3)}
/* diagram frame */
.dg{background:var(--d-paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative;margin:8px 0 12px}
.dg-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--card)}
.dg-bar .ttl{font-weight:800;font-size:.92rem;flex:1;min-width:120px}
.dg-bar .btn.sm{min-height:34px;padding:4px 10px;font-size:.8rem}
.dg-view{position:relative;overflow:auto;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;max-height:72vh}
.dg-view svg{display:block;width:100%;height:auto;margin:0 auto;transition:width .3s}
.dg svg:not(.zoomed){max-height:min(64vh,560px)}
.dg-view svg.zoomed{max-height:none}
.dg-zoom{display:flex;gap:4px;margin-left:auto}
.dg-zoom button{width:34px;height:34px;box-shadow:none!important;border-radius:10px;background:var(--card);box-shadow:var(--shadow);font-weight:900;font-size:1.1rem;border:1px solid var(--line)}
.dg-hint{position:absolute;left:10px;bottom:8px;font-size:.75rem;font-weight:700;color:var(--ink3);background:color-mix(in srgb,var(--card) 85%,transparent);padding:3px 8px;border-radius:8px;pointer-events:none;transition:opacity .4s}
svg text{font-family:var(--font)}
svg .lbl text{font-weight:700;fill:var(--d-label);paint-order:stroke;stroke:var(--d-paper);stroke-width:4px;stroke-linejoin:round}
svg .lbl line,svg .lbl polyline{stroke:var(--d-lead);stroke-width:1.2;fill:none}
svg .lbl circle{fill:var(--d-lead)}
svg .lbl .lq{display:none}
svg.nolabels .lbl .lt{display:none}
svg.nolabels .lbl .lq{display:inline}
svg .lbl .lq{fill:var(--acc)}
svg [data-part]{cursor:pointer;transition:opacity .25s,filter .25s}
svg.hovering [data-part]:not(.hl){opacity:.5}
svg.hovering .lbl:not(.hl){opacity:.35}
svg [data-part].hl{filter:drop-shadow(0 0 4px rgba(255,200,40,.95)) drop-shadow(0 0 1px rgba(255,170,0,.9))}
svg.d3 [data-part]:not(.lbl):not([data-part] [data-part]){filter:url(#dz)}
svg.d3 [data-part].hl:not(.lbl){filter:url(#dzh)}
.lbody svg:not(.d3):not(.ic) > :is(g,path,ellipse,circle,polygon):not(.cut):not(.fw),svg.d3w > :is(g,path,ellipse,circle,polygon):not(.fw){filter:url(#dz)}
svg .lbl.hl text{fill:var(--acc)}

}

@keyframes bounce{0%{transform:scale(1)}30%{transform:scale(1.05)}55%{transform:scale(.97)}80%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.shake{animation:shake .45s}

/* flashcards */
.flash{perspective:1200px;height:260px;margin:10px 0}
.flash .in{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d;cursor:pointer}

.sxy{stroke:var(--xy)} .sph{stroke:var(--ph)} .sfil{stroke:var(--fil)} .sst{stroke:var(--stem)} .sr{stroke:var(--root)} .sr2{stroke:var(--root2)} .sl2{stroke:var(--leaf2)} .scb{stroke:var(--camb)} .sen{stroke:var(--endo)}

.dg{transform:translateZ(0)}

.fcard3.d1{transform:translateY(16px) scale(.95);opacity:.9}

/* personality per subject: shapes and type weight */
body.s-bio{--r:20px}
body.s-chem{--r:12px}
body.s-chem .card,body.s-chem .cont,body.s-chem .chr,body.s-chem .lcard{border-radius:10px}
body.s-phy{--r:8px}
body.s-phy .card,body.s-phy .cont,body.s-phy .chr,body.s-phy .lcard,body.s-phy .qa{border-radius:6px}
body.s-phy .btn{border-radius:8px}
body.s-bio .btn{border-radius:999px}
#top{transition:background-color .5s}
#tabs button.on{color:var(--acc)}
.subjbtn{display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 12px;border-radius:12px;border:1.5px solid var(--acc);background:var(--acc3);color:var(--acc);font-family:var(--head);font-weight:800}
.subjbtn .ic{width:18px;height:18px}

/* motifs */
.mo{width:100%;height:100%;overflow:visible}
.mo.live .leaf{transform-origin:0 50px;animation:sway 3.2s ease-in-out infinite}
.mo.live .cellA{animation:bob 2.6s ease-in-out infinite}
.mo.live .cellB{animation:bob 2.2s .6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.mo.live .orb{animation:spin 2.4s linear infinite}
.mo.live .orb.o1{animation-duration:3.1s;animation-direction:reverse}
.mo.live .orb.o2{animation-duration:2.7s}
.mo.live .nuc{animation:pulse 2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.mo.live .bx{animation:bx 1.8s linear infinite}
.mo.live .by{animation:by 1.8s infinite}
@keyframes bx{0%{transform:translateX(0)}100%{transform:translateX(96px)}}
@keyframes by{0%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.6,.4,1)}50%{transform:translateY(-61px);animation-timing-function:cubic-bezier(.6,0,.8,.4)}100%{transform:translateY(0)}}

/* splash */
body.splashing{overflow:hidden}
#splash{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:var(--bg);color:var(--ink);overflow:hidden}
.sp-in{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 24px 120px}
.sp-pts{position:absolute;inset:0;pointer-events:none}
.pt{position:absolute;bottom:-30px;width:22px;height:22px;transform:scale(var(--s));animation:floatUp var(--t) var(--dl) linear infinite}
@keyframes floatUp{from{transform:translateY(0) rotate(0) scale(var(--s))}to{transform:translateY(-115vh) rotate(300deg) scale(var(--s))}}
.sp-orbit{position:relative;width:min(50vw,220px);aspect-ratio:1;margin:calc(min(50vw,220px)*.12) 0 calc(min(50vw,220px)*.2)}
.sp-o{position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;margin:-17% 0 0 -17%;
  animation:spIn .8s calc(var(--i)*.14s) cubic-bezier(.2,.9,.3,1.25) backwards,spRing 7s linear infinite}
.sp-o > .mo{transform:rotate(calc(var(--i)*-120deg));animation:spCounter 7s linear infinite}
@keyframes spRing{from{transform:rotate(calc(var(--i)*120deg)) translateY(-118%)}to{transform:rotate(calc(var(--i)*120deg + 360deg)) translateY(-118%)}}
@keyframes spCounter{from{transform:rotate(calc(var(--i)*-120deg))}to{transform:rotate(calc(var(--i)*-120deg - 360deg))}}
@keyframes spIn{from{opacity:0;scale:.2}}
.sp-core{position:absolute;inset:34%;border-radius:22%;display:grid;place-items:center;border:3px solid var(--ink);font-family:var(--head);font-weight:800;font-size:clamp(1.4rem,6vw,2rem);background:var(--card);
  animation:coreIn .7s .35s cubic-bezier(.3,1.6,.5,1) backwards,coreBeat 2.4s 1.2s ease-in-out infinite}
@keyframes coreIn{from{opacity:0;transform:scale(.3) rotate(-30deg)}}
@keyframes coreBeat{0%,100%{transform:scale(1) rotate(0)}12%{transform:scale(1.1) rotate(-6deg)}24%{transform:scale(1) rotate(0)}}
.sp-h{font-size:clamp(2.6rem,11vw,4.4rem);letter-spacing:-.03em;margin:0;line-height:1}
.sp-h span{display:inline-block;animation:letter .6s calc(.55s + var(--k)*.05s) cubic-bezier(.2,.9,.3,1.3) backwards,wave 2.6s calc(1.6s + var(--k)*.09s) ease-in-out infinite}
@keyframes letter{from{opacity:0;transform:translateY(40%) rotate(8deg)}}
@keyframes wave{0%,60%,100%{transform:none}30%{transform:translateY(-14%)}}
.sp-p{font-family:var(--head);font-size:clamp(1.2rem,4.6vw,1.6rem);color:var(--ink2);margin:6px 0 14px;animation:rise .6s 1.05s cubic-bezier(.2,.8,.2,1) backwards}
.sp-chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:22px}
.sp-chips span{padding:5px 12px;border-radius:999px;font-weight:800;font-size:.85rem;color:var(--acc);background:var(--acc3);border:1.5px solid var(--acc);animation:chipIn .5s calc(1.25s + var(--k)*.12s) cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes chipIn{from{opacity:0;transform:translateY(12px) scale(.6)}}
.sp-go{display:inline-flex;align-items:center;gap:10px;padding:16px 26px;border-radius:999px;background:var(--ink);color:var(--bg);font-family:var(--head);font-weight:800;font-size:1.15rem;
  box-shadow:0 6px 0 color-mix(in srgb,var(--ink) 55%,#000),0 14px 30px -10px rgba(0,0,0,.4);
  animation:goIn .7s 1.7s cubic-bezier(.3,1.6,.5,1) backwards,goPulse 2s 2.6s ease-in-out infinite}
.sp-go .ic{width:20px;height:20px}
.sp-go:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--ink) 55%,#000)}
@keyframes goIn{from{opacity:0;transform:translateY(30px) scale(.5)}}
@keyframes goPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.sp-lane{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));height:78px;border-top:2px dashed var(--line);z-index:1}
.mc{position:absolute;left:0;bottom:6px;width:56px;height:62px;animation:walk 9s calc(var(--i)*-3s) linear infinite}
.mc-b{width:56px;height:56px;animation:hop .45s calc(var(--i)*.15s) ease-in-out infinite alternate}
.mc.s-phy .mc-b{animation:roll 1.1s linear infinite}
.mc.s-chem .mc-b{animation:hop .6s ease-in-out infinite alternate}
.mc-sh{position:absolute;left:12px;right:12px;bottom:0;height:6px;border-radius:50%;background:rgba(0,0,0,.15);animation:shadow .45s ease-in-out infinite alternate}
@keyframes walk{from{transform:translateX(-70px)}to{transform:translateX(calc(100vw + 20px))}}
@keyframes hop{from{transform:translateY(0) scaleY(.94)}to{transform:translateY(-14px) scaleY(1.04)}}
@keyframes roll{to{transform:rotate(360deg)}}
@keyframes shadow{from{transform:scaleX(1)}to{transform:scaleX(.7);opacity:.6}}
.mc .eyes{animation:blink 3.4s infinite;transform-origin:0 -4px}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.pt,.mc,.mc-b,.sp-h span,.sp-go{animation:none!important}}
/* colour wipe when a subject is chosen */
.wipe{position:fixed;inset:0;z-index:250;pointer-events:none;overflow:hidden}
.wipe > i{position:absolute;border-radius:50%;background:var(--acc3);transform:scale(0);will-change:transform}
.wipe .wc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;opacity:0;color:var(--acc)}
.wipe .wc .mo{width:min(34vw,150px);height:auto}
.wipe .wc b{font-family:var(--head);font-weight:800;font-size:clamp(2rem,9vw,3.4rem);letter-spacing:-.03em}

/* subject chooser */
.pick3{display:grid;gap:12px}
@media (min-width:700px){.pick3{grid-template-columns:repeat(3,1fr)}.pk{flex-direction:column;align-items:flex-start;min-height:230px}.pk .pk-art{width:100%;height:120px}.pk-go{position:absolute;right:14px;bottom:14px}}
.pk{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;border-radius:20px;background:var(--card);border:2px solid color-mix(in srgb,var(--acc) 45%,var(--line));box-shadow:var(--shadow);overflow:hidden;transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
.pk::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--acc3),transparent 70%);opacity:.9}
.pk > *{position:relative}
.pk:active{transform:scale(.97)}
.pk-art{width:86px;height:86px;flex:none}
.pk-n{font-family:var(--head);font-weight:800;font-size:1.45rem;letter-spacing:-.02em;color:var(--acc)}
.pk-m{font-size:.85rem;color:var(--ink2);font-weight:700}
.pk-go{margin-left:auto;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:#fff;flex:none}
[data-theme="dark"] .pk-go{color:#0D191B}
.neutral-stats{display:flex;gap:10px;margin-top:16px}
.neutral-stats .stat span{font-size:.78rem;color:var(--ink3);font-weight:700}

/* themed hero */
.hero{position:relative;display:flex;align-items:center;gap:10px;padding:18px 18px 18px 20px;margin-bottom:16px;border-radius:calc(var(--r) + 6px);background:linear-gradient(135deg,var(--acc3),var(--card) 80%);border:1.5px solid color-mix(in srgb,var(--acc) 35%,var(--line));overflow:hidden;box-shadow:var(--shadow)}
.hero-tx{flex:1;min-width:0}
.hero-k{font-weight:700;color:var(--ink2);font-size:.9rem}
.hero h1{font-size:clamp(2rem,8vw,2.9rem);color:var(--acc);margin:.05em 0 .12em;letter-spacing:-.035em}
.hero p{margin:0 0 12px;color:var(--ink2);max-width:34ch}
.hero-p{display:flex;align-items:center;gap:10px}
.hero-p b{font-family:var(--head);font-size:1.2rem;display:block;line-height:1}
.hero-p span{font-size:.8rem;color:var(--ink3);font-weight:700}
.hero-art{width:clamp(96px,30vw,170px);aspect-ratio:1;flex:none}

/* game intro */
.gi{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:4vh}
.gi-card{width:100%;max-width:520px;border-radius:26px;padding:28px 22px 26px;text-align:center;color:#fff;background:var(--gbg);box-shadow:0 18px 40px -18px rgba(0,0,0,.45);animation:giIn .55s cubic-bezier(.2,.9,.3,1.2)}
@keyframes giIn{from{opacity:0;transform:translateY(30px) scale(.92) rotateX(18deg)}}
.gi-code{display:inline-grid;place-items:center;min-width:68px;height:68px;padding:0 10px;border-radius:18px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.55);font-family:var(--head);font-weight:800;font-size:1.3rem;margin-bottom:12px}
.gi-card h2{font-size:clamp(1.5rem,6vw,2rem);margin:0 0 4px;color:#fff}
.gi-card p{margin:0;opacity:.9}
.gi-n{height:120px;display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:96px;line-height:1;margin-top:10px;text-shadow:0 6px 0 rgba(0,0,0,.15)}
.gi-n.go{font-size:72px}
.gi-hint{font-weight:700;opacity:.85;min-height:1.5em}

/* moving background – Full effects only, transform/opacity only, no filters */
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;contain:strict;--h1:var(--acc);--h2:var(--teal);--h3:var(--yel)}
body.s-bio #bgfx{--h2:#0F8F8C;--h3:#F3B52B}
body.s-chem #bgfx{--h2:#D2457C;--h3:#2156C4}
body.s-phy #bgfx{--h2:#0F8F8C;--h3:#7B3FC6}
body.s-none #bgfx{--h1:var(--bio);--h2:var(--chem);--h3:var(--phy)}
#main,#top{position:relative;z-index:1}
#top{position:sticky;z-index:30}
.au{position:absolute;width:75vmax;height:75vmax;border-radius:50%;will-change:transform;opacity:var(--ao,.32)}
[data-theme="dark"] .au{--ao:.22}
.au.a1{left:-30vmax;top:-30vmax;background:radial-gradient(circle,color-mix(in srgb,var(--h1) 55%,transparent) 0,transparent 62%);animation:auA 38s ease-in-out infinite alternate}
.au.a2{right:-34vmax;top:18vh;background:radial-gradient(circle,color-mix(in srgb,var(--h2) 45%,transparent) 0,transparent 62%);animation:auB 46s ease-in-out infinite alternate}
.au.a3{left:-10vmax;bottom:-42vmax;background:radial-gradient(circle,color-mix(in srgb,var(--h3) 40%,transparent) 0,transparent 62%);animation:auC 52s ease-in-out infinite alternate}
@keyframes auA{to{transform:translate(22vmax,14vmax) scale(1.15)}}
@keyframes auB{to{transform:translate(-18vmax,-12vmax) scale(.9)}}
@keyframes auC{to{transform:translate(16vmax,-14vmax) scale(1.2)}}
.bart{position:absolute;right:-18vmin;bottom:calc(var(--tabh) - 14vmin);width:min(78vmin,620px);aspect-ratio:1;color:var(--acc);opacity:.11;display:none;will-change:transform;animation:bartSpin 140s linear infinite}
.bart svg{width:100%;height:100%;overflow:visible}
[data-theme="dark"] .bart{opacity:.14}
@media (min-width:900px){.bart{bottom:-12vmin}}

  background:radial-gradient(circle at 35% 35%,color-mix(in srgb,var(--h1) 75%,#fff),color-mix(in srgb,var(--h1) 30%,transparent) 70%);animation:bkUp var(--t) var(--dl) linear infinite}
.bk:nth-of-type(3n+1){background:radial-gradient(circle at 35% 35%,color-mix(in srgb,var(--h2) 75%,#fff),color-mix(in srgb,var(--h2) 30%,transparent) 70%)}
@keyframes bkUp{0%{transform:translate(0,0);opacity:0}12%{opacity:var(--bo,.55)}50%{transform:translate(var(--sw),-55vh)}88%{opacity:var(--bo,.55)}100%{transform:translate(0,-112vh);opacity:0}}

/* quiz clock + time report */
.qclock{font-variant-numeric:tabular-nums;font-weight:800;color:var(--acc)}
.qclock.paused{opacity:.6}
.treport{text-align:left;margin:16px 0 12px;padding:14px;border-radius:var(--r2);background:var(--card2);border:1px solid var(--line)}
.treport h3{margin:0 0 8px}
.tstats{display:flex;gap:10px;margin-bottom:12px}
.tstats div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.tstats b{display:block;font-family:var(--head);font-size:1.3rem;line-height:1.1}
.tstats span{font-size:.78rem;color:var(--ink3);font-weight:700}
.tb{display:grid;grid-template-columns:minmax(90px,30%) 1fr auto;align-items:center;gap:8px;margin:6px 0;font-size:.85rem;font-weight:700}
.tbt{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.tbt i{display:block;height:100%;border-radius:6px;transform-origin:left;animation:grow 1s .2s cubic-bezier(.2,.8,.2,1) backwards}
.tbt i.y{background:var(--acc)}.tbt i.t{background:var(--ok)}.tbt i.n{background:var(--ink3)}
.tb b{font-variant-numeric:tabular-nums;white-space:nowrap}
.tv{margin:10px 0 6px}

/* about + update bar */

.cl{position:relative;margin-top:10px;padding-left:18px;border-left:2px solid var(--line)}
.clv{position:relative;padding:0 0 14px}
.clv::before{content:"";position:absolute;left:-25px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2.5px solid var(--ink3)}
.clv.now::before{border-color:var(--acc);background:var(--acc)}
.cln{font-family:var(--head);font-weight:800;font-size:1.08rem;display:flex;align-items:center;gap:8px}
.cln span{font-family:var(--font);font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--acc3);color:var(--acc)}
.clv ul{margin:4px 0 0;padding-left:1.05em;color:var(--ink2)}.clv li{margin:3px 0}
#updbar{position:fixed;left:12px;right:12px;bottom:calc(var(--tabh) + 14px + env(safe-area-inset-bottom));z-index:120;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;border-radius:16px;background:var(--ink);color:var(--bg);box-shadow:0 12px 30px -10px rgba(0,0,0,.5);max-width:560px;margin:0 auto}
#updbar span{flex:1;font-weight:700;font-size:.92rem}
#updbar .iconbtn{width:36px;height:36px;background:transparent;border-color:color-mix(in srgb,var(--bg) 30%,transparent);color:var(--bg)}
@media (min-width:900px){#updbar{bottom:20px;left:calc(var(--rail) + 20px)}}

<script>/* ===== core: helpers, state, storage, shell ===== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
function h(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.children.length===1?t.content.firstElementChild:t.content;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a,n){return shuffle(a).slice(0,n);}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SVGNS='http://www.w3.org/2000/svg';
function lerp(a,b,t){return a+(b-a)*t}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

/* Version rule (set by Mrudul): 1.0 = first release (Ch 5, 6). Each new chapter adds 1 to the middle number
   and resets the bug-fix count; each bug fix adds 1 to the last number. e.g. 1.1 → 1.1.1 … 1.1.5 → (new chapter) 1.2
   History: 1.0 – Ch 5 & 6 · 1.1 – Ch 1 The Living World */
const APP_VERSION='1.3.16'; /* rule: 1.<chapters>.<changes since last chapter>. Full history lives in CHANGELOG (about.js) – add a line there with every version bump. New chapter -> 1.4 (last number resets). */
const LESSONS={1:[],5:[],6:[]};
const allLessons=()=>Object.values(LESSONS).flat();
const DIAGRAMS={};
function reg(def){DIAGRAMS[def.id]=def;return def;}

/* ---------- state ---------- */
const DEFAULT_STATE=()=>({v:1,ts:0,lessons:{},quizBest:{c5:0,c6:0,mix:0},games:{},flash:{},wrong:{},exam:{},last:null,score:0,theme:null,seen:{}});
let S=DEFAULT_STATE();
const LSKEY='bio11-rev-v1';
const Store={db:null,uid:null,ref:null,timer:null,writing:false,pending:false,
  loadLocal(){try{const j=localStorage.getItem(LSKEY);if(j){S=Object.assign(DEFAULT_STATE(),JSON.parse(j));}}catch(e){}},
  saveLocal(){try{localStorage.setItem(LSKEY,JSON.stringify(S));}catch(e){}},
  save(){S.ts=Date.now();this.saveLocal();clearTimeout(this.timer);this.timer=setTimeout(()=>this.push(),1500);},
  async push(){if(!this.ref)return;if(this.writing){this.pending=true;return;}this.writing=true;
    try{await this.ref.set({state:JSON.stringify(S),ts:S.ts});}catch(e){if(e&&e.code==='invalid_argument'){this.ref=null;}}
    this.writing=false;if(this.pending){this.pending=false;this.push();}},
  async initRemote(){
    try{
      if(!window.claude||!window.claude.use)return;
      const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      if(!db||!user)return;
      const uid=await user.id(); if(!uid)return;
      this.db=db;this.uid=uid;this.ref=db.doc('data/users/'+uid+'/progress');
      const snap=await this.ref.get();
      if(snap.exists){const d=snap.data();
        if(d&&d.state&&(d.ts||0)>(S.ts||0)){try{const theme=S.theme;S=Object.assign(DEFAULT_STATE(),JSON.parse(d.state));if(!S.theme)S.theme=theme;this.saveLocal();applyTheme();App.refresh();}catch(e){}}
        else if((S.ts||0)>(d.ts||0)){this.push();}
      } else if(S.ts){this.push();}
      $('#syncDot')&&($('#syncDot').title='Progress synced to your Claude account');
      $('#syncDot')&&$('#syncDot').classList.remove('hidden');
    }catch(e){}
  }
};
function save(){Store.save();}

/* ---------- feedback ---------- */
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1900);}
function confetti(n=40,x,y){if(document.documentElement.classList.contains('lite'))n=Math.ceil(n/3);
  const cols=['#2e9d5a','#f3b52b','#e5588a','#2a74d4','#14b3a8','#8b5cf6'];
  x=x??innerWidth/2;y=y??innerHeight/2.4;
  for(let i=0;i<n;i++){const d=document.createElement('i');d.className='confetti';d.style.background=cols[i%cols.length];document.body.appendChild(d);
    const a=Math.random()*Math.PI*2,v=120+Math.random()*260,dx=Math.cos(a)*v,dy=Math.sin(a)*v-200,rot=Math.random()*720;
    d.animate([{transform:`translate(${x}px,${y}px) rotate(0)`,opacity:1},{transform:`translate(${x+dx}px,${y+dy+420}px) rotate(${rot}deg)`,opacity:0}],{duration:1100+Math.random()*600,easing:'cubic-bezier(.2,.6,.4,1)'}).onfinish=()=>d.remove();}
}
function confirmBox(title,msg,okText='Yes'){return new Promise(res=>{const m=$('#modal');m.innerHTML=`<div class="box"><h2>${title}</h2><p class="muted">${msg}</p><div class="row mt"><button class="btn ghost" data-r="0" style="flex:1">Cancel</button><button class="btn bad" data-r="1" style="flex:1">${okText}</button></div></div>`;m.classList.add('on');
  m.onclick=e=>{const b=e.target.closest('[data-r]');if(b||e.target===m){m.classList.remove('on');res(b?b.dataset.r==='1':false);}};});}
function addScore(n){S.score=(S.score||0)+n;save();}

/* ---------- wrong tab ---------- */
function wrongSubj(it){if(it.subj)return it.subj;let ch=null;
  if(it.type==='mcq'&&typeof MCQ!=='undefined'){const q=MCQ.find(x=>x.id===it.id);if(q)ch=q.ch;}
  if(it.type==='exam'&&typeof EXAM!=='undefined'){const e=EXAM.find(x=>x.id===it.id);if(e)ch=e.ch;}
  const s=ch!=null&&subjOf(ch);return s?s.id:'bio';}
function wrongItems(all){const v=Object.values(S.wrong||{});return (all||!App.subj)?v:v.filter(i=>wrongSubj(i)===App.subj);}
function wrongCount(all){return wrongItems(all).length;}
function addWrong(item){if(!item||!item.key)return;const isNew=!S.wrong[item.key];if(!item.subj)item.subj=(item.ch&&subjOf(item.ch)?subjOf(item.ch).id:null)||(wrongSubj(item)!=='bio'?wrongSubj(item):(App.subj||'bio'));S.wrong[item.key]=Object.assign({},item,{t:Date.now()});save();updateBadge(isNew);}
function removeWrong(key){if(S.wrong[key]){delete S.wrong[key];save();updateBadge();}}
function updateBadge(pop){const b=$('#wrongBadge');const n=wrongCount();b.textContent=n;b.classList.toggle('hidden',n===0);if(pop){b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');}}

/* ---------- icons ---------- */
const IC={swap:'<path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/>',home:'<path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 learn:'<path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19"/><path d="M9 7.5h6"/>',
 practice:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3"/>',
 games:'<rect x="2.5" y="7" width="19" height="11" rx="5"/><path d="M7.5 10.5v4M5.5 12.5h4"/><circle cx="15.5" cy="11.5" r=".9"/><circle cx="17.8" cy="13.8" r=".9"/>',
 wrong:'<path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4v4h4"/><path d="M10 10l4 4M14 10l-4 4"/>',
 progress:'<path d="M5 20V11M11 20V5M17 20v-6"/><path d="M3 20h18"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>',
 moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
 next:'<path d="M9 6l6 6-6 6"/>',bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',quiz:'<path d="M9.1 9a3 3 0 1 1 4.2 2.7c-.8.4-1.3 1.1-1.3 2V15"/><circle cx="12" cy="18.3" r=".6"/><circle cx="12" cy="12" r="9.5"/>',
 card:'<rect x="3" y="5" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/>',exam:'<path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h6"/>'};
const icon=(n,cls='ic')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;

/* ---------- theme ---------- */
function applyTheme(){const t=S.theme||'dark';document.documentElement.dataset.theme=t;const b=$('#themeBtn');if(b){b.innerHTML=icon(t==='dark'?'sun':'moon');b.setAttribute('aria-label',t==='dark'?'Switch to light mode':'Switch to dark mode');}}

/* ---------- subjects & chapters ---------- */
const SUBJECTS=[
 {id:'bio',name:'Biology',sym:'Bio',chapters:[{key:1,num:1,code:'Lw',title:'The Living World'},{key:5,num:5,code:'Mo',title:'Morphology of Flowering Plants'},{key:6,num:6,code:'An',title:'Anatomy of Flowering Plants'}]},
 {id:'chem',name:'Chemistry',sym:'Chem',chapters:[],next:'Chemical Bonding'},
 {id:'phy',name:'Physics',sym:'Phy',chapters:[],next:'Projectile motion'}];
const subjOf=key=>SUBJECTS.find(s=>s.chapters.some(c=>c.key===key));
const chapOf=key=>{for(const s of SUBJECTS)for(const c of s.chapters)if(c.key===key)return c;return null;};
function lessonMark(l){if(l.mark)return l.mark;const m=l.title.match(/^(\d+(?:\.\d+)*)\s/);if(m)return m[1];if(/^Intro/i.test(l.title))return 'Intro';if(/summary/i.test(l.title))return 'Sum';if(/T\.S\./.test(l.title))return 'T.S.';if(/Compare/i.test(l.title))return 'vs';return l.title.slice(0,2);}
function lessonName(l){return l.title.replace(/^\d+(?:\.\d+)*\s/,'');}

/* ---------- visual effects: full or lite ---------- */
const FX={auto:true,lite:false,
  init(){const pref=S.fx||'auto';if(pref!=='auto'){this.set(pref==='lite');return;}
    const weak=(navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=4)||(navigator.deviceMemory&&navigator.deviceMemory<=3)||matchMedia('(prefers-reduced-motion: reduce)').matches;
    this.set(!!weak);
    if(!weak){let n=0,last=performance.now(),slow=0;const f=t=>{const d=t-last;last=t;if(n>3&&d>34)slow++;if(++n<40)requestAnimationFrame(f);else if(slow>12)this.set(true);};requestAnimationFrame(f);}},
  set(l){this.lite=l;document.documentElement.classList.toggle('lite',l);}};
function floatPts(anchor,txt){if(!anchor)return;const r=anchor.getBoundingClientRect();const d=document.createElement('div');d.className='fpts';d.textContent=txt;d.style.left=(r.left+r.width/2)+'px';d.style.top=(r.top+4)+'px';document.body.appendChild(d);
  d.animate([{transform:'translate(-50%,0) scale(.7)',opacity:0},{transform:'translate(-50%,-24px) scale(1.15)',opacity:1,offset:.3},{transform:'translate(-50%,-64px) scale(1)',opacity:0}],{duration:1000,easing:'ease-out'}).onfinish=()=>d.remove();}
function animateScreen(scr){
  $$('.tile,.cont,.qa,.chr,.lcard,.psub,.exq,.stat,.ph,.sech,.empty',scr).forEach((e,k)=>{e.style.setProperty('--d',Math.min(k,14)*38+'ms');e.classList.add('ai');});
  $$('.stat b',scr).forEach(b=>{const tn=b.firstChild;if(!tn||tn.nodeType!==3)return;const v=parseInt(tn.textContent);if(!(v>0))return;const t0=performance.now();tn.textContent='0';const f=n=>{const k=Math.min(1,(n-t0)/850);tn.textContent=Math.round(v*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f);};requestAnimationFrame(f);});
}
function revealOnScroll(root){if(!('IntersectionObserver' in window))return;const els=$$('.lbody > .card, .lbody > .seg, .lbody > .sec, .notes, .terms, .qcw > .card, .lbody > div > .card',root);
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('seen');io.unobserve(e.target);}}),{rootMargin:'0px 0px -6% 0px'});
  els.forEach(e=>{e.classList.add('rv');io.observe(e);});}

/* ---------- shell / router ---------- */
const TABS=[['home','Home'],['learn','Learn'],['practice','Practice'],['games','Games'],['wrong','Wrong Tab'],['progress','Progress']];
const App={tab:'home',stack:[],subj:null,learnCh:5,
  init(){
    const tabs=$('#tabs');
    tabs.innerHTML=TABS.map(([id,l])=>`<button data-tab="${id}" aria-label="${l}">${icon(id)}<span class="lb">${l}</span>${id==='wrong'?'<span class="badge hidden" id="wrongBadge">0</span>':''}</button>`).join('');
    tabs.onclick=e=>{const b=e.target.closest('[data-tab]');if(b)this.go(b.dataset.tab);};
    $('#themeBtn').onclick=()=>{S.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';applyTheme();save();};
    $('#backBtn').onclick=()=>this.back();$('#subjBtn').onclick=clearSubject;
    window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(TABS.some(x=>x[0]===t)&&t!==this.tab)this.go(t,true);});
    applyTheme();updateBadge();FX.init();BgFx.init();Updater.init();
    const t=location.hash.slice(1);this.go(TABS.some(x=>x[0]===t)?t:'home',true);Splash.show();
  },
  go(tab,noHash){this.tab=tab;this.stack=[];if(!noHash){try{history.replaceState(null,'','#'+tab);}catch(e){}}
    $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));this.render();},
  push(fn,title,opts={}){this.stack.push({fn,title,opts});this.render();},
  back(){this.stack.pop();this.render(true);},
  refresh(){this.render(false,true);},
  render(isBack,quiet){
    Focus.close(true);const x3=$('#x3d');if(x3&&x3.classList.contains('on')){x3.classList.remove('on');x3.innerHTML='';document.body.style.overflow='';}
    const main=$('#main');const top=this.stack[this.stack.length-1];
    main.innerHTML='';const scr=document.createElement('div');scr.className='screen'+(isBack?' back':'');if(quiet)scr.style.animation='none';main.appendChild(scr);
    let subj=this.subj;if(top&&top.opts.ch){const s=subjOf(top.opts.ch);if(s)subj=s.id;}
    document.body.className='s-'+(subj||'none');$('#subjBtn').classList.toggle('hidden',!subj||!!top);{const pt=$('#tabs [data-tab=progress]');if(pt)pt.classList.toggle('hidden',!!this.subj);}updateBadge();if(subj)$('#subjBtn').innerHTML=`<b>${SUBJECTS.find(s=>s.id===subj).sym}</b>${icon('swap')}`;
    $('#backBtn').classList.toggle('show',!!top);
    const S0=SUBJECTS.find(s=>s.id===subj);$('#mk').textContent=(top&&top.opts.ch)?S0.sym:'MD';
    if(top){$('#ttl').textContent=top.title;top.fn(scr);animateScreen(scr);}
    else{$('#ttl').textContent={home:'Class 11 Revision',learn:'Learn',practice:'Practice',games:'Games',wrong:'Wrong Tab',progress:'Progress'}[this.tab];

/* ---------- progress helpers ---------- */
function chLessons(key){const ls=LESSONS[key]||[];return {done:ls.filter(l=>S.lessons[l.id]).length,total:ls.length};}
function chProgress(key){const {done,total}=chLessons(key);if(!total)return 0;return clamp(done/total*.7+((S.quizBest['c'+key]||0)/100)*.3,0,1);}
function subjProgress(s){if(!s.chapters.length)return 0;return s.chapters.reduce((a,c)=>a+chProgress(c.key),0)/s.chapters.length;}
function overallProgress(){const act=SUBJECTS.filter(s=>s.chapters.length);if(!act.length)return 0;
  const fcTotal=(typeof FLASH!=='undefined'&&FLASH.length?FLASH.length:1);const fc=Object.values(S.flash||{}).filter(v=>v==='got').length/fcTotal;
  return clamp(act.reduce((a,s)=>a+subjProgress(s),0)/act.length*.85+fc*.15,0,1);}
function ringSVG(p,size=110,stroke=10,col='var(--acc)'){const r=(size-stroke)/2,c=2*Math.PI*r;return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--card2)" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" style="--c:${c};animation:ringIn 1.3s cubic-bezier(.2,.8,.2,1) backwards"/></svg>`;}
const pct=p=>Math.round(p*100)+'%';

/* element tile */

/* ===== Diagram engine + Focus Mode ===== */
function labelsSVG(labels,parts,fs=13){
  return labels.map(L=>{const [pid,x,y,tx,ty,anc,txt]=L;const p=parts.find(q=>q.id===pid);const name=txt||(p?p.name:pid);const a=anc||(tx<x?'end':'start');
    return `<g class="lbl" data-part="${pid}"><line x1="${x}" y1="${y}" x2="${tx+(a==='end'?3:a==='start'?-3:0)}" y2="${ty}"/><circle cx="${x}" cy="${y}" r="${fs*.18}"/><text class="lt" x="${tx}" y="${ty+fs*.33}" text-anchor="${a}" style="font-size:${fs}px;stroke-width:${fs*.3}px">${name}</text><text class="lq" x="${tx}" y="${ty+fs*.33}" text-anchor="${a}" style="font-size:${fs*1.15}px" font-weight="900">?</text></g>`;}).join('');
}
const Diagram={
  create(def,opts={}){

    const zm=h(`<div class="dg-zoom"><button aria-label="Zoom out">－</button><button aria-label="Zoom in">＋</button></div>`);

    lb.onclick=()=>{inst.labelsOn=!inst.labelsOn;inst.svg.classList.toggle('nolabels',!inst.labelsOn);lb.textContent=inst.labelsOn?'🏷️ Labels on':'🙈 Labels off';};
    bar.appendChild(lb);inst.labelBtn=lb;
    if(def.no3d!==true&&def.parts.length>=2){const b3=h(`<button class="btn ghost sm">3D layers</button>`);b3.onclick=()=>X3D.open(inst);bar.appendChild(b3);}
    if(def.quiz!==false&&def.parts.length>=3){const qb=h(`<button class="btn sm">🎯 Quiz me</button>`);qb.onclick=()=>Diagram.quiz(inst);bar.appendChild(qb);}
    inst.render=(svgStr)=>{
      const s=svgStr!==undefined?svgStr:(typeof def.svg==='function'?def.svg():def.svg);
      view.innerHTML=`<svg viewBox="${def.vb}" xmlns="${SVGNS}" role="img" aria-label="${esc(def.title)}">${s}${def.labels?labelsSVG(def.labels,def.parts,def.fs||(+def.vb.split(' ')[2])/30):''}</svg>`;
      inst.svg=$('svg',view);if(def.flat!==true)inst.svg.classList.add('d3');inst.svg.classList.toggle('nolabels',!inst.labelsOn);inst.svg.style.width=(inst.zoom*100)+'%';inst.svg.classList.toggle('zoomed',inst.zoom>1.01);
      Diagram.bind(inst);if(opts.onRender)opts.onRender(inst.svg,inst);
    };
    inst.render();
    if('IntersectionObserver' in window){const io=new IntersectionObserver((es,o)=>{if(es[0].isIntersecting){o.disconnect();view.animate([{transform:'perspective(900px) rotateX(18deg) translateY(18px) scale(.97)',opacity:.35},{transform:'none',opacity:1}],{duration:750,easing:'cubic-bezier(.2,.8,.2,1)'});}},{threshold:.25});io.observe(view);}
    if(def.hint!==false){const hint=h(`<div class="dg-hint">👆 Tap any part</div>`);$('.dg-vw',wrap).appendChild(hint);setTimeout(()=>hint.style.opacity=0,4500);}
    bar.appendChild(zm);const [zo,zi]=$$('button',zm);
    const setZ=z=>{inst.zoom=clamp(z,1,4);inst.svg.style.width=(inst.zoom*100)+'%';inst.svg.classList.toggle('zoomed',inst.zoom>1.01);};
    zi.onclick=()=>setZ(inst.zoom+.5);zo.onclick=()=>setZ(inst.zoom-.5);
    // pinch zoom
    let pd=0,pz=1;
    view.addEventListener('touchstart',e=>{if(e.touches.length===2){pd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);pz=inst.zoom;}},{passive:true});
    view.addEventListener('touchmove',e=>{if(e.touches.length===2&&pd){e.preventDefault();const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);setZ(pz*d/pd);}},{passive:false});
    view.addEventListener('touchend',()=>{pd=0;});

  },
  bind(inst){
    const svg=inst.svg,def=inst.def,tip=$('#tip');
    const setHL=pid=>{$$('.hl',svg).forEach(e=>e.classList.remove('hl'));if(pid){$$(`[data-part="${pid}"]`,svg).forEach(e=>e.classList.add('hl'));}svg.classList.toggle('hovering',!!pid);};
    svg.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||inst.quiz)return;const t=e.target.closest('[data-part]');const pid=t&&t.dataset.part;const p=pid&&def.parts.find(q=>q.id===pid);
      if(p){if(inst._hl!==pid){setHL(pid);inst._hl=pid;}tip.textContent=p.name;tip.style.left=e.clientX+'px';tip.style.top=e.clientY+'px';tip.classList.add('on');}
      else{if(inst._hl){setHL(null);inst._hl=null;}tip.classList.remove('on');}});
    svg.addEventListener('pointerleave',()=>{setHL(null);inst._hl=null;tip.classList.remove('on');});
    svg.addEventListener('click',e=>{if(inst.quiz)return;const t=e.target.closest('[data-part]');if(!t)return;const i=def.parts.findIndex(q=>q.id===t.dataset.part);if(i<0)return;tip.classList.remove('on');setHL(null);inst._hl=null;Focus.open(inst,i);});
  },
  async quiz(inst){
    if(inst.quiz){return;}
    const def=inst.def,svg=()=>inst.svg;
    const pool=def.parts.filter(p=>$$(`[data-part="${p.id}"]:not(.lbl)`,svg()).length&&!p.noquiz);
    const rounds=shuffle(pool).slice(0,Math.min(5,pool.length));
    const bar=h(`<div class="qbar"></div>`);inst.wrap.appendChild(bar);inst.quiz=true;
    const prevLabels=inst.labelsOn;inst.svg.classList.add('nolabels','quizzing');

    for(let r=0;r<rounds.length;r++){

      $$('.pulse',svg()).forEach(e=>e.classList.remove('pulse'));
      $$(`[data-part="${p.id}"]:not(.lbl)`,svg()).forEach(e=>e.classList.add('pulse'));

      const opts=shuffle([p.name,...others]);
      bar.innerHTML=`<div class="qhead"><span>🎯 Diagram quiz · ${r+1}/${rounds.length}</span><span>Score ${score}</span></div><div class="q">Which part is glowing?</div><div class="opts two">${opts.map(o=>`<button class="opt">${o}</button>`).join('')}</div>`;
      const ans=await new Promise(res=>{$$('.opt',bar).forEach(b=>b.onclick=()=>res(b));});
      const ok=ans.textContent===p.name;
      $$('.opt',bar).forEach(b=>{b.disabled=true;if(b.textContent===p.name)b.classList.add('right');else if(b===ans)b.classList.add('wrong');else b.classList.add('dim');});
      if(ok){score++;addScore(5);}else{addWrong({key:`dp:${def.id}:${p.id}`,type:'dpart',d:def.id,p:p.id,src:def.title});}
      bar.insertAdjacentHTML('beforeend',`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'Correct! 🎉':'Not quite — it is the '+p.name+'. Saved to Wrong Tab.'}</b>${p.desc}</div>`);
      await sleep(ok?1300:2300);
    }
    $$('.pulse',svg()).forEach(e=>e.classList.remove('pulse'));
    inst.svg.classList.remove('quizzing');inst.svg.classList.toggle('nolabels',!prevLabels);
    bar.innerHTML=`<div class="center"><div class="big-emoji">${score===rounds.length?'🏆':score>=rounds.length/2?'🌟':'🌱'}</div><h3>${score}/${rounds.length} correct</h3><button class="btn sm">Done</button></div>`;
    if(score===rounds.length)confetti(40);
    $('button',bar).onclick=()=>{bar.remove();inst.quiz=null;};
  }
};

const Focus={inst:null,idx:0,
  open(inst,idx){

    const end=()=>{if(sx===null)return;sx=null;st.style.transition='transform .6s cubic-bezier(.3,1.4,.5,1)';st.style.transform='';};
    st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);

  },
  step(d){const n=this.inst.def.parts.length;this.idx=(this.idx+d+n)%n;this.show(false,d);},
  show(first,dir){
    const inst=this.inst,def=inst.def,p=def.parts[this.idx],f=$('#focus');

    // build stage svg
    let svgStr;
    if(p.detail){svgStr=`<svg class="d3w" viewBox="${p.detail.vb}" xmlns="${SVGNS}">${p.detail.svg}</svg>`;stage.innerHTML=svgStr;}
    else{
      const src=inst.svg,els=$$(`[data-part="${p.id}"]:not(.lbl)`,src);
      const inv=src.getScreenCTM().inverse();
      let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;const g=document.createElementNS(SVGNS,'g');
      const boxes=[];
      els.forEach(el=>{const bb=el.getBBox();const m=inv.multiply(el.getScreenCTM());let b=[1e9,1e9,-1e9,-1e9];
        [[bb.x,bb.y],[bb.x+bb.width,bb.y],[bb.x,bb.y+bb.height],[bb.x+bb.width,bb.y+bb.height]].forEach(([x,y])=>{const X=m.a*x+m.c*y+m.e,Y=m.b*x+m.d*y+m.f;b=[Math.min(b[0],X),Math.min(b[1],Y),Math.max(b[2],X),Math.max(b[3],Y)];x1=Math.min(x1,X);y1=Math.min(y1,Y);x2=Math.max(x2,X);y2=Math.max(y2,Y);});boxes.push(b);
        const c=el.cloneNode(true);c.removeAttribute('transform');c.classList.remove('hl','pulse');[c,...c.querySelectorAll('*')].forEach(q=>{if(q.style){q.style.removeProperty('transform');q.style.removeProperty('opacity');}});const w=document.createElementNS(SVGNS,'g');w.setAttribute('transform',`matrix(${m.a},${m.b},${m.c},${m.d},${m.e},${m.f})`);w.appendChild(c);g.appendChild(w);});
      if(!els.length){x1=0;y1=0;x2=100;y2=100;}

const X3D={
  open(inst){

    const [vx,vy,vw,vh]=def.vb.split(/\s+/).map(Number);
    const inv=src.getScreenCTM().inverse();
    const cl=e=>{const m=inv.multiply(e.getScreenCTM());const c=e.cloneNode(true);c.removeAttribute('transform');c.classList.remove('hl','pulse');[c,...c.querySelectorAll('*')].forEach(q=>{if(q.style){q.style.removeProperty('transform');q.style.removeProperty('opacity');q.style.transition='none';}});return `<g transform="matrix(${m.a},${m.b},${m.c},${m.d},${m.e},${m.f})">${c.outerHTML}</g>`;};
    const tops=$$('[data-part]:not(.lbl)',src).filter(e=>!e.parentElement.closest('[data-part]'));
    const order=[],groups={};tops.forEach(e=>{const id=e.dataset.part;if(!groups[id]){groups[id]=[];order.push(id);}groups[id].push(e);});
    const base=$$('path,rect,circle,ellipse,line,polygon,polyline,text',src).filter(e=>!e.closest('[data-part]')&&!e.closest('.lbl')&&!e.closest('defs')&&!e.matches('rect.fw'));
    const layers=[];if(base.length)layers.push({id:null,name:'Base',html:base.map(cl).join('')});
    order.forEach(id=>{const p=def.parts.find(q=>q.id===id);layers.push({id,name:p?p.name:'',p,html:groups[id].map(cl).join('')});});
    const defs=$('defs',src);const N=layers.length;
    const x=$('#x3d');
    x.innerHTML=`<div class="veil"></div><div class="x3-wrap"><div class="x3-top"><div style="flex:1;min-width:0"><h2>${esc(def.title)}</h2><div class="small">Drag to turn it · tap a layer or a name to lift it out</div></div><button class="iconbtn x3-x" aria-label="Close 3D view">✕</button></div>
      <div class="x3-scene"><div class="x3-stack">${layers.map((L,i)=>`<div class="x3-layer" data-i="${i}"><svg class="d3" viewBox="${def.vb}" xmlns="${SVGNS}">${defs?defs.outerHTML:''}${L.html}</svg></div>`).join('')}</div></div>
      <div class="x3-ctl"><label>Separate <input type="range" min="0" max="100" value="70" class="x3-gap"></label><button class="btn ghost sm x3-reset">Reset view</button></div>
      <div class="x3-chips">${layers.map((L,i)=>L.id?`<button class="chip" data-i="${i}">${esc(L.name)}</button>`:'').join('')}</div>
      <div class="x3-info">Layers are stacked in the order they are built, from the outside in. Tap one to lift it out and read about it.</div></div>`;
    x.classList.add('on');document.body.style.overflow='hidden';
    const scene=$('.x3-scene',x),stack=$('.x3-stack',x),ls=$$('.x3-layer',x),info=$('.x3-info',x),gapIn=$('.x3-gap',x);
    const size=()=>{const r=scene.getBoundingClientRect();const k=Math.min(r.width*.78/vw,r.height*.62/vh);stack.style.width=vw*k+'px';stack.style.height=vh*k+'px';return k;};
    let k=size();const maxGap=()=>Math.min(70,(Math.min(scene.clientHeight,520)*.9)/Math.max(1,N-1));
    let rx=0,rz=0,gap=0,sel=-1;
    const apply=()=>{stack.style.transform=`translateY(${(N-1)*gap*Math.sin(rx*Math.PI/180)/2}px) rotateX(${rx}deg) rotateZ(${rz}deg)`;ls.forEach((l,i)=>{l.style.transform=`translateZ(${i*gap+(i===sel?Math.max(60,gap*1.5):0)}px)`;});};
    const tween=(to,ms=1100)=>{const fr={rx,rz,gap},t0=performance.now();const step=n=>{const t=Math.min(1,(n-t0)/ms),e=1-Math.pow(1-t,3);rx=fr.rx+(to.rx-fr.rx)*e;rz=fr.rz+(to.rz-fr.rz)*e;gap=fr.gap+(to.gap-fr.gap)*e;apply();if(t<1&&x.classList.contains('on'))requestAnimationFrame(step);};requestAnimationFrame(step);};
    const home=()=>({rx:56,rz:-26,gap:maxGap()*gapIn.value/100});
    apply();setTimeout(()=>tween(home()),120);
    const select=i=>{sel=(sel===i||i<0)?-1:i;stack.classList.toggle('has-sel',sel>=0);ls.forEach((l,j)=>l.classList.toggle('sel',j===sel));$$('.x3-chips .chip',x).forEach(c=>c.classList.toggle('on',+c.dataset.i===sel));
      const L=layers[sel];info.innerHTML=sel>=0&&L.p?`<b>${L.p.name}</b> – ${L.p.desc}${L.p.fn?' <span class="muted">'+L.p.fn+'</span>':''}`:'Tap a layer or a name to lift it out.';
      if(sel>=0){const c=$(`.x3-chips .chip[data-i="${sel}"]`,x);c&&c.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});}apply();};
    $$('.x3-chips .chip',x).forEach(c=>c.onclick=()=>select(+c.dataset.i));
    gapIn.oninput=()=>{gap=maxGap()*gapIn.value/100;apply();};
    $('.x3-reset',x).onclick=()=>{select(-1);tween(home(),700);};
    let px=null,py=0,mv=0;
    scene.addEventListener('pointerdown',e=>{px=e.clientX;py=e.clientY;mv=0;});
    scene.addEventListener('pointermove',e=>{if(px===null)return;const dx=e.clientX-px,dy=e.clientY-py;mv+=Math.abs(dx)+Math.abs(dy);px=e.clientX;py=e.clientY;rz+=dx*.45;rx=clamp(rx-dy*.35,0,82);apply();});
    scene.addEventListener('pointerup',e=>{const was=mv;px=null;if(was<8){const t=document.elementFromPoint(e.clientX,e.clientY);const l=t&&t.closest&&t.closest('.x3-layer');if(l&&layers[+l.dataset.i].id)select(+l.dataset.i);else if(sel>=0)select(-1);}});
    scene.addEventListener('pointercancel',()=>{px=null;});
    const onR=()=>{k=size();};addEventListener('resize',onR);
    const close=()=>{x.classList.remove('on');x.innerHTML='';document.body.style.overflow='';removeEventListener('resize',onR);document.removeEventListener('keydown',kh);};
    const kh=e=>{if(e.key==='Escape')close();};document.addEventListener('keydown',kh);
    $('.x3-x',x).onclick=close;$('.veil',x).onclick=close;
  }
};

const KEYS='ABCD';
/* render one MCQ into el; resolves true/false */
function askMCQ(el,item,{head='',onWrongSave=true,src='Quiz'}={}){
  return new Promise(res=>{
    const order=shuffle(item.o.map((t,i)=>i));
    el.innerHTML=`${head}<div class="qtext">${item.q}</div><div class="opts">${order.map((oi,k)=>`<button class="opt" data-i="${oi}"><span class="k">${KEYS[k]}</span><span>${item.o[oi]}</span></button>`).join('')}</div><div class="fbx"></div>`;
    $$('.opt',el).forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i,ok=i===item.a;
      $$('.opt',el).forEach(x=>{x.disabled=true;const xi=+x.dataset.i;if(xi===item.a)x.classList.add('right');else if(x===b)x.classList.add('wrong');else x.classList.add('dim');});
      if(ok){addScore(10);const r=b.getBoundingClientRect();confetti(14,r.left+r.width/2,r.top);floatPts(b,'+10');}
      else if(onWrongSave)addWrong({key:'q:'+item.id,type:'mcq',id:item.id,q:item.q,o:item.o,a:item.a,e:item.e||'',src});
      $('.fbx',el).innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?pick(['Correct! 🎉','Nailed it! 🌟','Spot on! ✅','Yes! 🌱'],1)[0]:'Not quite 💭'+(onWrongSave?' · saved to Wrong Tab':'')}</b>${item.e||''}</div>`;
      res(ok);
    });
  });
}

function startQuiz(mode,n){
  const pool=MCQ.filter(q=>mode==='mix'||q.ch===+mode.slice(1));
  const qs=shuffle(pool).slice(0,n||pool.length);
  const title=mode==='mix'?'Biology quiz':'Chapter '+mode.slice(1)+' quiz';
  App.push(async scr=>{
    let score=0,spent=0;const times=[];const fmt=ms=>{const s=Math.round(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
    let qStart=0,running=false;const tick=setInterval(()=>{if(!scr.isConnected){clearInterval(tick);return;}const el=$('.qclock b',scr);if(el)el.textContent=fmt(spent+(running?performance.now()-qStart:0));},250);
    for(let i=0;i<qs.length;i++){
      if(!scr.isConnected)return;
      const head=`<div class="qhead"><span>Question ${i+1} of ${qs.length}</span><span class="qclock">⏱ <b>${fmt(spent)}</b></span><span>⭐ ${score}</span></div><div class="progressbar"><i style="width:${i/qs.length*100}%"></i></div>`;
      const box=h('<div class="card"></div>');scr.innerHTML='';scr.appendChild(box);
      qStart=performance.now();running=true;
      const ok=await askMCQ(box,qs[i],{head,src:title});
      const t=performance.now()-qStart;running=false;spent+=t;times.push(t);if(ok)score++;
      const ck=$('.qclock',box);if(ck){ck.classList.add('paused');$('b',ck).textContent=fmt(spent);}
      await nextBtn(box,i===qs.length-1?'See my score 🏁':'Next ▶');
    }
    clearInterval(tick);
    const pct=Math.round(score/qs.length*100);const k=mode;const best=S.quizBest[k]||0;const nb=pct>best;if(nb){S.quizBest[k]=pct;save();}
    scr.innerHTML=`<div class="card center"><div class="ring" style="margin:10px auto">${ringSVG(pct/100,130,13)}<div class="v">${pct}%<small>${score}/${qs.length}</small></div></div>
    <h2>${pct>=90?'Outstanding! 🏆':pct>=70?'Great work! 🌟':pct>=50?'Good effort! 🌱':'Keep practising! 💪'}</h2>${nb?'<p class="pill">New best score!</p>':''}
    <p class="muted">${qs.length-score} question${qs.length-score===1?'':'s'} added to your Wrong Tab.</p>
    ${timeReport(times,subjOf(mode==='mix'?qs[0].ch:+mode.slice(1)).id,score)}
    <div class="row" style="justify-content:center"><button class="btn ghost" id="again">Try again</button>${qs.length-score?'<button class="btn bad" id="toWrong">Fix mistakes ❌</button>':''}</div></div>`;
    if(pct>=70)confetti(60);
    $('#again',scr).onclick=()=>{App.stack.pop();startQuiz(mode,n);};
    $('#toWrong',scr)&&($('#toWrong',scr).onclick=()=>App.go('wrong'));
  },title,{ch:mode==='mix'?5:+mode.slice(1)});
}

/* ---------- quiz timing vs NEET pace ----------
   NEET UG: 180 questions in 180 minutes = 1 minute per question on average.
   Coaching guidance for the target pace: Biology under ~45 s per question,
   Chemistry about 1 min, Physics a little over 1 min (about 55 min for 45). */
const PACE={bio:{target:45,name:'Biology',why:'Coaching institutes suggest finishing Biology at under about 45 seconds a question, so you save time for Physics.'},
  chem:{target:60,name:'Chemistry',why:'Coaching institutes suggest about 1 minute a question for Chemistry.'},
  phy:{target:73,name:'Physics',why:'Coaching institutes suggest about 55 minutes for the 45 Physics questions – a little over 1 minute each.'}};
function timeReport(times,subj,correct){
  const n=times.length;if(!n)return '';const P=PACE[subj]||PACE.bio;
  const you=times.reduce((a,b)=>a+b,0)/1000,avg=you/n,tgt=P.target*n,neet=60*n;
  const f=s=>{s=Math.round(s);const m=Math.floor(s/60),r=s%60;return m?`${m} min ${r?r+' s':''}`.trim():`${r} s`;};
  const slow=times.indexOf(Math.max(...times));const mx=Math.max(you,tgt,neet);
  const acc=correct==null?1:correct/n;
  const verdict=(avg<=P.target&&acc<.6)?['bad','Fast, but rushing','Your speed is good, but under 60% were right. In NEET each wrong answer costs a mark, so slow down a little and read every option.']:avg<=P.target?['ok','Exam-ready pace','You were at or under the target pace. Keep accuracy high at this speed.']:avg<=60?['mid','Within NEET time','You are inside the 1-minute NEET average but slower than the '+P.name+' target. Aim to answer the easy recall questions faster.']:['bad','Too slow for NEET','You took more than the 1-minute NEET average. Revise the notes, then retry to build speed.'];
  const bar=(lbl,v,cls)=>`<div class="tb"><span>${lbl}</span><div class="tbt"><i class="${cls}" style="width:${(v/mx*100).toFixed(1)}%"></i></div><b>${f(v)}</b></div>`;
  return `<div class="treport"><h3>Your time</h3>
    <div class="tstats"><div><b>${f(you)}</b><span>total for ${n} questions</span></div><div><b>${f(avg)}</b><span>per question</span></div></div>
    ${bar('You',you,'y')}${bar(P.name+' target',tgt,'t')}${bar('NEET average',neet,'n')}
    <div class="fb ${verdict[0]==='ok'?'ok':verdict[0]==='bad'?'bad':''} tv"><b>${verdict[1]}</b>${verdict[2]}</div>
    <p class="small muted">Slowest: question ${slow+1} (${f(times[slow]/1000)}). The clock counts only thinking time – it pauses while you read the explanation.<br>NEET gives 180 minutes for 180 questions – 1 minute each. ${P.why}</p></div>`;
}

function retryWrong(){
  const items=shuffle(wrongItems());
  App.push(async scr=>{
    let fixed=0;
    for(let i=0;i<items.length;i++){
      if(!scr.isConnected)return;
      const it=items[i];const box=h('<div class="card"></div>');scr.innerHTML='';scr.appendChild(box);
      const head=`<div class="qhead"><span>Fixing ${i+1} of ${items.length}</span><span>✅ ${fixed} cleared</span></div><div class="progressbar"><i style="width:${i/items.length*100}%"></i></div>`;
      let ok=false;
      if(it.type==='mcq')ok=await askMCQ(box,it,{head,onWrongSave:false});
      else if(it.type==='dpart')ok=await askDPart(box,it,head);

      if(ok){fixed++;removeWrong(it.key);box.classList.add('glow');confetti(30);toast('Cleared from Wrong Tab! 🎉');}
