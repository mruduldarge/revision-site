const NOTES={};
const n5=(id,o)=>NOTES[id]=o;
n5('c5-plant',{notes:`
<h4>Why study morphology?</h4><ul>
<li>Angiosperms show a <b>large diversity in external structure (morphology)</b>, but all are characterised by the presence of <b>roots, stems, leaves, flowers and fruits</b>.</li>
<li>For successful <b>classification</b> and understanding of any higher plant we need <b>standard technical terms</b> and <b>standard definitions</b>.</li>
<li>We also need to know the <b>variations</b> in different parts – found as <b>adaptations</b> to the environment, e.g. adaptations to various habitats, for <b>protection, climbing, storage</b>, etc.</li></ul>
<h4>Root system and shoot system (Fig. 5.1)</h4><ul>
<li>Pull out any weed – all have <b>roots, stems and leaves</b>; they may bear <b>flowers and fruits</b>.</li>
<li>The <b>underground</b> part of the flowering plant is the <span class="term">root system</span>.</li>
<li>The portion <b>above the ground</b> forms the <span class="term">shoot system</span>.</li>
<li>Fig. 5.1 labels: <b>flower, fruit, stem, leaf, node, internode, bud</b> (shoot system); <b>primary root, secondary root</b> (root system).</li></ul>`,
terms:[['Morphology','Study of external structure / form of the plant'],['Root system','Underground part of the flowering plant'],['Shoot system','Portion of the plant above the ground'],['Angiosperms','Flowering plants – have roots, stems, leaves, flowers and fruits']],qk:'shoot|root system|morpholog'});

n5('c5-roots',{notes:`
<h4><span class="num">5.1</span>The root – how root systems form</h4><ul>
<li>In <b>majority of dicotyledonous plants</b>, the <b>direct elongation of the radicle</b> forms the <span class="term">primary root</span>, which grows inside the soil.</li>
<li>It bears <b>lateral roots of several orders</b> – called <b>secondary, tertiary</b>, etc. roots.</li>
<li>The primary root and its branches constitute the <span class="term">tap root system</span>, e.g. <span class="eg">mustard</span> (Fig. 5.2a).</li>
<li>In <b>monocotyledonous</b> plants, the primary root is <b>short-lived</b> and is replaced by a <b>large number of roots</b> which originate from the <b>base of the stem</b> – the <span class="term">fibrous root system</span>, e.g. <span class="eg">wheat</span> (Fig. 5.2b).</li>
<li>In some plants, roots arise from <b>parts of the plant other than the radicle</b> – <span class="term">adventitious roots</span>, e.g. <span class="eg">grass, Monstera, banyan tree</span> (Fig. 5.2c).</li></ul>
<h4>Main functions of the root system</h4><ul>
<li><b>Absorption</b> of water and minerals from the soil.</li><li>Providing proper <b>anchorage</b> to the plant parts.</li><li><b>Storing reserve food</b> material.</li><li><b>Synthesis of plant growth regulators</b>.</li></ul>
<div class="note">📌 Summary point: Generally <b>dicots have tap roots</b> while <b>monocots have fibrous roots</b>. Roots in some plants get modified for <b>storage of food, mechanical support and respiration</b>.</div>`,
terms:[['Radicle','Embryonic root – elongates to form the primary root'],['Primary root','Formed by direct elongation of the radicle'],['Tap root system','Primary root + its branches (mustard)'],['Fibrous root system','Many roots from the base of the stem (wheat)'],['Adventitious roots','Arise from parts other than radicle (grass, Monstera, banyan)'],['Lateral roots','Secondary, tertiary… roots on the primary root']],qk:'tap root|fibrous|adventitious|root system'});

n5('c5-roottip',{notes:`
<h4><span class="num">5.1.1</span>Regions of the root (Fig. 5.3)</h4><ul>
<li><span class="term">Root cap</span> – the root is covered at the apex by a <b>thimble-like</b> structure. It <b>protects the tender apex</b> of the root as it makes its way through the soil.</li>
<li><span class="term">Region of meristematic activity</span> – a few millimetres <b>above the root cap</b>. Cells are <b>very small, thin-walled, with dense protoplasm</b>. They <b>divide repeatedly</b>.</li>
<li><span class="term">Region of elongation</span> – cells proximal to the meristematic region undergo <b>rapid elongation and enlargement</b>; they are responsible for the <b>growth of the root in length</b>.</li>
<li><span class="term">Region of maturation</span> – cells of the elongation zone gradually <b>differentiate and mature</b>; this zone is proximal to the region of elongation.</li>
<li><span class="term">Root hairs</span> – from the region of maturation some <b>epidermal cells</b> form very fine, delicate, <b>thread-like</b> structures. Root hairs <b>absorb water and minerals</b> from the soil.</li></ul>
<div class="note">🧭 Order from the tip upwards: <b>root cap → meristematic region → region of elongation → region of maturation (root hairs)</b>.</div>`,
terms:[['Root cap','Thimble-like cover protecting the root apex'],['Meristematic region','Small, thin-walled cells with dense protoplasm that divide repeatedly'],['Region of elongation','Cells elongate rapidly – root grows in length'],['Region of maturation','Cells differentiate and mature; root hairs form here'],['Root hairs','Fine thread-like epidermal outgrowths – absorb water & minerals']],qk:'root cap|meristematic|elongation|maturation|root hair'});

n5('c5-stem',{notes:`
<h4><span class="num">5.2</span>The stem</h4><ul>
<li><b>What distinguishes a stem from a root?</b> The stem is the <b>ascending part of the axis</b> bearing <b>branches, leaves, flowers and fruits</b>.</li>
<li>It develops from the <span class="term">plumule</span> of the embryo of a germinating seed.</li>
<li>The stem bears <span class="term">nodes</span> and <span class="term">internodes</span>: nodes are regions where <b>leaves are born</b>; internodes are the <b>portions between two nodes</b>.</li>
<li>The stem bears <span class="term">buds</span>, which may be <b>terminal or axillary</b>.</li>
<li>Stem is generally <b>green when young</b> and later often becomes <b>woody and dark brown</b>.</li></ul>
<h4>Functions of the stem</h4><ul>
<li>Main function: <b>spreading out branches</b> bearing leaves, flowers and fruits.</li>
<li><b>Conducts</b> water, minerals and photosynthates.</li>
<li>Some stems perform <b>storage of food, support, protection</b> and <b>vegetative propagation</b>.</li></ul>
<div class="note">📌 Summary point: <b>nodes and internodes, multicellular hair</b> and <b>positively phototropic</b> nature help to differentiate stems from roots.</div>`,
terms:[['Plumule','Part of embryo that develops into the stem'],['Node','Region of stem where leaves are born'],['Internode','Portion of stem between two nodes'],['Terminal bud','Bud at the tip of the stem'],['Axillary bud','Bud in the axil of a leaf – grows into a branch'],['Photosynthates','Food made by photosynthesis – conducted by the stem']],qk:'stem|node|plumule'});

n5('c5-leaf',{notes:`
<h4><span class="num">5.3</span>The leaf</h4><ul>
<li>A <b>lateral, generally flattened</b> structure borne on the stem.</li>
<li>It develops at the <b>node</b> and bears a <b>bud in its axil</b>; the axillary bud later develops into a <b>branch</b>.</li>
<li>Leaves originate from <b>shoot apical meristems</b> and are arranged in an <b>acropetal order</b>.</li>
<li>They are the most important vegetative organs for <b>photosynthesis</b>.</li></ul>
<h4>Parts of a typical leaf (Fig. 5.4a)</h4><ul>
<li><span class="term">Leaf base</span> – attaches the leaf to the stem; may bear two lateral small leaf-like <span class="term">stipules</span>. In <b>monocots</b> the leaf base expands into a <b>sheath</b> covering the stem partially or wholly. In some <b>leguminous</b> plants the leaf base becomes swollen – the <span class="term">pulvinus</span>.</li>
<li><span class="term">Petiole</span> – helps hold the blade to light. <b>Long thin flexible petioles</b> let leaf blades <b>flutter in wind</b>, thereby <b>cooling the leaf</b> and bringing <b>fresh air</b> to the leaf surface.</li>
<li><span class="term">Lamina (leaf blade)</span> – the <b>green expanded part</b> with <b>veins and veinlets</b>. Usually a middle prominent vein – the <span class="term">midrib</span>. Veins provide <b>rigidity</b> to the blade and act as <b>channels of transport</b> for water, minerals and food. The <b>shape, margin, apex, surface and extent of incision</b> of lamina vary in different leaves.</li></ul>
<h4><span class="num">5.3.1</span>Venation</h4><ul>
<li>Arrangement of veins and veinlets in the lamina = <span class="term">venation</span>.</li>
<li><b>Reticulate</b> – veinlets form a <b>network</b> (Fig. 5.4b); generally in <b>dicots</b>.</li>
<li><b>Parallel</b> – veins run <b>parallel</b> to each other within the lamina (Fig. 5.4c); characteristic of <b>most monocots</b>.</li></ul>
<h4><span class="num">5.3.2</span>Types of leaves</h4><ul>
<li><span class="term">Simple</span> – lamina is entire or, when incised, the <b>incisions do not touch the midrib</b>.</li>
<li><span class="term">Compound</span> – incisions reach up to the midrib, breaking it into a number of <b>leaflets</b>.</li>
<li>A <b>bud is present in the axil of the petiole</b> in both simple and compound leaves, but <b>not in the axil of leaflets</b> of a compound leaf.</li>
<li><b>Pinnately compound</b> – leaflets on a common axis, the <span class="term">rachis</span> (represents the midrib), e.g. <span class="eg">neem</span>.</li>
<li><b>Palmately compound</b> – leaflets attached at a <b>common point, the tip of the petiole</b>, e.g. <span class="eg">silk cotton</span>.</li></ul>
<h4><span class="num">5.3.3</span>Phyllotaxy</h4><ul>
<li>The pattern of arrangement of leaves on the stem or branch = <span class="term">phyllotaxy</span>. Three types (Fig. 5.6):</li>
<li><b>Alternate</b> – a single leaf at each node in alternate manner: <span class="eg">china rose, mustard, sunflower</span>.</li>
<li><b>Opposite</b> – a pair of leaves at each node, opposite each other: <span class="eg">Calotropis, guava</span>.</li>
<li><b>Whorled</b> – more than two leaves at a node forming a whorl: <span class="eg">Alstonia</span>.</li></ul>`,
terms:[['Stipules','Two small lateral leaf-like structures at the leaf base'],['Pulvinus','Swollen leaf base in some leguminous plants'],['Lamina','Green expanded leaf blade with veins'],['Midrib','Middle prominent vein of lamina'],['Venation','Arrangement of veins and veinlets in lamina'],['Rachis','Common axis of a pinnate leaf – represents the midrib'],['Phyllotaxy','Pattern of arrangement of leaves on stem'],['Acropetal','Younger towards the apex, older at the base']],qk:'leaf|venation|phyllotaxy|pinnate|palmate|pulvinus|leaflet'});

n5('c5-infl',{notes:`
<h4><span class="num">5.4</span>The inflorescence</h4><ul>
<li>A <span class="term">flower is a modified shoot</span> wherein the <b>shoot apical meristem changes to floral meristem</b>.</li>
<li><b>Internodes do not elongate</b> and the axis gets <b>condensed</b>.</li>
<li>The apex produces different kinds of <b>floral appendages laterally at successive nodes</b> instead of leaves.</li>
<li>When a shoot tip transforms into a flower, it is always <b>solitary</b>.</li>
<li>The arrangement of flowers on the floral axis = <span class="term">inflorescence</span>.</li>
<li>Two major types, depending on whether the <b>apex develops into a flower or continues to grow</b>:</li></ul>
<table class="cmp"><tr><th>Racemose (Fig. 5.7)</th><th>Cymose (Fig. 5.8)</th></tr><tr><td>Main axis <b>continues to grow</b></td><td>Main axis <b>terminates in a flower</b> – limited growth</td></tr><tr><td>Flowers borne laterally in <b>acropetal succession</b></td><td>Flowers borne in <b>basipetal order</b></td></tr></table>`,
terms:[['Floral meristem','Shoot apical meristem changed to form a flower'],['Inflorescence','Arrangement of flowers on the floral axis'],['Racemose','Axis keeps growing; flowers acropetal'],['Cymose','Axis ends in a flower; flowers basipetal'],['Acropetal succession','Older flowers below, younger towards the apex'],['Basipetal order','Older flower at the top, younger ones below']],qk:'racemose|cymose|inflorescence'});

n5('c5-flower',{notes:`
<h4><span class="num">5.5</span>The flower</h4><ul>
<li>The flower is the <b>reproductive unit</b> in angiosperms, meant for <b>sexual reproduction</b>.</li>
<li>A typical flower has <b>four kinds of whorls</b> arranged successively on the swollen end of the stalk or <span class="term">pedicel</span>, called <span class="term">thalamus or receptacle</span>: <b>calyx, corolla, androecium, gynoecium</b>.</li>
<li><b>Calyx and corolla</b> are <b>accessory organs</b>; <b>androecium and gynoecium</b> are <b>reproductive organs</b>.</li>
<li>In some flowers like <span class="eg">lily</span>, calyx and corolla are not distinct – termed <span class="term">perianth</span>.</li>
<li>Flower with both androecium and gynoecium = <b>bisexual</b>; with only stamens or only carpels = <b>unisexual</b>.</li></ul>
<h4>Symmetry</h4><ul>
<li><span class="term">Actinomorphic</span> (radial symmetry) – can be divided into two equal radial halves in <b>any radial plane</b> through the centre: <span class="eg">mustard, datura, chilli</span>.</li>
<li><span class="term">Zygomorphic</span> (bilateral symmetry) – divided into two similar halves <b>only in one particular vertical plane</b>: <span class="eg">pea, gulmohur, bean, Cassia</span>.</li>
<li><span class="term">Asymmetric (irregular)</span> – cannot be divided into two similar halves by any vertical plane through the centre: <span class="eg">canna</span>.</li></ul>
<h4>Number of parts & bracts</h4><ul>
<li><b>Trimerous, tetramerous, pentamerous</b> – floral appendages in multiples of <b>3, 4 or 5</b>.</li>
<li><span class="term">Bract</span> – reduced leaf at the base of the pedicel. Flowers with bracts = <b>bracteate</b>; without = <b>ebracteate</b>.</li></ul>
<h4>Position of floral parts on thalamus (Fig. 5.9)</h4><ul>
<li>Based on the position of <b>calyx, corolla and androecium</b> with respect to the <b>ovary</b> on the thalamus:</li>
<li><span class="term">Hypogynous</span> – gynoecium occupies the <b>highest position</b>; other parts below it. Ovary <b>superior</b>: <span class="eg">mustard, china rose, brinjal</span>.</li>
<li><span class="term">Perigynous</span> – gynoecium in the centre; other parts on the <b>rim of the thalamus almost at the same level</b>. Ovary <b>half inferior</b>: <span class="eg">plum, rose, peach</span>.</li>
<li><span class="term">Epigynous</span> – margin of thalamus <b>grows upward enclosing the ovary completely and fusing with it</b>; other parts arise <b>above the ovary</b>. Ovary <b>inferior</b>: <span class="eg">guava, cucumber, ray florets of sunflower</span>.</li></ul>`,
terms:[['Thalamus / receptacle','Swollen end of the pedicel bearing the whorls'],['Perianth','Calyx and corolla not distinct (lily)'],['Bisexual','Has both androecium and gynoecium'],['Unisexual','Only stamens or only carpels'],['Actinomorphic','Radial symmetry (mustard, datura, chilli)'],['Zygomorphic','Bilateral symmetry (pea, gulmohur, bean, Cassia)'],['Bracteate','Flower with a bract at the base of pedicel'],['Hypogynous','Ovary superior – highest position'],['Perigynous','Ovary half inferior – parts on rim of thalamus'],['Epigynous','Ovary inferior – thalamus fused around it']],qk:'actinomorphic|zygomorphic|asymmetric|inferior|superior|perigynous|hypogynous|epigynous|thalamus'});

n5('c5-calcor',{notes:`
<h4><span class="num">5.5.1</span>Parts of a flower (Fig. 5.10)</h4><p>Each flower normally has four floral whorls – <b>calyx, corolla, androecium and gynoecium</b>.</p>
<h4><span class="num">5.5.1.1</span>Calyx</h4><ul>
<li>The <b>outermost whorl</b>; its members are <span class="term">sepals</span>.</li>
<li>Sepals are generally <b>green, leaf-like</b> and <b>protect the flower in the bud stage</b>.</li>
<li><b>Gamosepalous</b> (sepals united) or <b>polysepalous</b> (sepals free).</li></ul>
<h4><span class="num">5.5.1.2</span>Corolla</h4><ul>
<li>Composed of <span class="term">petals</span>, usually <b>brightly coloured to attract insects for pollination</b>.</li>
<li><b>Gamopetalous</b> (petals united) or <b>polypetalous</b> (petals free).</li>
<li>Shape and colour vary greatly: corolla may be <b>tubular, bell-shaped, funnel-shaped or wheel-shaped</b>.</li></ul>
<h4>Aestivation (Fig. 5.11)</h4><ul>
<li>The mode of arrangement of <b>sepals or petals in the floral bud</b> with respect to the other members of the <b>same whorl</b>.</li>
<li><b>Valvate</b> – sepals or petals <b>just touch</b> one another at the margin, <b>without overlapping</b>: <span class="eg">Calotropis</span>.</li>
<li><b>Twisted</b> – <b>one margin overlaps that of the next one</b> and so on: <span class="eg">china rose, lady's finger, cotton</span>.</li>
<li><b>Imbricate</b> – margins overlap one another but <b>not in any particular direction</b>: <span class="eg">Cassia, gulmohur</span>.</li>
<li><b>Vexillary / papilionaceous</b> – in <span class="eg">pea and bean</span>, five petals: the largest <b>standard</b> overlaps the two lateral <b>wings</b>, which in turn overlap the two smallest anterior petals, the <b>keel</b>.</li></ul>`,
terms:[['Sepals','Members of calyx – green, protect bud'],['Gamosepalous','Sepals united'],['Polysepalous','Sepals free'],['Gamopetalous','Petals united'],['Polypetalous','Petals free'],['Aestivation','Arrangement of sepals/petals in bud'],['Valvate','Margins just touch (Calotropis)'],['Twisted','One margin overlaps the next (china rose)'],['Imbricate','Overlap in no particular direction (Cassia)'],['Vexillary','Standard > wings > keel (pea, bean)']],qk:'aestivation|valvate|twisted|imbricate|vexillary|sepal|petal'});

n5('c5-andgyn',{notes:`
<h4><span class="num">5.5.1.3</span>Androecium</h4><ul>
<li>Composed of <span class="term">stamens</span>. Each stamen = <b>male reproductive organ</b>, consisting of a stalk or <b>filament</b> and an <b>anther</b>.</li>
<li>Each anther is usually <b>bilobed</b> and each lobe has <b>two chambers, the pollen-sacs</b>. <b>Pollen grains</b> are produced in pollen-sacs.</li>
<li>A <b>sterile stamen</b> = <span class="term">staminode</span>.</li>
<li>Stamens may be united with other members: <b>epipetalous</b> – attached to petals (<span class="eg">brinjal</span>); <b>epiphyllous</b> – attached to perianth (<span class="eg">lily</span>).</li>
<li>Stamens may be <b>free (polyandrous)</b> or united in varying degrees: <b>monoadelphous</b> – one bundle (<span class="eg">china rose</span>); <b>diadelphous</b> – two bundles (<span class="eg">pea</span>); <b>polyadelphous</b> – more than two bundles (<span class="eg">citrus</span>).</li>
<li>Filament length may vary within a flower: <span class="eg">Salvia, mustard</span>.</li></ul>
<h4><span class="num">5.5.1.4</span>Gynoecium</h4><ul>
<li>The <b>female reproductive part</b>, made up of one or more <span class="term">carpels</span>.</li>
<li>A carpel has three parts: <b>stigma, style and ovary</b>. Ovary = enlarged basal part; style = elongated tube connecting ovary to stigma; stigma = usually at the tip of the style, the <b>receptive surface for pollen grains</b>.</li>
<li>Each ovary bears one or more <b>ovules</b> attached to a flattened, cushion-like <span class="term">placenta</span>.</li>
<li>More than one carpel: <b>apocarpous</b> when free (<span class="eg">lotus, rose</span>); <b>syncarpous</b> when fused (<span class="eg">mustard, tomato</span>).</li>
<li>After fertilisation, <b>ovules → seeds</b> and <b>ovary → fruit</b>.</li></ul>
<h4>Placentation (Fig. 5.12)</h4><ul>
<li>The arrangement of <b>ovules within the ovary</b>.</li>
<li><b>Marginal</b> – placenta forms a ridge along the <b>ventral suture</b>; ovules in <b>two rows</b>: <span class="eg">pea</span>.</li>
<li><b>Axile</b> – placenta <b>axial</b>, ovules attached to it in a <b>multilocular</b> ovary: <span class="eg">china rose, tomato, lemon</span>.</li>
<li><b>Parietal</b> – ovules on the <b>inner wall / peripheral part</b>; ovary one-chambered but becomes <b>two-chambered due to a false septum</b>: <span class="eg">mustard, Argemone</span>.</li>
<li><b>Free central</b> – ovules on a <b>central axis</b>, <b>septa absent</b>: <span class="eg">Dianthus, Primrose</span>.</li>
<li><b>Basal</b> – placenta at the <b>base of the ovary</b> with a <b>single ovule</b>: <span class="eg">sunflower, marigold</span>.</li></ul>`,
terms:[['Stamen','Male reproductive organ – filament + anther'],['Pollen-sacs','Two chambers in each anther lobe'],['Staminode','Sterile stamen'],['Epipetalous','Stamens attached to petals (brinjal)'],['Epiphyllous','Stamens attached to perianth (lily)'],['Monoadelphous','Stamens in one bundle (china rose)'],['Diadelphous','Two bundles (pea)'],['Polyadelphous','More than two bundles (citrus)'],['Carpel','Stigma + style + ovary'],['Apocarpous','Carpels free (lotus, rose)'],['Syncarpous','Carpels fused (mustard, tomato)'],['Placentation','Arrangement of ovules within ovary']],qk:'stamen|staminode|delphous|epipetalous|placentation|apocarp|syncarp|carpel'});

n5('c5-fruit',{notes:`
<h4><span class="num">5.6</span>The fruit</h4><ul>
<li>A <b>characteristic feature</b> of flowering plants.</li>
<li>It is a <b>mature or ripened ovary</b>, developed after fertilisation.</li>
<li>Fruit formed <b>without fertilisation</b> of the ovary = <span class="term">parthenocarpic fruit</span>.</li>
<li>Generally the fruit consists of a wall or <span class="term">pericarp</span> and <b>seeds</b>. The pericarp may be <b>dry or fleshy</b>.</li>
<li>When pericarp is <b>thick and fleshy</b>, it is differentiated into the outer <b>epicarp</b>, the middle <b>mesocarp</b> and the inner <b>endocarp</b>.</li></ul>
<h4>Drupe (Fig. 5.13)</h4><ul>
<li>In <span class="eg">mango and coconut</span> the fruit is a <span class="term">drupe</span>.</li>
<li>Drupes develop from <b>monocarpellary superior ovaries</b> and are <b>one-seeded</b>.</li>
<li><b>Mango</b>: outer <b>thin epicarp</b>, middle <b>fleshy edible mesocarp</b>, inner <b>stony hard endocarp</b>.</li>
<li><b>Coconut</b> (also a drupe): the <b>mesocarp is fibrous</b>.</li></ul>`,
terms:[['Fruit','Mature or ripened ovary after fertilisation'],['Parthenocarpic fruit','Fruit formed without fertilisation'],['Pericarp','Fruit wall – epicarp, mesocarp, endocarp'],['Drupe','One-seeded fruit from monocarpellary superior ovary (mango, coconut)'],['Mesocarp','Fleshy & edible in mango; fibrous in coconut'],['Endocarp','Stony hard inner layer in mango']],qk:'fruit|mesocarp|parthenocarp|coconut|mango|drupe'});

n5('c5-seed',{notes:`
<h4><span class="num">5.7</span>The seed</h4><ul>
<li>The <b>ovules after fertilisation develop into seeds</b>.</li>
<li>A seed = <b>seed coat</b> + <b>embryo</b>. The embryo has a <b>radicle</b>, an <b>embryonal axis</b> and <b>one</b> (<span class="eg">wheat, maize</span>) or <b>two cotyledons</b> (<span class="eg">gram, pea</span>).</li></ul>
<h4><span class="num">5.7.1</span>Structure of a dicotyledonous seed (Fig. 5.14)</h4><ul>
<li>Outermost covering = <span class="term">seed coat</span>, with two layers: outer <b>testa</b> and inner <b>tegmen</b>.</li>
<li><span class="term">Hilum</span> – a <b>scar</b> on the seed coat through which the developing seed was attached to the fruit.</li>
<li><span class="term">Micropyle</span> – a small <b>pore above the hilum</b>.</li>
<li>Within the seed coat is the <b>embryo</b> – an <b>embryonal axis</b> and <b>two cotyledons</b>. Cotyledons are often <b>fleshy and full of reserve food</b>.</li>
<li>At the two ends of the embryonal axis are the <b>radicle</b> and the <b>plumule</b>.</li>
<li><b>Endospermic</b> seeds – endosperm (formed by <b>double fertilisation</b>) is a food-storing tissue: <span class="eg">castor</span>.</li>
<li><b>Non-endospermous</b> – endosperm not present in mature seeds: <span class="eg">bean, gram, pea</span>.</li></ul>
<h4><span class="num">5.7.2</span>Structure of a monocotyledonous seed (Fig. 5.15)</h4><ul>
<li>Generally <b>endospermic</b>; some, as in <span class="eg">orchids</span>, are non-endospermic.</li>
<li>In cereals such as <span class="eg">maize</span>, the seed coat is <b>membranous</b> and generally <b>fused with the fruit wall</b>.</li>
<li>The <b>endosperm is bulky</b> and <b>stores food</b>.</li>
<li>The outer covering of endosperm separates the embryo by a <b>proteinous layer</b> – the <span class="term">aleurone layer</span>.</li>
<li>The <b>embryo is small</b>, situated in a <b>groove at one end</b> of the endosperm.</li>
<li>It has <b>one large, shield-shaped cotyledon</b> – the <span class="term">scutellum</span> – and a short axis with a <b>plumule and a radicle</b>.</li>
<li>Plumule and radicle are enclosed in sheaths: <span class="term">coleoptile</span> (around plumule) and <span class="term">coleorhiza</span> (around radicle).</li></ul>`,
terms:[['Testa','Outer layer of seed coat'],['Tegmen','Inner layer of seed coat'],['Hilum','Scar where seed was attached to fruit'],['Micropyle','Small pore above the hilum'],['Endospermic seed','Stores food in endosperm (castor, maize)'],['Non-endospermous','No endosperm in mature seed (bean, gram, pea)'],['Aleurone layer','Proteinous layer around endosperm'],['Scutellum','Shield-shaped single cotyledon of maize'],['Coleoptile','Sheath around plumule'],['Coleorhiza','Sheath around radicle']],qk:'seed|hilum|aleurone|scutellum|coleo|endosperm'});

n5('c5-semi',{notes:`
<h4><span class="num">5.8</span>Semi-technical description of a typical flowering plant</h4><ul>
<li>Various morphological features are used to describe a flowering plant. The description must be <b>brief</b>, in <b>simple and scientific language</b> and in a <b>proper sequence</b>.</li>
<li>Sequence: <b>habit → vegetative characters</b> (roots, stem, leaves) <b>→ floral characters</b> (inflorescence and flower parts) → <b>floral diagram</b> and <b>floral formula</b>.</li></ul>
<h4>Floral formula symbols</h4><ul>
<li><b>Br</b> – bracteate · <b>K</b> – calyx · <b>C</b> – corolla · <b>P</b> – perianth · <b>A</b> – androecium · <b>G</b> – gynoecium.</li>
<li><b><span class="ulfix">G</span></b> – superior ovary · <b><span style="text-decoration:overline">G</span></b> – inferior ovary.</li>
<li><b>♂</b> male · <b>♀</b> female · <b>⚥</b> bisexual · <b>⊕</b> actinomorphic · <b>%</b> zygomorphic.</li>
<li><b>Fusion</b> – the figure is enclosed within <b>brackets</b>. <b>Adhesion</b> – a <b>line drawn above</b> the symbols of the floral parts.</li></ul>
<h4>Floral diagram (Fig. 5.16)</h4><ul>
<li>Gives information about the <b>number of parts</b> of a flower, their <b>arrangement</b> and their <b>relation</b> with one another.</li>
<li>The position of the <b>mother axis</b> is shown by a <b>dot on the top</b> of the floral diagram.</li>
<li>Calyx, corolla, androecium and gynoecium are drawn in <b>successive whorls</b> – calyx outermost, gynoecium in the centre.</li>
<li>The floral formula also shows <b>cohesion and adhesion</b> within parts of whorls and between whorls.</li>
<li>Fig. 5.16 represents the <span class="eg">mustard plant (family Brassicaceae)</span>.</li></ul>`,
terms:[['Floral formula','Symbolic summary of a flower'],['Floral diagram','Shows number, arrangement and relation of floral parts'],['Mother axis','Shown by a dot on top of floral diagram'],['Fusion','Shown by brackets ( )'],['Adhesion','Shown by a line above symbols'],['⊕','Actinomorphic'],['%','Zygomorphic'],['G underlined','Superior ovary']],qk:'floral formula|fusion'});

n5('c5-sol',{notes:`
<h4><span class="num">5.9</span>Solanaceae (Fig. 5.17)</h4><ul>
<li>A large family, commonly called the <b>‘potato family’</b>. Widely distributed in <b>tropics, subtropics and even temperate zones</b>.</li>
<li>Illustrated by <span class="eg">Solanum nigrum (makoi)</span>: flowering twig, flower, L.S. of flower, stamens, carpel and floral diagram.</li></ul>
<h4>Vegetative characters</h4><ul>
<li>Plants mostly <b>herbs, shrubs</b> and rarely small trees.</li>
<li><b>Stem</b>: herbaceous, rarely woody, aerial; erect, cylindrical, branched, solid or hollow, hairy or glabrous; <b>underground stem in potato</b> (<i>Solanum tuberosum</i>).</li>
<li><b>Leaves</b>: alternate, simple, rarely pinnately compound, <b>exstipulate</b>; venation <b>reticulate</b>.</li></ul>
<h4>Floral characters</h4><ul>
<li><b>Inflorescence</b>: solitary, axillary or cymose as in <i>Solanum</i>.</li>
<li><b>Flower</b>: bisexual, actinomorphic.</li>
<li><b>Calyx</b>: sepals five, united, <b>persistent</b>, valvate aestivation.</li>
<li><b>Corolla</b>: petals five, united; valvate aestivation.</li>
<li><b>Androecium</b>: stamens five, <b>epipetalous</b>.</li>
<li><b>Gynoecium</b>: <b>bicarpellary</b>, obliquely placed, <b>syncarpous</b>; ovary <b>superior, bilocular</b>, placenta swollen with many ovules, <b>axile</b>.</li>
<li><b>Fruits</b>: berry or capsule. <b>Seeds</b>: many, endospermous.</li>
<li><b>Floral formula</b>: ⊕ ⚥ K<sub>(5)</sub> C<sub>(5)</sub> A<sub>5</sub> <span class="ulfix">G</span><sub>(2)</sub> – with a line joining C and A (epipetalous).</li></ul>
<h4>Economic importance</h4><ul>
<li>Food – <span class="eg">tomato, brinjal, potato</span>; spice – <span class="eg">chilli</span>; medicine – <span class="eg">belladonna, ashwagandha</span>; fumigatory – <span class="eg">tobacco</span>; ornamentals – <span class="eg">petunia</span>.</li></ul>`,
terms:[['Potato family','Solanaceae'],['Exstipulate','Leaves without stipules'],['Persistent calyx','Calyx remains attached (Solanaceae)'],['Bicarpellary','Gynoecium of two carpels'],['Bilocular','Ovary with two chambers'],['Berry / capsule','Fruits of Solanaceae']],qk:'solanaceae|potato|ashwagandha|belladonna'});

n5('c5-summary',{notes:`
<ul><li>Flowering plants show enormous variation in <b>shape, size, structure, mode of nutrition, life span, habit and habitat</b>; they have well-developed <b>root and shoot systems</b>.</li>
<li>Root system is either <b>tap root or fibrous</b>. Generally dicots have tap roots, monocots fibrous roots. Roots in some plants get modified for <b>storage of food, mechanical support and respiration</b>.</li>
<li>The shoot system is differentiated into <b>stem, leaves, flowers and fruits</b>. Nodes and internodes, multicellular hair and positively phototropic nature differentiate stems from roots.</li>
<li>Leaf is a lateral outgrowth of the stem developed <b>exogenously at the node</b>; green for photosynthesis. Leaves vary in shape, size, margin, apex and extent of incision of the lamina.</li>
<li>The flower is a <b>modified shoot</b> meant for sexual reproduction, arranged in different inflorescences. Flowers vary in structure, symmetry, position of ovary, arrangement of petals, sepals, ovules etc.</li>
<li>After fertilisation, <b>ovary → fruit</b> and <b>ovules → seeds</b>. Seeds may be monocotyledonous or dicotyledonous; they vary in shape, size and period of viability.</li>
<li>Floral characteristics form the <b>basis of classification and identification</b>, illustrated by semi-technical descriptions of families. Floral features are summarised as <b>floral diagrams and floral formulae</b>.</li></ul>`,qk:'.'});

/* ===== Detailed NCERT notes – Chapter 6 ===== */
const n6=n5;
n6('c6-tissue',{notes:`
<h4>Introduction</h4><ul>
<li>Study of the <b>internal structure</b> of plants is called <span class="term">anatomy</span>.</li>
<li>Plants have <b>cells</b> as the basic unit; cells are organised into <b>tissues</b>, and tissues into <b>organs</b>.</li>
<li>Different organs show differences in internal structure. Within angiosperms, <b>monocots and dicots</b> are anatomically different. Internal structures also show <b>adaptations to diverse environments</b>.</li></ul>
<h4><span class="num">6.1</span>The tissue system</h4><ul>
<li>Tissues vary depending on their <b>location</b> in the plant body; their structure and function depend on location too.</li>
<li>On the basis of <b>structure and location</b>, there are <b>three tissue systems</b>:</li>
<li>1️⃣ <span class="term">Epidermal tissue system</span> 2️⃣ <span class="term">Ground or fundamental tissue system</span> 3️⃣ <span class="term">Vascular or conducting tissue system</span>.</li></ul>
<div class="note">📌 Summary: plant tissues are broadly <b>meristematic</b> (apical, lateral, intercalary) and <b>permanent</b> (simple, complex). Main functions: assimilation and storage of food, transport of water, minerals and photosynthates, and mechanical support.</div>`,
terms:[['Anatomy','Study of internal structure of plants'],['Tissue system','Group of tissues by structure & location'],['Epidermal system','Outermost covering of plant body'],['Ground system','All tissues except epidermis & vascular bundles'],['Vascular system','Xylem and phloem – conducting tissues']],qk:'tissue system'});
n6('c6-epi',{notes:`
<h4><span class="num">6.1.1</span>Epidermal tissue system</h4><ul>
<li>Forms the <b>outer-most covering</b> of the whole plant body; comprises <b>epidermal cells, stomata</b> and <b>epidermal appendages</b> – the trichomes and hairs.</li>
<li><span class="term">Epidermis</span> – the outermost layer of the primary plant body. Made of <b>elongated, compactly arranged cells</b> forming a <b>continuous layer</b>; usually <b>single-layered</b>.</li>
<li>Epidermal cells are <b>parenchymatous</b>, with a small amount of cytoplasm lining the cell wall and a <b>large vacuole</b>.</li>
<li>The outside of the epidermis is often covered with a <b>waxy thick layer</b> – the <span class="term">cuticle</span> – which <b>prevents loss of water</b>. <b>Cuticle is absent in roots.</b></li></ul>
<h4>Stomata (Fig. 6.1)</h4><ul>
<li>Structures present in the <b>epidermis of leaves</b>; they <b>regulate transpiration and gaseous exchange</b>.</li>
<li>Each stoma has two <b>bean-shaped</b> <span class="term">guard cells</span> enclosing the <b>stomatal pore</b>. In <b>grasses</b> the guard cells are <b>dumb-bell shaped</b>.</li>
<li><b>Outer walls</b> of guard cells (away from the pore) are <b>thin</b>; <b>inner walls</b> (towards the pore) are <b>highly thickened</b>.</li>
<li>Guard cells possess <b>chloroplasts</b> and regulate opening and closing of stomata.</li>
<li>A few epidermal cells near the guard cells become specialised in shape and size – <span class="term">subsidiary cells</span>.</li>
<li>Stomatal aperture + guard cells + surrounding subsidiary cells = <span class="term">stomatal apparatus</span>.</li></ul>
<h4>Epidermal appendages</h4><ul>
<li><span class="term">Root hairs</span> – <b>unicellular</b> elongations of epidermal cells; help absorb water and minerals from the soil.</li>
<li>On the stem, epidermal hairs are called <span class="term">trichomes</span>. In the shoot system they are usually <b>multicellular</b>; may be <b>branched or unbranched, soft or stiff</b>, and even <b>secretory</b>.</li>
<li>Trichomes help in <b>preventing water loss due to transpiration</b>.</li></ul>`,
terms:[['Cuticle','Waxy layer preventing water loss; absent in roots'],['Guard cells','Bean-shaped (dumb-bell in grasses) cells around the pore'],['Subsidiary cells','Specialised epidermal cells near guard cells'],['Stomatal apparatus','Aperture + guard cells + subsidiary cells'],['Root hairs','Unicellular epidermal elongations'],['Trichomes','Epidermal hairs on stem, usually multicellular']],qk:'cuticle|guard|stoma|trichome|root hair'});
n6('c6-ground',{notes:`
<h4><span class="num">6.1.2</span>The ground tissue system</h4><ul>
<li><b>All tissues except epidermis and vascular bundles</b> constitute the ground tissue.</li>
<li>It consists of <b>simple tissues</b> such as <b>parenchyma, collenchyma and sclerenchyma</b>.</li>
<li><b>Parenchymatous cells</b> are usually present in the <b>cortex, pericycle, pith and medullary rays</b> in primary stems and roots.</li>
<li>In <b>leaves</b>, the ground tissue consists of <b>thin-walled, chloroplast-containing</b> cells and is called <span class="term">mesophyll</span>.</li></ul>
<div class="note">📌 Summary: the ground tissue system forms the <b>main bulk</b> of the plant and is divided into three zones – <b>cortex, pericycle and pith</b>.</div>`,
terms:[['Ground tissue','All except epidermis & vascular bundles'],['Simple tissues','Parenchyma, collenchyma, sclerenchyma'],['Mesophyll','Ground tissue of leaf with chloroplasts'],['Medullary rays','Parenchyma between vascular bundles']],qk:'ground tissue|mesophyll|medullary'});
n6('c6-vasc',{notes:`
<h4><span class="num">6.1.3</span>The vascular tissue system (Fig. 6.2)</h4><ul>
<li>Consists of <b>complex tissues</b> – the <b>phloem</b> and the <b>xylem</b>. Together they constitute <span class="term">vascular bundles</span>.</li>
<li>In <b>dicot stems</b>, <b>cambium</b> is present between phloem and xylem. Such bundles can form <b>secondary xylem and phloem</b> and are called <span class="term">open</span>.</li>
<li>In <b>monocots</b>, vascular bundles have <b>no cambium</b>; they do not form secondary tissues and are called <span class="term">closed</span>.</li>
<li><span class="term">Radial</span> – xylem and phloem arranged in an <b>alternate manner along different radii</b>, as in <b>roots</b>.</li>
<li><span class="term">Conjoint</span> – xylem and phloem <b>jointly situated along the same radius</b>; common in <b>stems and leaves</b>.</li>
<li>Conjoint bundles usually have the <b>phloem located only on the outer side of xylem</b>.</li></ul>
<div class="note">📌 Summary: on the basis of <b>presence of cambium</b> and <b>location of xylem and phloem</b>, vascular bundles are of different types. They translocate water, minerals and food.</div>`,
terms:[['Vascular bundle','Xylem + phloem together'],['Open bundle','Has cambium – forms secondary tissues'],['Closed bundle','No cambium (monocots)'],['Radial','Xylem & phloem on alternate radii (roots)'],['Conjoint','Xylem & phloem on same radius (stems, leaves)'],['Endarch','Protoxylem towards the centre (dicot stem)']],qk:'open|closed|radial|conjoint|cambium'});
n6('c6-droot',{notes:`
<h4><span class="num">6.2</span>Anatomy of dicot and monocot plants</h4><p>For a better understanding of tissue organisation of roots, stems and leaves, it is convenient to study <b>transverse sections of the mature zones</b> of these organs.</p>
<h4><span class="num">6.2.1</span>Dicotyledonous root – T.S. of sunflower root (Fig. 6.3a)</h4><ul>
<li><span class="term">Epiblema</span> – the outermost layer. Many of its cells protrude as <b>unicellular root hairs</b>.</li>
<li><span class="term">Cortex</span> – several layers of <b>thin-walled parenchyma</b> cells with <b>intercellular spaces</b>.</li>
<li><span class="term">Endodermis</span> – innermost layer of the cortex; a <b>single layer of barrel-shaped cells</b> without intercellular spaces. Tangential and radial walls have a deposition of <b>water-impermeable, waxy suberin</b> as <span class="term">Casparian strips</span>.</li>
<li><span class="term">Pericycle</span> – next to endodermis, a few layers of <b>thick-walled parenchymatous</b> cells. <b>Initiation of lateral roots and vascular cambium</b> (during secondary growth) takes place here.</li>
<li><span class="term">Pith</span> – <b>small or inconspicuous</b>.</li>
<li><span class="term">Conjunctive tissue</span> – parenchymatous cells lying between the xylem and the phloem.</li>
<li>Usually <b>two to four xylem and phloem patches</b>. Later, a <b>cambium ring</b> develops between the xylem and phloem.</li>
<li>All tissues on the inner side of the endodermis – <b>pericycle, vascular bundles and pith</b> – constitute the <span class="term">stele</span>.</li></ul>`,
terms:[['Epiblema','Outermost layer of root bearing root hairs'],['Endodermis','Barrel-shaped cells, no intercellular spaces'],['Casparian strips','Suberin on tangential & radial walls of endodermis'],['Pericycle','Origin of lateral roots and vascular cambium'],['Conjunctive tissue','Parenchyma between xylem and phloem'],['Stele','Pericycle + vascular bundles + pith']],qk:'epiblema|casparian|pericycle|conjunctive|stele|two to four|dicot root'});
n6('c6-mroot',{notes:`
<h4><span class="num">6.2.2</span>Monocotyledonous root (Fig. 6.3b)</h4><ul>
<li>Similar to the dicot root in many respects: it has <b>epidermis, cortex, endodermis, pericycle, vascular bundles and pith</b>.</li>
<li>Compared to the dicot root (fewer xylem bundles), there are usually <b>more than six (polyarch)</b> xylem bundles.</li>
<li><b>Pith is large and well developed</b>.</li>
<li>Monocot roots <b>do not undergo any secondary growth</b>.</li></ul>`,
terms:[['Polyarch','More than six xylem bundles (monocot root)'],['Large pith','Feature of monocot root'],['No secondary growth','Monocot roots']],qk:'polyarch|monocot root|pith|secondary growth'});
n6('c6-dstem',{notes:`
<h4><span class="num">6.2.3</span>Dicotyledonous stem – T.S. of young stem (Fig. 6.4a)</h4><ul>
<li><span class="term">Epidermis</span> – outermost protective layer; covered with a thin <b>cuticle</b>; may bear <b>trichomes</b> and a few <b>stomata</b>.</li>
<li><span class="term">Cortex</span> – cells in multiple layers between epidermis and pericycle; three sub-zones:</li>
<li style="list-style:circle;margin-left:18px"><b>Hypodermis</b> – a few layers of <b>collenchymatous</b> cells just below the epidermis; give <b>mechanical strength</b> to the young stem.</li>
<li style="list-style:circle;margin-left:18px"><b>Cortical layers</b> – rounded <b>thin-walled parenchymatous</b> cells with conspicuous intercellular spaces.</li>
<li style="list-style:circle;margin-left:18px"><b>Endodermis</b> – innermost layer; cells <b>rich in starch grains</b> → called the <span class="term">starch sheath</span>.</li>
<li><span class="term">Pericycle</span> – inner side of the endodermis, above the phloem, as <b>semi-lunar patches of sclerenchyma</b>.</li>
<li><span class="term">Medullary rays</span> – a few layers of <b>radially placed parenchymatous</b> cells between the vascular bundles.</li>
<li>A large number of <span class="term">vascular bundles</span> arranged in a <b>ring</b> – the ‘ring’ arrangement is characteristic of the dicot stem. Each bundle is <b>conjoint, open, with endarch protoxylem</b>.</li>
<li><span class="term">Pith</span> – a large number of rounded parenchymatous cells with large intercellular spaces in the <b>central portion</b>.</li></ul>`,
terms:[['Hypodermis (dicot)','Collenchyma – mechanical strength'],['Starch sheath','Endodermis of stem rich in starch'],['Semi-lunar patches','Sclerenchymatous pericycle above phloem'],['Ring arrangement','Vascular bundles in a ring – dicot stem'],['Endarch','Protoxylem towards the pith']],qk:'dicot stem|starch|semi-lunar|collenchyma|medullary|ring'});
n6('c6-mstem',{notes:`
<h4><span class="num">6.2.4</span>Monocotyledonous stem (Fig. 6.4b)</h4><ul>
<li>Has a <b>sclerenchymatous hypodermis</b>.</li>
<li>A <b>large number of scattered vascular bundles</b>, each surrounded by a <b>sclerenchymatous bundle sheath</b>.</li>
<li>A large, conspicuous <b>parenchymatous ground tissue</b>.</li>
<li>Vascular bundles are <b>conjoint and closed</b>.</li>
<li><b>Peripheral</b> vascular bundles are generally <b>smaller</b> than the centrally located ones.</li>
<li><b>Phloem parenchyma is absent</b>, and <b>water-containing cavities</b> are present within the vascular bundles.</li></ul>`,
terms:[['Hypodermis (monocot)','Sclerenchymatous'],['Scattered bundles','Feature of monocot stem'],['Bundle sheath','Sclerenchymatous layer around each bundle'],['Water-containing cavity','Present in monocot stem bundles'],['Phloem parenchyma','Absent in monocot stem']],qk:'monocot stem|scattered|phloem parenchyma|peripheral'});
n6('c6-dleaf',{notes:`
<h4><span class="num">6.2.5</span>Dorsiventral (dicotyledonous) leaf (Fig. 6.5a)</h4><ul>
<li>A vertical section through the lamina shows three main parts: <b>epidermis, mesophyll and vascular system</b>.</li>
<li><b>Epidermis</b> covers both the upper surface (<span class="term">adaxial epidermis</span>) and lower surface (<span class="term">abaxial epidermis</span>), with a <b>conspicuous cuticle</b>.</li>
<li>The <b>abaxial epidermis generally bears more stomata</b> than the adaxial; the latter may even <b>lack stomata</b>.</li>
<li><span class="term">Mesophyll</span> – tissue between upper and lower epidermis; possesses <b>chloroplasts</b> and carries out <b>photosynthesis</b>; made of parenchyma. Two types of cells:</li>
<li style="list-style:circle;margin-left:18px"><b>Palisade parenchyma</b> – adaxially placed, <b>elongated cells arranged vertically and parallel</b> to each other.</li>
<li style="list-style:circle;margin-left:18px"><b>Spongy parenchyma</b> – <b>oval or round, loosely arranged</b> cells below the palisade, extending to the lower epidermis, with <b>numerous large spaces and air cavities</b>.</li>
<li><b>Vascular system</b> – vascular bundles seen in the <b>veins and the midrib</b>. Size of bundles depends on the size of the veins; veins vary in thickness in the <b>reticulate venation</b> of dicot leaves.</li>
<li>Vascular bundles are surrounded by a layer of <b>thick-walled bundle sheath cells</b>.</li></ul>`,
terms:[['Adaxial','Upper surface of leaf'],['Abaxial','Lower surface – more stomata'],['Palisade','Vertical elongated parallel cells (adaxial)'],['Spongy','Loose round cells with air cavities'],['Bundle sheath','Thick-walled cells around leaf bundles']],qk:'dorsiventral|palisade|spongy|abaxial|adaxial'});
n6('c6-mleaf',{notes:`
<h4><span class="num">6.2.6</span>Isobilateral (monocotyledonous) leaf (Fig. 6.5b)</h4><ul>
<li>Similar to the dorsiventral leaf in many ways, with these characteristic differences:</li>
<li><b>Stomata are present on both surfaces</b> of the epidermis.</li>
<li>The <b>mesophyll is not differentiated</b> into palisade and spongy parenchyma.</li>
<li>In <b>grasses</b>, certain <b>adaxial epidermal cells along the veins</b> modify into <b>large, empty, colourless</b> cells – <span class="term">bulliform cells</span>.</li>
<li>When bulliform cells have <b>absorbed water and are turgid</b>, the leaf surface is <b>exposed</b>. When they are <b>flaccid due to water stress</b>, the leaves <b>curl inwards</b> to minimise water loss.</li>
<li>The <b>parallel venation</b> of monocot leaves is reflected in the <b>near similar sizes of vascular bundles</b> (except in main veins).</li></ul>`,
terms:[['Isobilateral','Monocot leaf – stomata on both surfaces'],['Bulliform cells','Large empty colourless adaxial cells (grasses)'],['Turgid bulliform','Leaf surface exposed'],['Flaccid bulliform','Leaf curls inwards – less water loss']],qk:'isobilateral|bulliform|similar sizes'});
n6('c6-viewer',{notes:`<p>Use this viewer to revise all six sections in one place. Tap <b>🚶 Walk outside → in</b> to step through every layer in order with Focus Mode, then switch <b>Labels off</b> and test yourself.</p>`,qk:'dicot|monocot'});
n6('c6-compare',{notes:`<ul><li><b>Monocots and dicots show marked variation</b> in internal structure. They differ in <b>type, number and location of vascular bundles</b>.</li><li><b>Secondary growth</b> occurs in most dicotyledonous roots and stems.</li></ul>`,qk:'monocot|dicot'});
n6('c6-summary',{notes:`<ul>
<li>Anatomically, a plant is made of different kinds of tissues: <b>meristematic</b> (apical, lateral, intercalary) and <b>permanent</b> (simple and complex).</li>
<li>Functions of tissues: <b>assimilation of food and its storage</b>, <b>transportation of water, minerals and photosynthates</b>, and <b>mechanical support</b>.</li>
<li>Three tissue systems: <b>epidermal, ground and vascular</b>. Epidermal = epidermal cells, stomata and appendages. Ground = main bulk – <b>cortex, pericycle and pith</b>. Vascular = <b>xylem and phloem</b>.</li>
<li>Based on presence of cambium and location of xylem and phloem, vascular bundles are of different types; they conduct water, minerals and food.</li>
<li>Monocots and dicots differ in <b>type, number and location of vascular bundles</b>. Secondary growth occurs in most dicot roots and stems.</li></ul>`,qk:'.'});

function leafShape(x,y,ang,len,w,cls='fl',part='leaf',pet=0,extra=''){
  return `<g data-part="${part}" transform="translate(${x} ${y}) rotate(${ang})" ${extra}>${pet?`<line x1="0" y1="0" x2="${pet}" y2="0" class="sl2" stroke-width="3"/>`:''}<path d="M${pet} 0 C${pet+len*.25} ${-w} ${pet+len*.7} ${-w*.9} ${pet+len} 0 C${pet+len*.7} ${w*.9} ${pet+len*.25} ${w} ${pet} 0 Z" class="${cls} ink"/><line x1="${pet}" y1="0" x2="${pet+len*.92}" y2="0" class="sl2" stroke-width="1.5"/></g>`;}
function flowerTop(cx,cy,r,part='flower'){let s=`<g data-part="${part}">`;for(let i=0;i<5;i++)s+=`<ellipse cx="${cx}" cy="${cy-r*.55}" rx="${r*.36}" ry="${r*.55}" class="fp ink" transform="rotate(${i*72} ${cx} ${cy})"/>`;return s+`<circle cx="${cx}" cy="${cy}" r="${r*.28}" class="fa ink"/></g>`;}

  let k=0;const max=5;const R=$('.isr',el),C=$('.isc',el);

  const draw=(newest)=>{

    for(let i=0;i<k;i++){const y=300-i*48,side=i%2?1:-1,x=120+side*42;r+=`<path d="M120 ${y+6} L${x} ${y}" class="sst" stroke-width="3"/>`+fl(x,y,k-i+1,i+1,newest&&i===k-1);}
    R.innerHTML=r+`<text x="120" y="${top-34}" text-anchor="middle" class="dtext" font-size="11">growing tip ↑</text>`;
    let c=`<rect width="240" height="360" class="fw"/><path d="M120 350 L120 60" class="sst" stroke-width="6"/>`;
    if(k>=1)c+=fl(120,50,k+1,1,newest&&k===1);
    for(let i=1;i<k;i++){const y=60+i*54,side=i%2?1:-1,x=120+side*46;c+=`<path d="M120 ${y+8} L${x} ${y}" class="sst" stroke-width="3"/>`+fl(x,y,k-i+1,i+1,newest&&i===k-1);}
    if(k===0)c+=`<text x="120" y="40" text-anchor="middle" class="dtext" font-size="11">apex ↓ becomes a flower</text>`;
    C.innerHTML=c;
    $$('.popin',el).forEach(g=>g.animate([{transform:'scale(0)'},{transform:'scale(1.2)'},{transform:'scale(1)'}],{duration:600,easing:'ease-out'}));};
  let play=null;
  $('.igrow',el).onclick=()=>{if(k>=max){k=0;}k++;draw(true);};

  draw();return el;
}

/* --- symmetry tool --- */
function symmetryWidget(){
  const el=h(`<div class="card"><h3>✂️ Symmetry tool</h3><p class="muted small">Drag a cutting line across the flower. Can you split it into two similar halves?</p><div class="sym-seg"></div><div class="dg" style="margin-top:10px"><div class="dg-view" style="touch-action:none"><svg viewBox="0 0 400 400" style="width:100%;max-width:380px;margin:0 auto;touch-action:none;user-select:none"></svg></div></div><div class="fb ok sym-msg" style="background:var(--card2)">Draw a line straight through the middle of the flower.</div><div class="row mt"><button class="btn ghost sm sym-demo">🪄 Show me</button><span class="small muted sym-tries"></span></div></div>`);
  const svg=$('svg',el),msg=$('.sym-msg',el);let kind='act';let found=0;
  const FL={act:{name:'Actinomorphic (radial symmetry)',eg:'mustard, datura, chilli'},zyg:{name:'Zygomorphic (bilateral symmetry)',eg:'pea, gulmohur, bean, Cassia'},asy:{name:'Asymmetric (irregular)',eg:'canna'}};
  const draw=()=>{let s='<defs><clipPath id="symc"><circle cx="200" cy="200" r="175"/></clipPath></defs><rect width="400" height="400" class="fw"/>';
    if(kind==='act'){for(let i=0;i<5;i++)s+=`<path d="M200 200 C150 150 160 60 200 48 C240 60 250 150 200 200 Z" class="fp ink" transform="rotate(${i*72} 200 200)"/>`;s+=`<circle cx="200" cy="200" r="34" class="fa ink"/><circle cx="200" cy="200" r="12" class="fo ink"/>`;}
    else if(kind==='zyg'){s+=`<path d="M200 205 C110 200 70 120 110 70 C150 30 250 30 290 70 C330 120 290 200 200 205 Z" class="fp ink"/>
      <path d="M195 210 C150 190 70 220 66 270 C70 310 140 300 190 240 Z" class="fp2 ink"/><path d="M205 210 C250 190 330 220 334 270 C330 310 260 300 210 240 Z" class="fp2 ink"/>
      <path d="M200 220 C178 250 172 300 200 335 C228 300 222 250 200 220 Z" class="ink" style="fill:#fbd0df"/><line x1="200" y1="225" x2="200" y2="330" class="ink2" stroke="#b05" /><circle cx="200" cy="208" r="10" class="fa ink"/>`;}
    else{s+=`<path d="M200 200 C130 190 90 100 140 60 C190 40 220 130 200 200 Z" class="ink" style="fill:#f59e3b"/><path d="M200 200 C260 150 340 160 350 220 C330 260 250 240 200 200 Z" class="ink" style="fill:#ef6a3a"/><path d="M200 200 C190 260 120 330 80 300 C70 250 150 220 200 200 Z" class="ink" style="fill:#f3b52b"/><path d="M200 200 C240 240 260 320 220 350 C190 330 195 270 200 200 Z" class="ink" style="fill:#e04f3a"/><circle cx="200" cy="200" r="12" class="fo ink"/>`;}
    s+='<g class="cut"></g>';svg.innerHTML=s;};
  const sg=seg([['act','🌼 Datura type'],['zyg','🫛 Pea type'],['asy','🌺 Canna type']],kind,v=>{kind=v;found=0;draw();msg.className='fb sym-msg';msg.style.background='var(--card2)';msg.innerHTML='Draw a line straight through the middle of the flower.';});
  $('.sym-seg',el).appendChild(sg);draw();
  const pt=e=>{const r=svg.getBoundingClientRect();return [(e.clientX-r.left)*400/r.width,(e.clientY-r.top)*400/r.height];};
  let a=null;
  const showLine=(p,q,res)=>{const g=$('.cut',svg);const dx=q[0]-p[0],dy=q[1]-p[1];const L=Math.hypot(dx,dy)||1;const nx=-dy/L,ny=dx/L;
    let html='';if(res!==undefined){const far=600;const c1=[200+dx/L*far,200+dy/L*far],c2=[200-dx/L*far,200-dy/L*far];
      const poly=(s)=>`${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${c2[0]+nx*far*s},${c2[1]+ny*far*s} ${c1[0]+nx*far*s},${c1[1]+ny*far*s}`;
      html+=`<g clip-path="url(#symc)" opacity=".2"><polygon points="${poly(1)}" fill="${res?'#22a55b':'#e0485a'}"/><polygon points="${poly(-1)}" fill="${res?'#2a74d4':'#f3b52b'}"/></g>`;}
    html+=`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${res===undefined?'#333':res?'#22a55b':'#e0485a'}" stroke-width="4" stroke-dasharray="10 7" stroke-linecap="round"/>`;g.innerHTML=html;};
  const evaluate=(p,q)=>{const dx=q[0]-p[0],dy=q[1]-p[1],L=Math.hypot(dx,dy);if(L<120){msg.className='fb sym-msg';msg.innerHTML='Make a longer cut – drag right across the flower ✂️';return;}
    const dist=Math.abs(dx*(p[1]-200)-dy*(p[0]-200))/L;let ang=Math.abs(Math.atan2(dy,dx)*180/Math.PI);if(ang>90)ang=180-ang;
    let ok;if(dist>22)ok=false;else if(kind==='act')ok=true;else if(kind==='zyg')ok=ang>76;else ok=false;
    showLine(p,q,ok);
    if(ok){found++;msg.className='fb ok sym-msg';msg.style.background='';el.querySelector('.dg').classList.remove('shake');void msg.offsetWidth;msg.classList.add('bounce');
      msg.innerHTML=kind==='act'?`<b>✅ Two equal halves! (${found} cut${found>1?'s':''} so far)</b>Try another angle – any radial plane through the centre works. This flower is <span class="term">actinomorphic</span> (radial symmetry), e.g. <span class="eg">${FL.act.eg}</span>.`:`<b>✅ That's the only plane that works!</b>A flower that splits into two similar halves in only one vertical plane is <span class="term">zygomorphic</span> (bilateral symmetry), e.g. <span class="eg">${FL.zyg.eg}</span>.`;}
    else{msg.className='fb bad sym-msg';msg.style.background='';el.querySelector('.dg').classList.remove('shake');void el.offsetWidth;el.querySelector('.dg').classList.add('shake');
      msg.innerHTML=dist>22?'<b>Missed the centre</b>The cut must pass through the centre of the flower.':kind==='zyg'?'<b>Not similar halves</b>For this flower only one particular vertical plane gives similar halves. Try again!':`<b>No luck – and there never will be!</b>No vertical plane through the centre divides it into similar halves: it is <span class="term">asymmetric (irregular)</span>, as in <span class="eg">canna</span>.`;}
  };
  svg.addEventListener('pointerdown',e=>{a=pt(e);svg.setPointerCapture(e.pointerId);});
  svg.addEventListener('pointermove',e=>{if(a)showLine(a,pt(e));});
  svg.addEventListener('pointerup',e=>{if(!a)return;const b=pt(e);evaluate(a,b);a=null;});
  $('.sym-demo',el).onclick=async()=>{const ang=kind==='act'?Math.random()*Math.PI:Math.PI/2;const p=[200-Math.cos(ang)*180,200-Math.sin(ang)*180];for(let t=0;t<=1;t+=.08){showLine(p,[p[0]+Math.cos(ang)*360*t,p[1]+Math.sin(ang)*360*t]);await sleep(25);}evaluate(p,[200+Math.cos(ang)*180,200+Math.sin(ang)*180]);};
  return el;
}

function arcPath(c,hw,rs,re){const N=24;let d='';for(let i=0;i<=N;i++){const t=i/N,a=(c-hw+2*hw*t)*Math.PI/180,r=rs+(re-rs)*t;d+=(i?'L':'M')+(100+Math.cos(a)*r).toFixed(1)+' '+(100+Math.sin(a)*r).toFixed(1);}return d;}

    if(A.names){const a=c*Math.PI/180,r=(rs+re)/2+(i===0?24:i===1||i===4?20:-30);s+=`<text x="${100+Math.cos(a)*r}" y="${100+Math.sin(a)*r+4}" text-anchor="middle" class="dtext" font-size="10">${A.names[i]}</text>`;}});

function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function P(a,r){return [Math.cos(a)*r,Math.sin(a)*r];}
/* ring of cells: tangential ellipses */
function ring(r,n,rx,ry,style,extra=''){let s='';for(let i=0;i<n;i++){const a=i/n*Math.PI*2+(extra==='off'?Math.PI/n:0);const [x,y]=P(a,r);s+=`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${rx}" ry="${ry}" transform="rotate(${(a*180/Math.PI+90).toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})" ${style}/>`;}return s;}
/* fill an annulus with roughly round cells */
function cellsAnnulus(r0,r1,size,style,seed=1){let s='';let k=0;for(let r=r0+size;r<=r1-size*.6;r+=size*1.9){const n=Math.max(6,Math.floor(2*Math.PI*r/(size*2.05)));for(let i=0;i<n;i++){const a=i/n*Math.PI*2+(k%2)*Math.PI/n+rnd(seed+k*31+i)*.05;const [x,y]=P(a,r);const rr=size*(.85+rnd(seed+i+k)*.2);s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rr.toFixed(1)}" ${style}/>`;}k++;}return s;}

function leafVS(iso){let s=`<rect x="0" y="0" width="660" height="420" class="fw"/>`;
  const top=60,bot=360;
  s+=`<g data-part="cut"><rect x="20" y="${top-6}" width="620" height="6" fill="#e6b422"/><rect x="20" y="${bot+28}" width="620" height="6" fill="#e6b422"/></g>`;
  // upper epidermis
  let ue='';for(let x=20;x<640;x+=26){if(iso&&x>250&&x<380)continue;ue+=`<rect x="${x}" y="${top}" width="26" height="24" rx="3" class="fep" stroke="var(--d-ink)" stroke-width=".8"/>`;}
  s+=`<g data-part="uepi">${ue}</g>`;
  if(iso){s+=`<g data-part="bull">${[[254,36],[290,44],[334,44],[378,0]].filter(([x,w])=>w).map(([x,w])=>`<path d="M${x} ${top} h${w} v34 q${-w/2} 14 ${-w} 0 z" fill="#f4fbff" stroke="var(--d-ink)" stroke-width="1"/>`).join('')}</g>`;}
  // lower epidermis with stomata
  let le='',st='';const stX=iso?[120,520]:[110,300,500];
  for(let x=20;x<640;x+=26){if(stX.some(q=>x>=q-14&&x<q+22))continue;le+=`<rect x="${x}" y="${bot+4}" width="26" height="24" rx="3" class="fep" stroke="var(--d-ink)" stroke-width=".8"/>`;}
  stX.forEach(q=>st+=`<ellipse cx="${q}" cy="${bot+16}" rx="9" ry="10" fill="#7cc46b" stroke="var(--d-ink)"/><ellipse cx="${q+22}" cy="${bot+16}" rx="9" ry="10" fill="#7cc46b" stroke="var(--d-ink)"/>`);
  if(iso)[180,470].forEach(q=>{st+=`<ellipse cx="${q}" cy="${top+12}" rx="9" ry="10" fill="#7cc46b" stroke="var(--d-ink)"/><ellipse cx="${q+22}" cy="${top+12}" rx="9" ry="10" fill="#7cc46b" stroke="var(--d-ink)"/>`;});
  if(iso)ue='';
  s+=`<g data-part="lepi">${le}</g><g data-part="stoma">${st}</g>`;
  if(!iso){
    let pal='';for(let x=22;x<638;x+=17){if(x>270&&x<390)continue;pal+=`<rect x="${x}" y="${top+26}" width="15" height="88" rx="7" class="fco" stroke="var(--d-ink)" stroke-width=".8"/>${[0,1,2,3].map(k=>`<circle cx="${x+4+(k%2)*7}" cy="${top+40+k*20}" r="2.6" class="fch"/>`).join('')}`;}
    s+=`<g data-part="pal">${pal}</g>`;
    let sp='';for(let i=0;i<70;i++){const x=34+rnd(i)*590,y=top+128+rnd(i+99)*160;if(x>255&&x<405&&y<300)continue;if(stX.some(q=>Math.abs(x-q-11)<30&&y>300))continue;sp+=`<ellipse cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="${12+rnd(i+5)*4}" ry="${9+rnd(i+7)*4}" class="fco" stroke="var(--d-ink)" stroke-width=".7"/><circle cx="${(x-3).toFixed(0)}" cy="${y.toFixed(0)}" r="2.3" class="fch"/>`;}
    s+=`<g data-part="spo">${sp}</g>`;
    s+=`<g data-part="air">${stX.map(q=>`<path d="M${q-14} ${bot+2} q25 -40 50 0 z" fill="#eaf6fb" stroke="var(--d-ink)" stroke-width=".6" stroke-dasharray="3 3"/>`).join('')}</g>`;
    s+=leafBundle(330,200,1.25);
  } else {
    let me='';for(let i=0;i<120;i++){const x=30+rnd(i+3)*600,y=top+36+rnd(i+77)*262;if([[150,200],[330,190],[510,200]].some(([bx,by])=>Math.hypot(x-bx,(y-by)*.9)<62))continue;if(x>246&&x<414&&y<top+60)continue;me+=`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${10+rnd(i)*3}" class="fco" stroke="var(--d-ink)" stroke-width=".7"/><circle cx="${(x+3).toFixed(0)}" cy="${y.toFixed(0)}" r="2.3" class="fch"/>`;}
    s+=`<g data-part="meso">${me}</g>`;
    s+=leafBundle(150,200,.85)+leafBundle(330,200,1)+leafBundle(510,200,.85);
  }
  return s;}

function stomaSVG(t,grass){ // t: 0 closed .. 1 open
  let s=`<rect width="420" height="320" class="fw"/>`;
  // epidermal jigsaw cells
  let ep='';const cells=[[0,0,140,110],[140,0,140,70],[280,0,140,110],[0,110,90,100],[330,110,90,100],[0,210,140,110],[140,250,140,70],[280,210,140,110]];
  cells.forEach(([x,y,w,h],i)=>ep+=`<path d="M${x+4} ${y+4} q${w/4} 8 ${w/2} 0 t${w/2-8} 0 q-8 ${h/4} 0 ${h/2} t0 ${h/2-8} q${-w/4} -8 ${-w/2} 0 t${-w/2+8} 0 q8 ${-h/4} 0 ${-h/2} t0 ${-h/2+8} z" class="fep" stroke="var(--d-ink)" stroke-width="1.2"/>`);
  s+=`<g data-part="epic">${ep}</g>`;
  const cx=210,cy=160;
  if(!grass){
    s+=`<g data-part="sub"><path d="M100 80 C150 60 270 60 320 80 L330 240 C270 262 150 262 90 240 Z" fill="#dff1d0" stroke="var(--d-ink)" stroke-width="1.2"/><line x1="210" y1="66" x2="210" y2="96" stroke="var(--d-ink)"/><line x1="210" y1="226" x2="210" y2="256" stroke="var(--d-ink)"/></g>`;
    const w=8+t*20; // half width of pore
    const g=side=>{const k=side;const inner=`${cx+k*w}`;return `<path d="M${cx} ${cy-72} C${cx+k*(w+60)} ${cy-70} ${cx+k*(w+66)} ${cy+70} ${cx} ${cy+72} C${cx+k*(w+10)} ${cy+50} ${cx+k*(w)} ${cy+20} ${inner} ${cy} C${cx+k*w} ${cy-20} ${cx+k*(w+10)} ${cy-50} ${cx} ${cy-72} Z" fill="#8fd27a" stroke="var(--d-ink)" stroke-width="1.5"/><path d="M${cx+k*(w+3)} ${cy-40} C${cx+k*(w+1)} ${cy-10} ${cx+k*(w+1)} ${cy+10} ${cx+k*(w+3)} ${cy+40}" stroke="#2f6a2a" stroke-width="5" fill="none" stroke-linecap="round"/>`;};
    s+=`<g data-part="guard">${g(-1)}${g(1)}</g>`;
    s+=`<g data-part="chl">${[[-1,-40],[-1,0],[-1,40],[1,-40],[1,0],[1,40]].map(([k,y])=>`<ellipse cx="${cx+k*(w+24-Math.abs(y)*.25)}" cy="${cy+y}" rx="6" ry="4" class="fch"/>`).join('')}</g>`;
    s+=`<g data-part="pore"><path d="M${cx} ${cy-60} C${cx-w} ${cy-22} ${cx-w} ${cy+22} ${cx} ${cy+60} C${cx+w} ${cy+22} ${cx+w} ${cy-22} ${cx} ${cy-60} Z" fill="#1d2a22" opacity="${.25+t*.6}"/></g>`;
  } else {
    s+=`<g data-part="sub"><path d="M60 100 C120 86 300 86 360 100 L360 128 C300 120 120 120 60 128 Z" fill="#dff1d0" stroke="var(--d-ink)" stroke-width="1.2"/><path d="M60 220 C120 234 300 234 360 220 L360 192 C300 200 120 200 60 192 Z" fill="#dff1d0" stroke="var(--d-ink)" stroke-width="1.2"/></g>`;
    const w=3+t*13;
    const g=k=>`<path d="M100 ${cy+k*(w)} C100 ${cy+k*(w+40)} 160 ${cy+k*(w+40)} 160 ${cy+k*(w+14)} L260 ${cy+k*(w+14)} C260 ${cy+k*(w+40)} 320 ${cy+k*(w+40)} 320 ${cy+k*w} Z" fill="#8fd27a" stroke="var(--d-ink)" stroke-width="1.5"/><line x1="160" y1="${cy+k*(w+5)}" x2="260" y2="${cy+k*(w+5)}" stroke="#2f6a2a" stroke-width="5" stroke-linecap="round"/>`;
    s+=`<g data-part="guard">${g(-1)}${g(1)}</g>`;
    s+=`<g data-part="chl">${[-1,1].map(k=>`<ellipse cx="128" cy="${cy+k*(w+20)}" rx="6" ry="4" class="fch"/><ellipse cx="292" cy="${cy+k*(w+20)}" rx="6" ry="4" class="fch"/>`).join('')}</g>`;
    s+=`<g data-part="pore"><rect x="160" y="${cy-w}" width="100" height="${2*w}" rx="${w}" fill="#1d2a22" opacity="${.25+t*.6}"/></g>`;
  }
  return s;}

 stem:{a:D_DSTEM,b:D_MSTEM,n:'Stem',d:[

 leaf:{a:D_DLEAF,b:D_MLEAF,n:'Leaf',d:[

/* ===== Exam-mode Q&A: all NCERT end-of-chapter exercises ===== */
const EXAM=[
{id:'e5-1',ch:5,q:'How is a pinnately compound leaf different from a palmately compound leaf?',a:`<table class="cmp"><tr><th>Pinnately compound</th><th>Palmately compound</th></tr><tr><td>A number of <b>leaflets</b> are present on a <b>common axis</b>, the <b>rachis</b>.</td><td>Leaflets are attached at a <b>common point</b>, i.e. at the <b>tip of the petiole</b>.</td></tr><tr><td>The rachis represents the <b>midrib</b> of the leaf.</td><td>There is no rachis.</td></tr><tr><td>e.g. <b>neem</b></td><td>e.g. <b>silk cotton</b></td></tr></table><p>In both, a <b>bud</b> is present in the axil of the petiole but <b>not in the axil of leaflets</b>.</p>`,dg:'c5-leaf'},
{id:'e5-2',ch:5,q:'Explain with suitable examples the different types of phyllotaxy.',a:`<p><b>Phyllotaxy</b> is the pattern of arrangement of leaves on the stem or branch. It is of three types:</p><ul><li><b>Alternate</b> – a single leaf arises at each node in an alternate manner, e.g. <b>china rose, mustard, sunflower</b>.</li><li><b>Opposite</b> – a pair of leaves arises at each node and lie opposite to each other, e.g. <b>Calotropis, guava</b>.</li><li><b>Whorled</b> – more than two leaves arise at a node and form a whorl, e.g. <b>Alstonia</b>.</li></ul>`,dg:'c5-leaf'},
{id:'e5-3a',ch:5,q:'Define: (a) aestivation',a:`<p><b>Aestivation</b> is the mode of arrangement of <b>sepals or petals in a floral bud</b> with respect to the other members of the <b>same whorl</b>. Main types: <b>valvate</b> (Calotropis), <b>twisted</b> (china rose, lady's finger, cotton), <b>imbricate</b> (Cassia, gulmohur) and <b>vexillary</b> (pea, bean).</p>`,dg:'c5-calcor'},
{id:'e5-3b',ch:5,q:'Define: (b) placentation',a:`<p><b>Placentation</b> is the <b>arrangement of ovules within the ovary</b>. Types: <b>marginal</b> (pea), <b>axile</b> (china rose, tomato, lemon), <b>parietal</b> (mustard, Argemone), <b>free central</b> (Dianthus, Primrose) and <b>basal</b> (sunflower, marigold).</p>`,dg:'c5-andgyn'},
{id:'e5-3c',ch:5,q:'Define: (c) actinomorphic',a:`<p>A flower is <b>actinomorphic</b> (radial symmetry) when it can be divided into <b>two equal radial halves in any radial plane</b> passing through the centre, e.g. <b>mustard, datura, chilli</b>.</p>`,dg:'c5-flower'},
{id:'e5-3d',ch:5,q:'Define: (d) zygomorphic',a:`<p>A flower is <b>zygomorphic</b> (bilateral symmetry) when it can be divided into two similar halves <b>only in one particular vertical plane</b>, e.g. <b>pea, gulmohur, bean, Cassia</b>.</p>`,dg:'c5-flower'},
{id:'e5-3e',ch:5,q:'Define: (e) superior ovary',a:`<p>In a <b>hypogynous</b> flower the <b>gynoecium occupies the highest position</b> on the thalamus while the other parts (calyx, corolla, androecium) are situated below it. Such an ovary is called <b>superior</b>, e.g. <b>mustard, china rose, brinjal</b>. In the floral formula it is shown as <b>G with a line below</b>.</p>`,dg:'c5-flower'},
{id:'e5-3f',ch:5,q:'Define: (f) perigynous flower',a:`<p>A flower in which the <b>gynoecium is situated in the centre</b> and the other parts are located on the <b>rim of the thalamus almost at the same level</b>. The ovary is <b>half-inferior</b>, e.g. <b>plum, rose, peach</b>.</p>`,dg:'c5-flower'},
{id:'e5-3g',ch:5,q:'Define: (g) epipetalous stamen',a:`<p>Stamens that are <b>attached to the petals</b> are called <b>epipetalous</b>, e.g. <b>brinjal</b> (and Solanaceae in general). In the floral formula, this adhesion is shown by a line joining C and A.</p>`,dg:'c5-andgyn'},
{id:'e5-4a',ch:5,q:'Differentiate between racemose and cymose inflorescence.',a:`<table class="cmp"><tr><th>Racemose</th><th>Cymose</th></tr><tr><td>Main axis <b>continues to grow</b> (unlimited growth).</td><td>Main axis <b>terminates in a flower</b> (limited growth).</td></tr><tr><td>Flowers borne <b>laterally</b> in <b>acropetal succession</b>.</td><td>Flowers borne in <b>basipetal order</b>.</td></tr><tr><td>Older flowers at the base, younger at the apex.</td><td>Oldest flower at the apex, younger ones below.</td></tr></table>`,dg:'c5-infl'},
{id:'e5-4b',ch:5,q:'Differentiate between apocarpous and syncarpous ovary.',a:`<table class="cmp"><tr><th>Apocarpous</th><th>Syncarpous</th></tr><tr><td>More than one carpel present and they are <b>free</b>.</td><td>The carpels are <b>fused</b>.</td></tr><tr><td>e.g. <b>lotus, rose</b></td><td>e.g. <b>mustard, tomato</b></td></tr></table>`,dg:'c5-andgyn'},
{id:'e5-5',ch:5,q:'Draw the labelled diagram of (i) gram seed and (ii) V.S. of maize seed.',a:`<p><b>(i) Gram seed (dicot)</b> – label: <b>seed coat</b> (testa + tegmen), <b>hilum</b>, <b>micropyle</b>, <b>cotyledon</b> (two, fleshy), <b>embryonal axis</b>, <b>plumule</b>, <b>radicle</b>.</p><p><b>(ii) V.S. of maize seed (monocot)</b> – label: <b>seed coat & fruit-wall</b>, <b>aleurone layer</b>, <b>endosperm</b>, <b>embryo</b>, <b>scutellum</b>, <b>coleoptile</b>, <b>plumule</b>, <b>radicle</b>, <b>coleorhiza</b>.</p><p class="small muted">Tip: open the diagrams, switch labels off and practise naming each part.</p>`,dg:'c5-seed'},
{id:'e5-6',ch:5,q:'Take one flower of the family Solanaceae and write its semi-technical description. Also draw its floral diagram.',a:`<p><b>Family Solanaceae</b> (potato family), e.g. <i>Solanum nigrum</i> (makoi)</p><ul><li><b>Habit</b>: mostly herbs, shrubs, rarely small trees.</li><li><b>Stem</b>: herbaceous, rarely woody, aerial, erect, cylindrical, branched, solid or hollow, hairy or glabrous; underground stem in potato.</li><li><b>Leaves</b>: alternate, simple, rarely pinnately compound, exstipulate; venation reticulate.</li><li><b>Inflorescence</b>: solitary, axillary or cymose.</li><li><b>Flower</b>: bisexual, actinomorphic.</li><li><b>Calyx</b>: sepals five, united, persistent, valvate.</li><li><b>Corolla</b>: petals five, united, valvate.</li><li><b>Androecium</b>: stamens five, epipetalous.</li><li><b>Gynoecium</b>: bicarpellary, obliquely placed, syncarpous; ovary superior, bilocular; placenta swollen with many ovules; axile.</li><li><b>Fruit</b>: berry or capsule. <b>Seeds</b>: many, endospermous.</li><li><b>Floral formula</b>: ⊕ ⚥ K<sub>(5)</sub> C<sub>(5)</sub> A<sub>5</sub> <u>G</u><sub>(2)</sub> (C and A joined).</li><li><b>Floral diagram</b>: mother axis dot on top; 5 united sepals; 5 united petals; 5 epipetalous stamens; bicarpellary, bilocular, obliquely placed ovary with axile placentation.</li></ul>`,dg:'c5-sol'},
{id:'e5-7',ch:5,q:'Describe the various types of placentations found in flowering plants.',a:`<p>The arrangement of ovules within the ovary is <b>placentation</b>:</p><ul><li><b>Marginal</b> – placenta forms a ridge along the <b>ventral suture</b>; ovules on this ridge in <b>two rows</b>, e.g. <b>pea</b>.</li><li><b>Axile</b> – placenta is <b>axial</b>, ovules attached to it in a <b>multilocular</b> ovary, e.g. <b>china rose, tomato, lemon</b>.</li><li><b>Parietal</b> – ovules on the <b>inner wall</b> of the ovary or peripheral part; one-chambered ovary becomes two-chambered by a <b>false septum</b>, e.g. <b>mustard, Argemone</b>.</li><li><b>Free central</b> – ovules on a <b>central axis</b>, <b>septa absent</b>, e.g. <b>Dianthus, Primrose</b>.</li><li><b>Basal</b> – placenta at the <b>base</b> of the ovary with a <b>single ovule</b>, e.g. <b>sunflower, marigold</b>.</li></ul>`,dg:'c5-andgyn'},
{id:'e5-8',ch:5,q:'What is a flower? Describe the parts of a typical angiosperm flower.',a:`<p>A <b>flower</b> is the <b>reproductive unit</b> of angiosperms, meant for sexual reproduction. It is a <b>modified shoot</b> in which the shoot apical meristem changes to a floral meristem.</p><p>A typical flower has four whorls on the <b>thalamus</b> (swollen end of the pedicel):</p><ul><li><b>Calyx</b> – outermost whorl of <b>sepals</b>; green, leaf-like, protect the bud; gamosepalous or polysepalous.</li><li><b>Corolla</b> – <b>petals</b>, brightly coloured to attract insects for pollination; gamopetalous or polypetalous; tubular, bell, funnel or wheel-shaped.</li><li><b>Androecium</b> – <b>stamens</b> (male); each has a <b>filament</b> and a bilobed <b>anther</b> with pollen-sacs producing pollen grains.</li><li><b>Gynoecium</b> – <b>carpels</b> (female); each carpel has <b>stigma, style and ovary</b>; ovary bears ovules on a placenta.</li></ul><p>Calyx and corolla are <b>accessory</b>; androecium and gynoecium are <b>reproductive</b> organs.</p>`,dg:'c5-flower'},
{id:'e5-9',ch:5,q:'Define the term inflorescence. Explain the basis for the different types of inflorescence in flowering plants.',a:`<p><b>Inflorescence</b> is the arrangement of flowers on the floral axis.</p><p><b>Basis</b>: whether the <b>apex develops into a flower or continues to grow</b>.</p><ul><li><b>Racemose</b> – main axis continues to grow; flowers lateral in <b>acropetal</b> succession.</li><li><b>Cymose</b> – main axis terminates in a flower (limited growth); flowers in <b>basipetal</b> order.</li></ul>`,dg:'c5-infl'},
{id:'e5-10',ch:5,q:'Describe the arrangement of floral members in relation to their insertion on thalamus.',a:`<p>Based on the position of <b>calyx, corolla and androecium</b> with respect to the <b>ovary</b> on the thalamus:</p><ul><li><b>Hypogynous</b> – gynoecium occupies the <b>highest position</b>; other parts below it; ovary <b>superior</b> – mustard, china rose, brinjal.</li><li><b>Perigynous</b> – gynoecium in the centre, other parts on the <b>rim of the thalamus</b> almost at the same level; ovary <b>half-inferior</b> – plum, rose, peach.</li><li><b>Epigynous</b> – margin of thalamus <b>grows upward, enclosing and fusing with the ovary</b>; other parts arise above the ovary; ovary <b>inferior</b> – guava, cucumber, ray florets of sunflower.</li></ul>`,dg:'c5-flower'},
{id:'e6-1a',ch:6,q:'Draw illustrations to bring out the anatomical difference between (a) monocot root and dicot root.',a:`<table class="cmp"><tr><th>Dicot root</th><th>Monocot root</th></tr><tr><td>Usually <b>2–4 xylem</b> and phloem patches.</td><td>Usually <b>more than six</b> xylem bundles – <b>polyarch</b>.</td></tr><tr><td>Pith <b>small or inconspicuous</b>.</td><td>Pith <b>large and well developed</b>.</td></tr><tr><td>A <b>cambium ring</b> develops later between xylem and phloem (secondary growth).</td><td><b>No secondary growth</b>.</td></tr></table><p>Common features to draw in both: root hairs, epidermis/epiblema, cortex, endodermis with Casparian strips, pericycle, radial vascular bundles, pith.</p>`,dg:'c6-compare'},
{id:'e6-1b',ch:6,q:'Draw illustrations to bring out the anatomical difference between (b) monocot stem and dicot stem.',a:`<table class="cmp"><tr><th>Dicot stem</th><th>Monocot stem</th></tr><tr><td>Hypodermis <b>collenchymatous</b>.</td><td>Hypodermis <b>sclerenchymatous</b>.</td></tr><tr><td>Ground tissue differentiated into <b>cortex, endodermis (starch sheath), pericycle, medullary rays, pith</b>.</td><td>Large, undifferentiated <b>parenchymatous ground tissue</b>.</td></tr><tr><td>Vascular bundles in a <b>ring</b>.</td><td>Vascular bundles <b>scattered</b>; peripheral ones smaller.</td></tr><tr><td>Bundles <b>conjoint, open</b> (cambium), <b>endarch</b> protoxylem.</td><td>Bundles <b>conjoint, closed</b>, each with a <b>sclerenchymatous bundle sheath</b>.</td></tr><tr><td>Phloem parenchyma present.</td><td><b>Phloem parenchyma absent</b>; <b>water-containing cavities</b> present.</td></tr></table>`,dg:'c6-compare'},
{id:'e6-2',ch:6,q:'Cut a transverse section of young stem of a plant from your school garden and observe it under the microscope. How would you ascertain whether it is a monocot stem or a dicot stem? Give reasons.',a:`<p>Observe the arrangement and type of vascular bundles and the hypodermis:</p><ul><li>If vascular bundles are arranged in a <b>ring</b>, are <b>conjoint and open</b> (cambium between xylem and phloem), with <b>collenchymatous hypodermis</b>, distinct cortex, starch sheath, medullary rays and pith → <b>dicot stem</b>.</li><li>If vascular bundles are <b>scattered</b>, <b>conjoint and closed</b>, each surrounded by a <b>sclerenchymatous bundle sheath</b>, with <b>sclerenchymatous hypodermis</b>, large parenchymatous ground tissue, <b>no phloem parenchyma</b> and <b>water-containing cavities</b> → <b>monocot stem</b>.</li></ul>`,dg:'c6-compare'},
{id:'e6-3',ch:6,q:'The T.S. of a plant material shows: (a) the vascular bundles are conjoint, scattered and surrounded by sclerenchymatous bundle sheaths; (b) phloem parenchyma is absent. What will you identify it as?',a:`<p>It is a <b>monocot stem</b>.</p><p><b>Reasons</b>: scattered, conjoint (closed) vascular bundles, each surrounded by a <b>sclerenchymatous bundle sheath</b>, and absence of <b>phloem parenchyma</b> are characteristic features of the monocotyledonous stem.</p>`,dg:'c6-mstem'},
{id:'e6-4',ch:6,q:'What is stomatal apparatus? Explain the structure of stomata with a labelled diagram.',a:`<p>The <b>stomatal aperture, guard cells and the surrounding subsidiary cells</b> together form the <b>stomatal apparatus</b>.</p><ul><li>Stomata are present in the <b>epidermis of leaves</b>; they regulate <b>transpiration and gaseous exchange</b>.</li><li>Each stoma has two <b>bean-shaped guard cells</b> enclosing the <b>stomatal pore</b>; in grasses guard cells are <b>dumb-bell shaped</b>.</li><li><b>Outer walls</b> (away from pore) are <b>thin</b>; <b>inner walls</b> (towards pore) are <b>highly thickened</b>.</li><li>Guard cells possess <b>chloroplasts</b> and regulate opening and closing.</li><li>A few nearby epidermal cells become specialised – <b>subsidiary cells</b>.</li></ul><p>Label: epidermal cells, subsidiary cells, chloroplast, guard cells, stomatal pore.</p>`,dg:'c6-epi'},
{id:'e6-5',ch:6,q:'Name the three basic tissue systems in the flowering plants. Give the tissue names under each system.',a:`<ul><li><b>Epidermal tissue system</b> – epidermal cells, <b>stomata</b>, epidermal appendages (<b>trichomes and hairs</b>); cuticle on the outside.</li><li><b>Ground (fundamental) tissue system</b> – simple tissues <b>parenchyma, collenchyma, sclerenchyma</b>; forms <b>cortex, pericycle, pith, medullary rays</b>; <b>mesophyll</b> in leaves.</li><li><b>Vascular (conducting) tissue system</b> – complex tissues <b>xylem and phloem</b> forming vascular bundles (with <b>cambium</b> in dicot stems).</li></ul>`,dg:'c6-tissue'},
{id:'e6-6',ch:6,q:'How is the study of plant anatomy useful to us?',a:`<ul><li>Shows how <b>cells are organised into tissues and organs</b> and how internal structure relates to <b>function</b> (transport of water, minerals and food; support; photosynthesis; storage).</li><li>Helps to <b>distinguish monocots from dicots</b> and to <b>identify plant material</b> from a section (e.g. type, number and location of vascular bundles).</li><li>Reveals <b>adaptations to diverse environments</b>, e.g. cuticle and trichomes reduce water loss, bulliform cells curl leaves under water stress.</li><li>Helps to understand <b>secondary growth</b> (cambium) in dicot stems and roots.</li></ul>`,dg:'c6-summary'},
{id:'e6-7',ch:6,q:'Describe the internal structure of a dorsiventral leaf with the help of labelled diagrams.',a:`<p>A vertical section through the lamina shows three parts: <b>epidermis, mesophyll and vascular system</b>.</p><ul><li><b>Epidermis</b> – upper (<b>adaxial</b>) and lower (<b>abaxial</b>) with a conspicuous <b>cuticle</b>; abaxial bears <b>more stomata</b>, adaxial may lack them.</li><li><b>Mesophyll</b> – parenchyma with chloroplasts for photosynthesis: <b>palisade parenchyma</b> (adaxial, elongated, vertical, parallel cells) and <b>spongy parenchyma</b> (oval/round, loosely arranged, with large spaces and air cavities).</li><li><b>Vascular system</b> – bundles in veins and midrib; size depends on vein size (reticulate venation); each surrounded by thick-walled <b>bundle sheath</b> cells; <b>xylem towards the upper side</b>, phloem below.</li></ul><p>Label: cuticle, upper epidermis, palisade, spongy parenchyma, air cavity, bundle sheath, xylem, phloem, lower epidermis, stoma.</p>`,dg:'c6-dleaf'}];

function askExam(box,it,head){
  const e=EXAM.find(x=>x.id===it.id);if(!e)return Promise.resolve(false);
  return new Promise(res=>{
